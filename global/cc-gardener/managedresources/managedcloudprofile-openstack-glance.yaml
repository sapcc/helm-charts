{{ if .Values.extensions.openstack.enabled -}}
---
apiVersion: cloudprofilesync.cobaltcore.dev/v1alpha1
kind: ManagedCloudProfile
metadata:
  name: openstack-glance
spec:
  cloudProfile:
    type: openstack
    seedSelector:
      providerTypes: ["*"]
    regions: {{ toYaml .Values.extensions.openstack.regions | nindent 4 }}
    kubernetes:
      versions: {{ toYaml .Values.extensions.kubernetesVersions | nindent 6 }}
    machineTypes: {{ toYaml .Values.extensions.openstack.machineTypes | nindent 4 }}
    {{- if .Values.extensions.openstack.volumeTypes }}
    volumeTypes: {{ toYaml .Values.extensions.openstack.volumeTypes | nindent 4 }}
    {{- end }}
    machineImages: {{ toYaml .Values.extensions.openstack.machineImages | nindent 4 }}
    providerConfig: # https://github.com/gardener/gardener-extension-provider-openstack/blob/master/pkg/apis/openstack/types_cloudprofile.go
      apiVersion: openstack.provider.extensions.gardener.cloud/v1alpha1
      kind: CloudProfileConfig
      keystoneURLs:
      {{- range $region := .Values.extensions.openstack.regions }}
      - region: {{ $region.name | quote }}
        url: "https://identity-3.{{ $region.name }}.cloud.sap/v3"
      {{- end }}
      constraints:
        floatingPools:
        - name: FloatingIP*
          region: ap-ae-1
        - name: FloatingIP*
          region: ap-au-1
        - name: FloatingIP*
          region: ap-cn-1
        - name: FloatingIP*
          region: ap-jp-1
        - name: FloatingIP*
          region: ap-jp-2
        - name: FloatingIP*
          region: ap-sa-1
        - name: FloatingIP*
          region: ap-sa-2
        - name: FloatingIP*
          region: eu-de-1
        - name: FloatingIP*
          region: eu-de-2
        - name: FloatingIP*
          region: eu-nl-1
        - name: FloatingIP*
          region: la-br-1
        - name: FloatingIP*
          region: na-ca-1
        - name: FloatingIP*
          region: na-us-1
        - name: FloatingIP*
          region: na-us-2
        - name: FloatingIP*
          region: na-us-3
        loadBalancerProviders:
        - name: f5
      machineImages: {{ toYaml .Values.extensions.openstack.providerConfig.machineImages | nindent 6 }}
  machineImageUpdates:
  - imageName: gardenlinux
    source:
      # https://github.com/cobaltcore-dev/cloud-profile-sync/blob/main/api/v1alpha1/managedcloudprofile.go
      # glance.* values (incl. the vault-referenced password) are provided via the kube-secrets override.
      glance:
        authURLFormat: {{ .Values.extensions.openstack.glance.authURLFormat | quote }}
        regions:
        {{- range $region := .Values.extensions.openstack.regions }}
        - {{ $region.name | quote }}
        {{- end }}
        namePrefix: {{ .Values.extensions.openstack.glance.namePrefix | quote }}
        keepLatest: {{ .Values.extensions.openstack.glance.keepLatest }}
        projectName: {{ .Values.extensions.openstack.glance.projectName | quote }}
        projectDomainName: {{ .Values.extensions.openstack.glance.projectDomainName | quote }}
        username: {{ .Values.extensions.openstack.glance.username | quote }}
        userDomainName: {{ .Values.extensions.openstack.glance.userDomainName | quote }}
        passwordSecret:
          name: openstack-glance
          namespace: garden
          key: password
    provider:
      openStack: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: openstack-glance
  namespace: garden
  labels:
    app: gardener
type: Opaque
stringData:
  # vault reference supplied by the kube-secrets override; resolved by secrets-injector.
  password: {{ .Values.extensions.openstack.glance.password | quote }}
{{ end -}}
