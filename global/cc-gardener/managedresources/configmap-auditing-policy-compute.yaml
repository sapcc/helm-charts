{{ if and .Values.extensions.auditing.enabled (has "garden-compute" .Values.extensions.auditing.additionalNamespaces) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-policy-cp-compute
  namespace: garden-compute
data:
  policy: |-
    apiVersion: audit.k8s.io/v1
    kind: Policy
    metadata:
      name: audit-policy-cp-compute
    omitStages:
      - "RequestReceived"
    rules:
      # Lease renewals and events are high-volume noise; their deletes are still logged.
      - level: None
        verbs: ["create", "update", "patch"]
        resources:
          - group: "coordination.k8s.io"
            resources: ["leases"]
          - group: ""
            resources: ["events"]
          - group: "events.k8s.io"
            resources: ["events"]
      - level: Metadata
        verbs: ["create"]
        resources:
          - group: "authentication.k8s.io"
            resources: ["tokenreviews"]
          - group: "authorization.k8s.io"
            resources: ["subjectaccessreviews"]
      - level: Request
        verbs: ["get", "list", "watch"]
        resources:
          - group: ""
            resources: ["secrets"]
      - level: Metadata
        verbs: ["get", "list", "watch"]
        resources:
          - group: ""
            resources: ["configmaps", "serviceaccounts"]
      - level: Metadata
        resources:
          - group: "apps"
            resources: ["deployments", "daemonsets", "statefulsets"]
          - group: ""
            resources: ["pods"]
      - level: Metadata
        resources:
          - group: ""
            resources:
              - "pods/exec"
              - "pods/attach"
              - "pods/portforward"
              - "pods/log"
              - "pods/proxy"
              - "services/proxy"
              - "nodes/proxy"
      - level: Request
        resources:
          - group: "rbac.authorization.k8s.io"
            resources:
              - "roles"
              - "rolebindings"
              - "clusterroles"
              - "clusterrolebindings"
      - level: Metadata
        resources:
          - group: ""
            resources: ["nodes"]
      - level: Metadata
        verbs: ["create", "update", "patch", "delete", "deletecollection"]
{{- end }}
