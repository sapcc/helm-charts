{{- range $region := .Values.gardenlet.seedRegions }}
{{- if eq "aws" $region.backup.provider }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "aws-backup-%s" $region.name }}
  namespace: garden
type: Opaque
data:
  accessKeyID: {{ default (required "backup.accessKeyID missing" $.Values.garden.backup.accessKeyID) $region.backup.accessKeyID | b64enc }}
  secretAccessKey: {{ default (required "backup.secretAccessKey missing" $.Values.garden.backup.secretAccessKey) $region.backup.secretAccessKey | b64enc }}
  region: {{ default "eu-central-1" $region.backup.region | b64enc }}
{{- end }}
{{- end }}
