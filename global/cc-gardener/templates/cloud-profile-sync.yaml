{{ if .Values.cloudProfileSync.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-profile-sync
  labels:
    app: cloud-profile-sync
spec:
  selector:
    matchLabels:
      app: cloud-profile-sync
  replicas: {{ .Values.cloudProfileSync.replicaCount }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cloud-profile-sync
        networking.gardener.cloud/to-dns: allowed
        networking.gardener.cloud/to-public-networks: allowed
        networking.resources.gardener.cloud/to-virtual-garden-kube-apiserver-tcp-443: allowed
      annotations:
        kubectl.kubernetes.io/default-container: cloud-profile-sync
    spec:
      containers:
      - image: "{{ required ".Values.cloudProfileSync.image.repository is missing" .Values.cloudProfileSync.image.repository }}:{{ required ".Values.cloudProfileSync.image.tag is missing" .Values.cloudProfileSync.image.tag }}"
        imagePullPolicy: {{ .Values.cloudProfileSync.image.pullPolicy }}
        name: cloud-profile-sync
        command: ["/cloud-profile-sync"]
        args:
        - --zap-log-level={{ .Values.cloudProfileSync.logLevel | default "info" }}
        {{- if .Values.cloudProfileSync.enableCapabilities }}
        - --enable-machine-image-capabilities
        {{- end }}
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: virtual-garden-kube-apiserver.garden.svc.cluster.local
        volumeMounts:
        - name: kubeconfig
          mountPath: "/var/run/secrets/kubernetes.io/serviceaccount"
        ports:
        - name: metrics
          containerPort: 8080
      {{ if ne .Values.cloudProfileSync.topologyKey "" -}}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - cloud-profile-sync
            topologyKey: {{ .Values.cloudProfileSync.topologyKey }}
      {{ end -}}
      volumes:
        - name: kubeconfig
          secret:
            items:
            - key: token
              path: token
            - key: bundle.crt
              path: ca.crt
            secretName: cloud-profile-sync-kubeconfig
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-cloud-profile-sync-tcp-8080-from-kube-monitoring
  namespace: garden
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-monitoring
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app: cloud-profile-sync
  policyTypes:
  - Ingress
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloud-profile-sync
  namespace: kube-monitoring
  labels:
    plugin: kube-monitoring
spec:
  namespaceSelector:
    matchNames:
    - garden
  selector:
    matchLabels:
      app: cloud-profile-sync
  podMetricsEndpoints:
  - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloud-profile-sync
  namespace: garden
  labels:
    plugin: kube-monitoring
spec:
  groups:
  - name: cloud-profile-sync.alerts
    rules:
    - alert: CloudProfileSyncReconcileErrors
      expr: rate(controller_runtime_reconcile_errors_total{namespace="garden", pod=~"cloud-profile-sync.*"}[5m]) > 0
      for: 15m
      labels:
        tier: k8s
        service: cloud-profile-sync
        severity: warning
        support_group: containers
        playbook: "docs/support/playbook/kubernetes/cloud-profile-sync-reconcile-errors"
      annotations:
        summary: cloud-profile-sync reconciliation errors
        description: >-
          Controller {{ "{{ $labels.controller }}" }} in cloud-profile-sync has been returning
          reconcile errors for 15 minutes. Check pod logs: kubectl -n garden logs -l app=cloud-profile-sync
    - alert: CloudProfileSyncReconcilePanics
      expr: increase(controller_runtime_reconcile_panics_total{namespace="garden", pod=~"cloud-profile-sync.*"}[5m]) > 0
      labels:
        tier: k8s
        service: cloud-profile-sync
        severity: critical
        support_group: containers
        playbook: "docs/support/playbook/kubernetes/cloud-profile-sync-reconcile-errors"
      annotations:
        summary: cloud-profile-sync reconciliation panic
        description: >-
          Controller {{ "{{ $labels.controller }}" }} in cloud-profile-sync panicked.
          Check pod logs: kubectl -n garden logs -l app=cloud-profile-sync
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-profile-sync-kubeconfig
  labels:
    resources.gardener.cloud/purpose: token-requestor
    resources.gardener.cloud/class: shoot
  annotations:
    serviceaccount.resources.gardener.cloud/name: cloud-profile-sync
    serviceaccount.resources.gardener.cloud/namespace: garden
    serviceaccount.resources.gardener.cloud/inject-ca-bundle: "true"
stringData:
  token: ""
  bundle.crt: ""
{{ end -}}
