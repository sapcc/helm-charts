{{- if and .Values.garden.dashboard .Values.garden.dashboard.enabled (not (empty .Values.garden.dashboard.frontendConfig)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gardener-dashboard-frontend-config
  namespace: garden
data:
  frontend-config.yaml: |
    {{- toYaml .Values.garden.dashboard.frontendConfig | nindent 4 }}
{{- end }}
