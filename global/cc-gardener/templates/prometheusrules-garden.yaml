{{ if .Values.garden.prometheusRules.enabled -}}
# Mirrors the gardener-operator garden-sap-* PrometheusRules. Collected by the
# operator-managed prometheus-garden via ruleSelector matching label
# prometheus: garden in the garden namespace. This file is tpl-processed, so
# Prometheus {{ "{{ ... }}" }} expressions are escaped to survive templating.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garden-sap-project
  namespace: garden
  labels:
    prometheus: garden
spec:
  groups:
  - name: project
    rules:
    - alert: ProjectCountReached
      expr: count(garden_projects_status) > 0.9 * 5000
      for: 60m
      labels:
        severity: warning
        topology: garden
      annotations:
        summary: "Gardener project count has reached 90% of the 5000 project limit"
        description: >-
          The virtual garden currently holds {{ "{{ $value }}" }} projects, above 90%
          of the maximum of 5000. Verify whether this growth is expected and, if the
          limit is genuinely being approached, raise the projects count in the Garden
          admission configuration.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garden-sap-shoot
  namespace: garden
  labels:
    prometheus: garden
spec:
  groups:
  - name: shoot
    rules:
    - alert: NodeCountReached
      expr: |
        256 - shoot:kube_node_info:count{project="garden"} <= 20
      labels:
        severity: warning
        topology: garden
      annotations:
        summary: Node count approaching 256 nodes
        description: >-
          Seed {{ "{{ $labels.name }}" }} in landscape {{ "{{ $externalLabels.landscape }}" }}
          is approaching 256 nodes (/24 subnet limit). {{ "{{ $value }}" }} IP addresses
          left until the limit is reached.

    - alert: ShootAPIServerUnavailable10min
      expr: |
        garden_shoot_condition{condition       = "APIServerAvailable",
                              operation       = "Reconcile",
                              is_seed         = "false",
                              purpose         = "evaluation",
                              has_user_errors = "false"}
        == 0
      for: 10m
      labels:
        severity: critical
        topology: shoot
      annotations:
        summary: API Server Unavailable
        description: >-
          The shoot cluster {{ "{{ $labels.project }}" }}/{{ "{{ $labels.name }}" }}
          has condition APIServerAvailable false for more than 10 minutes. The shoot
          cluster may have an issue.

    - alert: ShootSystemComponentsUnhealthy
      expr: |
        max_over_time(
          garden_shoot_condition{condition       = "SystemComponentsHealthy",
                                operation       = "Reconcile",
                                is_seed         = "false",
                                purpose         = "evaluation",
                                is_compliant    = "True",
                                has_user_errors = "false"}[2m])
        == 0
      for: 30m
      labels:
        severity: critical
        topology: shoot
        mute_on_weekends: "true"
      annotations:
        summary: Shoot System Components Unhealthy
        description: >-
          The shoot cluster {{ "{{ $labels.project }}" }}/{{ "{{ $labels.name }}" }}
          has condition SystemComponentsHealthy == 0 for more than 30 minutes. Some
          components required by the shoot may have an issue.

    - alert: ShootControlPlaneUnhealthy
      expr: |
        max_over_time(
          garden_shoot_condition{condition       = "ControlPlaneHealthy",
                                operation       = "Reconcile",
                                is_seed         = "false",
                                purpose         = "evaluation",
                                is_compliant    = "True",
                                has_user_errors = "false"}[2m])
        == 0
      for: 30m
      labels:
        severity: critical
        topology: shoot
      annotations:
        summary: Shoot ControlPlane Components Unhealthy
        description: >-
          The shoot cluster {{ "{{ $labels.project }}" }}/{{ "{{ $labels.name }}" }}
          has condition ControlPlaneHealthy == 0 for more than 30 minutes. Some Control
          Plane components of the shoot may have an issue.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garden-sap-seed
  namespace: garden
  labels:
    prometheus: garden
spec:
  groups:
  - name: seed
    rules:
    - alert: SeedRegistryCachePersistentVolumeUsageCritical
      expr: ALERTS{alertname="RegistryCachePersistentVolumeUsageCritical",alertstate="firing",project="garden"}
      for: 10m
      labels:
        severity: warning
        topology: garden
      annotations:
        summary: Registry cache PersistentVolume almost full.
        description: >-
          In Seed cluster {{ "{{ $labels.project }}" }}/{{ "{{ $labels.shoot_name }}" }}
          the registry-cache PersistentVolume claimed by
          {{ "{{ $labels.persistentvolumeclaim }}" }} is less than 5% free. When there
          is no available disk space, no new images will be cached. However, image pull
          operations are not affected.

    - alert: SeedRegistryCachePersistentVolumeFullInFourDays
      expr: ALERTS{alertname="RegistryCachePersistentVolumeFullInFourDays",alertstate="firing",project="garden"}
      for: 10m
      labels:
        severity: warning
        topology: garden
      annotations:
        summary: Registry cache PersistentVolume will be full in four days.
        description: >-
          Based on recent sampling, in Seed cluster
          {{ "{{ $labels.project }}" }}/{{ "{{ $labels.shoot_name }}" }} the registry
          cache PersistentVolume claimed by {{ "{{ $labels.persistentvolumeclaim }}" }}
          is expected to fill up within four days.

    - alert: SeedNodeNotHealthy
      expr: |2
          count_over_time(
            (
              sum by (seed, node) (
                  kube_node_spec_taint{effect="NoSchedule", key!="ToBeDeletedByClusterAutoscaler",
                                                            key!="deployment.machine.sapcloud.io/prefer-no-schedule",
                                                            key!="node-role.kubernetes.io/control-plane",
                                                            key!="node.gardener.cloud/critical-components-not-ready",
                                                            key!="node.kubernetes.io/unschedulable",
                                                            key!="pool.worker.gardener.cloud/legacy-nodes"}
              )
            )[30m:]
          )
        >
          9
      labels:
        severity: warning
        topology: garden
      annotations:
        summary: A seed node was reported not healthy for several scrapes in the past 30 minutes.
        description: >-
          Node {{ "{{ $labels.node }}" }} in seed {{ "{{ $labels.seed }}" }} in landscape
          {{ "{{ $externalLabels.landscape }}" }} was not healthy for several scrapes in the past 30 minutes.
{{- end }}
