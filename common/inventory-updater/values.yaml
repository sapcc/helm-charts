owner-info:
  support-group: foundation
  service: inventory-updater
  maintainers:
    - Bernd Kuespert
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/common/inventory-updater
updater:
  enabled: false
  image:
    name: inventory-updater
    tag: latest
  namespace: infra-monitoring
  replicas: 1
  api:
    enabled: false
    port: 9200

  connection_timeout: 10 # timeout in seconds for requests connections
  scrape_interval: 21600 # target interval in seconds between round starts (0 = start next round immediately)
  workers: 10 # number of parallel workers for scraping servers

  netbox:
    url: DEFINED-IN-REGION-SECRETS
    token: DEFINED-IN-REGION-SECRETS
    query:
      role_id: 8 # Role: server
      tenant_id: 1 # Tenant: converged cloud

  redfish_username: DEFINED-IN-REGION-SECRETS
  redfish_password: DEFINED-IN-REGION-SECRETS

  manufacturer_aliases:
    fsas: Fujitsu
    mlnx: Mellanox
    mellanox: Mellanox
    skhynix: SK Hynix

  # NIC manufacturers that map to L-type Netbox interfaces (L1, L2, ...) instead of NIC1, NIC2.
  # Only applies when no StructuredName is present and port speed <= lom_max_speed_mbps.
  lom_manufacturers:
    - Intel
    - Broadcom

  # Maximum port speed (Mbps) for a NIC to be treated as a LOM/onboard interface (L-type naming).
  # NICs from lom_manufacturers above this threshold are treated as standard NICs.
  # Default 10000 (10G): catches 1G/10G onboard NICs, excludes 25G/100G OCP adapters.
  lom_max_speed_mbps: 10000

  # Set to true to automatically create interfaces missing in Netbox when a MAC and speed are known.
  create_missing_interfaces: false

  # Known BMC/management interface names in Netbox (used as fallback when no interface
  # is marked mgmt_only). Values are matched case-insensitively, separators are ignored.
  bmc_interface_names:
    - remoteboard   # internal collector key
    - iLO           # HPE
    - iDRAC         # Dell
    - XCC           # Lenovo
    - iRMC          # Fujitsu
    - BMC
    - MGMT

resources:
  requests:
    memory: 200Mi
    cpu: 50m
  limits:
    memory: 400Mi
    cpu: 400m

ingress:
  # Additional annotations for the ingress.
  annotations: {}

global:
  registry: DEFINED-IN-GLOBAL-SECRETS



