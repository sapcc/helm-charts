{{- if .Values.image }}
kind: ConfigMap
apiVersion: v1

metadata:
  name: sci-version-of-{{ .Release.Name }}
  labels:
    # Lets policy check the chart version in use.
    sci-version-info-version: {{ quote .Chart.Version }}

data:
  image: {{ .Values.image | quote }}
  {{- range $k, $v := .Values.info }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}

---

kind: ConfigMap
apiVersion: v1

metadata:
  # Render early so the mutating webhook can read it as the release's objects are written.
  name: early-sci-version-of-{{ .Release.Name }}
  labels:
    # Lets policy check the chart version in use.
    sci-version-info-version: {{ quote .Chart.Version }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-100"
    "helm.sh/hook-delete-policy": before-hook-creation,post-delete

data:
  image: {{ .Values.image | quote }}
  {{- range $k, $v := .Values.info }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
