# "image" is the release's full application image reference (registry/repo:tag or
# registry/repo@sha256:...). sci-label-injector reads it to stamp sci labels. The deploy
# pipeline sets it via --set, so leave it empty here. An empty value renders no ConfigMap:
# the release installs but does not opt in until the pipeline sets this.
image: ''

# "info" is an optional map of extra per-release data. Each entry becomes a data key on both
# ConfigMaps. A value may be a JSON string, e.g. the image vector under one key.
info: {}
