# "image" is the release's full application image reference -- a whole path like
# registry/repo:tag or registry/repo@sha256:... -- not a tag the chart composes.
# sci-label-injector reads it to stamp sci labels onto the release. It is supplied at deploy
# time by the deploy pipeline via --set, the same way the app image tag is set, so leave it
# empty here.
image: ''

# "info" is an optional map of extra per-release data. Each entry becomes a data key on both
# rendered ConfigMaps. The pipeline may set entries via --set; a value may itself be a JSON
# string (e.g. the release's full image vector under one key). Leave empty to render no extra keys.
info: {}
