{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ template "postgres.fullname" . }}
  annotations:
  {{- if .Values.persistence.storageClass }}
    volume.beta.kubernetes.io/storage-class: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
spec:
  accessModes:
    {{- $accessMode := .Values.persistence.accessMode }}
    {{- if and (eq $accessMode "ReadWriteMany") (not (eq .Values.global.region "ap-ae-1" "ap-au-1" "ap-cn-1" "ap-jp-1" "ap-jp-2" "ap-sa-1" "eu-de-1" "eu-de-2" "eu-nl-1" "la-br-1" "na-ca-1" "na-us-1" "na-us-2" "na-us-3" "qa-de-1" "qa-de-2" "qa-de-3" "qa-de-4" "qa-de-5" "qa-de-6")) }}
      {{- $accessMode = "ReadWriteOnce" }}{{/* see documentation on .Values.persistence.accessMode for details */}}
    {{- end }}
    - {{ quote $accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end -}}
