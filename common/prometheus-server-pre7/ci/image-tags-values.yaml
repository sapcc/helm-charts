global:
  region: test-region
  domain: example.org
name: digest-test
thanos:
  enabled: true
  seed:
    enabled: false
  swiftStorageConfig:
    authURL: https://identity.example.org/v3
    userName: prometheus
    userDomainName: Default
    password: test-password
    domainName: Default
    projectName: monitoring
    regionName: test-region
    containerName: thanos
  components:
    baseImage: null
    version: null
  store:
    seriesSampleLimit: 1
  spec:
    baseImage: registry.example.org:5000/team/thanos
    version: v0.40.0
    objectStorageConfig:
      name: custom-storage
      key: storage.yaml
      optional: false
    readyTimeout: 10m
    resources:
      requests:
        memory: 128Mi
    volumeMounts:
      - name: custom-volume
        mountPath: /custom
