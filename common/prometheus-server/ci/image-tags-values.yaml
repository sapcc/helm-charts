global:
  region: test-region
  tld: example.org
name: digest-test
thanos:
  enabled: true
  objectStorageConfig:
    enabled: false
  components: {}
  sidecarDiscovery: []
  spec:
    image: registry.example.org:5000/team/thanos:v0.42.5
    version: v0.42.5
    objectStorageConfig:
      name: custom-storage
      key: storage.yaml
      optional: false
    readyTimeout: 10m
    resources:
      requests:
        memory: 128Mi
    volumeMounts:
      - name: custom-volume
        mountPath: /custom
