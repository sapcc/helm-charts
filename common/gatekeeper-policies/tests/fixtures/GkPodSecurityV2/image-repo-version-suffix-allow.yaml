apiVersion: v1
kind: Pod
metadata:
  name: image-repo-version-suffix-allow
  namespace: foo
spec:
  containers:
  # OCM relativeOciReference encodes the tag into the repo name as a suffix
  # e.g. "test-app/glob-privileged-v1_34_8" should match glob allowlist entry "test-app/glob-privileged-*"
  - name: foo-container
    image: foo.image-registry.com/test-app/glob-privileged-v1_34_8:20250519150208
    securityContext:
      privileged: true
