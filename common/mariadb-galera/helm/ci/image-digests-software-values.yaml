# Pin the software field for all six components; numeric build defaults stay intact.
mariadb:
  fixFsPermissions: true
  galera:
    clustername: test
    backup:
      enabled: true
      kopia:
        enabled: true
        job:
          schedule:
            full: "15 2 * * *"
            binlog: "*/30 * * * *"
        s3:
          endpoint: s3.example.test
          region: test-region
          bucket: test-bucket
  users:
    root:
      username: root
      password: test-root
    monitor:
      username: monitor
      password: test-monitor
monitoring:
  mysqld_exporter:
    enabled: true
proxy:
  enabled: true
  type: proxysql
  proxysql:
    fixFsPermissions: true
    users:
      admin:
        username: admin
        password: test-admin
      stats:
        username: stats
        password: test-stats
  haproxy:
    users:
      stats:
        username: stats
        password: test-stats
image:
  database:
    softwareversion: "10.5.25@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  os:
    softwareversion: "22.04@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  monitoring:
    softwareversion: "0.14.0@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  proxysql:
    softwareversion: "2.6.3@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  haproxy:
    softwareversion: "2.8.10@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  kopiabackup:
    softwareversion: "0.17.0@sha256:1111111111111111111111111111111111111111111111111111111111111111"
