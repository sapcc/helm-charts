owner-info:
  enabled: true
  helm-chart-url: "https://github.wdf.sap.corp/sap-cloud-infrastructure/agent-sandbox"
  maintainers: ["Team Workload Management"]
  support-group: "workload-management"
  service: "agent-sandbox"

# Exact domains the agent may reach over HTTP Host / TLS SNI.
allowedDomains: []

envoy:
  image: envoyproxy/envoy:v1.31-latest
  uid: 1337

iptables:
  image: alpine:3.22.1

agent:
  name: agent-sandbox
  replicas: 1
  container:
    name: agent
    image: ghcr.io/anomalyco/opencode:latest
    command: []       # override entrypoint, e.g. ["opencode", "--non-interactive"]
    env: []           # extra env vars, e.g. [{name: OPENAI_API_KEY, value: ...}]
    volumeMounts: []  # extra mounts, e.g. [{name: config, mountPath: /etc/agent}]
  volumes: []         # extra volumes, e.g. [{name: config, configMap: {name: my-config}}]
