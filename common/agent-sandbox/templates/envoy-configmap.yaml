apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: http_egress
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 15001
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: agent_sandbox_http
                    route_config:
                      name: allowed_http_domains
                      virtual_hosts:
{{- range $i, $domain := .Values.allowedDomains }}
                        - name: allowed_http_{{ $i }}
                          domains:
                            - {{ $domain | quote }}
                            - {{ printf "%s:*" $domain | quote }}
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: original_dst_http
{{- end }}
                        - name: deny_http
                          domains:
                            - "*"
                          routes:
                            - match:
                                prefix: /
                              direct_response:
                                status: 403
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: https_egress
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 15006
          listener_filters:
            - name: envoy.filters.listener.original_dst
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst
            - name: envoy.filters.listener.tls_inspector
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
          filter_chains:
{{- range $i, $domain := .Values.allowedDomains }}
            - filter_chain_match:
                server_names:
                  - {{ $domain | quote }}
              filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: agent_sandbox_tls
                    cluster: original_dst_tls
{{- end }}
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: agent_sandbox_tls_deny
                    cluster: denied
      clusters:
        - name: original_dst_http
          type: ORIGINAL_DST
          connect_timeout: 5s
          lb_policy: CLUSTER_PROVIDED
        - name: original_dst_tls
          type: ORIGINAL_DST
          connect_timeout: 5s
          lb_policy: CLUSTER_PROVIDED
        - name: denied
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: denied
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 15000
