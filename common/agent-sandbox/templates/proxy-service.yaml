# Stable in-cluster endpoint for the egress proxy. The agent points its
# HTTPS_PROXY at this service name, e.g.:
#   http://egress-proxy:{{ .Values.proxy.port }}
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-egress-proxy
  labels:
    app: agent-sandbox-egress-proxy
spec:
  selector:
    app: agent-sandbox-egress-proxy
  ports:
    - name: proxy
      port: {{ .Values.proxy.port }}
      targetPort: {{ .Values.proxy.port }}
