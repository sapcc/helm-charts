apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-egress-proxy-config
data:
  squid.conf: |
    # Listen on the proxy port for both plain HTTP and CONNECT (HTTPS).
    http_port {{ .Values.proxy.port }}

    # Allowlisted destination domains. A leading dot matches the apex plus all
    # subdomains (e.g. .github.com covers github.com and api.github.com).
    # Rendered from values.yaml, with normalization: if a domain appears both
    # dotted (.x) and bare (x), the bare form is dropped — Squid rejects both
    # on one ACL ("x is a subdomain of x") and won't start. Entries are also
    # deduped. This keeps a stray values.yaml entry from crashing the proxy.
    {{- $domains := .Values.proxy.allowedDomains -}}
    {{- $dotted := dict -}}
    {{- range $domains }}{{ if hasPrefix "." . }}{{ $_ := set $dotted (trimPrefix "." .) true }}{{ end }}{{ end -}}
    {{- $seen := dict -}}
    {{- $final := list -}}
    {{- range $domains }}
      {{- $bare := trimPrefix "." . -}}
      {{- if and (not (hasPrefix "." .)) (hasKey $dotted $bare) -}}
        {{- /* bare form covered by a dotted entry; skip */ -}}
      {{- else if hasKey $seen . -}}
        {{- /* duplicate; skip */ -}}
      {{- else -}}
        {{- $_ := set $seen . true -}}
        {{- $final = append $final . -}}
      {{- end -}}
    {{- end }}
    acl allowed_domains dstdomain{{ range $final }} {{ . }}{{ end }}

    # Only permit CONNECT to the standard HTTPS port, to allowed domains.
    acl SSL_ports port 443
    acl CONNECT method CONNECT
    http_access deny CONNECT !SSL_ports

    # Allow traffic to allowlisted domains; deny everything else.
    http_access allow allowed_domains
    http_access deny all

    # Keep the proxy quiet and cache-less; it's a gateway, not a cache.
    cache deny all
    # Log to files under /var/log/squid, which the image makes writable for
    # the unprivileged 'proxy' user. Redirecting to /dev/stdout does NOT work
    # here: after Squid drops privileges the 'proxy' user cannot open/write
    # the container's stdout, which crashes startup with a FATAL. The
    # access-log sidecar tails this file to stdout instead.
    access_log /var/log/squid/access.log squid
    cache_log /var/log/squid/cache.log
    pid_filename none
    # Don't leak the proxy's presence / internal details to upstreams.
    via off
    forwarded_for delete
