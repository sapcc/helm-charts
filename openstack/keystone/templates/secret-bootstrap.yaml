apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-bootstrap
  labels:
    app: {{ template "fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    component: keystone
    type: config
type: Opaque
data:
  bootstrap.yaml: {{ include (print .Template.BasePath "/etc/_bootstrap.yaml.tpl") . | b64enc | quote }}
