kind: CronJob
apiVersion: batch/v1

metadata:
  name: {{ .Release.Name }}-repair-assignments
  labels:
    app: {{ template "fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    system: openstack
    component: keystone
    type: operations
spec:
  schedule: {{ .Values.cron.cronSchedule | default "0 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            name: {{ .Release.Name }}-repair-assignments
            system: openstack
            component: keystone
            type: operations
            alert-tier: os
            alert-service: keystone
          annotations:
            chart-version: {{.Chart.Version}}
            configmap-etc-hash: {{ include (print $.Template.BasePath "/configmap-etc.yaml") . | sha256sum }}
            configmap-bin-hash: {{ include (print $.Template.BasePath "/configmap-bin.yaml") . | sha256sum }}
            secrets-bin-hash: {{ include (print $.Template.BasePath "/secret-bin.yaml") . | sha256sum }}
            secrets-bootstrap-hash: {{ include (print $.Template.BasePath "/secret-bootstrap.yaml") . | sha256sum }}
            secrets-hash: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
            {{- include "utils.linkerd.pod_and_service_annotation" . | indent 12 }}
        spec:
{{- if .Values.rbac.enabled }}
          serviceAccountName: {{ .Release.Name }}
{{- end }}
          restartPolicy: Never
          {{- include "utils.proxysql.job_pod_settings" . | indent 10 }}
          initContainers:
          {{- tuple . (dict "SERVICE" (include "keystone.service_dependencies" .) "JOBS" (include "keystone.job_dependencies" .)) | include "keystone.kubernetes_entrypoint_init_container" | indent 10 }}
          {{- if .Values.proxysql.native_sidecar }}
          {{- include "utils.proxysql.container" . | indent 10 }}
          {{- end }}
          containers:
            - name: keystone-repair-assignments
              image: {{ required ".Values.global.registryAlternateRegion is missing" .Values.global.registryAlternateRegion }}/{{ .Values.cron.image }}:{{ required ".Values.cron.imageTag is missing" .Values.cron.imageTag }}
              imagePullPolicy: {{ .Values.cron.imagePullPolicy | default "IfNotPresent" | quote }}
              command:
                - bash
                - /scripts/repair_assignments
              env:
                {{- if .Values.sentry.enabled }}
                - name: SENTRY_DSN
                {{- if .Values.sentry.dsn }}
                  value: {{ .Values.sentry.dsn | quote}}
                {{ else }}
                  valueFrom:
                    secretKeyRef:
                      name: sentry
                      key: {{ .Release.Name }}.DSN.python
                {{- end }}
                {{- end }}
                - name: PYTHONWARNINGS
                  value: "ignore:Unverified HTTPS request"
              volumeMounts:
                - name: keystone-etc
                  mountPath: /etc/keystone/policy.yaml
                  subPath: policy.yaml
                  readOnly: true
                - mountPath: /etc/keystone/keystone.conf
                  subPath: keystone.conf
                  name: keystone-etc
                - mountPath: /etc/keystone/keystone.conf.d
                  name: keystone-etc-confd
                - name: keystone-bootstrap
                  mountPath: /etc/keystone/bootstrap.yaml
                  subPath: bootstrap.yaml
                  readOnly: true
                - mountPath: /etc/keystone/logging.conf
                  subPath: logging.conf
                  name: keystone-etc
                - mountPath: /scripts
                  name: keystone-bin
                - name: fernet
                  mountPath: /fernet-keys
                  readOnly: true
                - name: credential-keys
                  mountPath: /credential-keys
                  readOnly: true
                {{- include "utils.proxysql.volume_mount" . | indent 16 }}
                {{- include "utils.trust_bundle.volume_mount" . | indent 16 }}
              {{- if .Values.cron.resources }}
              resources:
{{ toYaml .Values.cron.resources | indent 16 }}
              {{- end }}
          {{- if not .Values.proxysql.native_sidecar }}
          {{- include "utils.proxysql.container" . | indent 12 }}
          {{- end }}
          volumes:
            - name: keystone-etc
              configMap:
                name: keystone-etc
            - name: keystone-etc-confd
              secret:
                secretName: {{ .Release.Name }}-secrets
                defaultMode: 0444
            - name: keystone-bootstrap
              secret:
                secretName: {{ .Release.Name }}-bootstrap
                defaultMode: 0444
            - name: keystone-bin
              projected:
                sources:
                - configMap:
                    name: keystone-bin
                - secret:
                    name: keystone-bin-secrets
                    items:
                      - key: bootstrap
                        path: bootstrap
            - name: fernet
              secret:
                secretName: keystone-fernet
                defaultMode: 0755
            - name: credential-keys
              secret:
                secretName: keystone-credential-keys
                defaultMode: 0555
            {{- include "utils.proxysql.volumes" . | indent 12 }}
            {{- include "utils.trust_bundle.volumes" . | indent 12 }}
