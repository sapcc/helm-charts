apiVersion: v1
kind: Secret
metadata:
  name: keystone-bin-secrets
  labels:
    app: {{ template "fullname" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
    component: keystone
    type: config
type: Opaque
data:
  pre-rollout: |
    {{ include (print .Template.BasePath "/bin/_pre-rollout.tpl") . | b64enc | indent 4 }}
