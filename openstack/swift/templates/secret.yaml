apiVersion: v1
kind: Secret
metadata:
  name: swift-secret
data:
  hash_path_prefix: {{ .Values.hash_path_prefix | b64enc }}
  hash_path_suffix: {{ .Values.hash_path_suffix | b64enc }}
  dispersion_password: {{ .Values.dispersion_password | b64enc }}
  {{- if and .Values.dispersion2_password (ne .Values.dispersion2_password "DEFINED_IN_REGION_CHART") }}
  dispersion2_password: {{ .Values.dispersion2_password | b64enc }}
  {{- end }}
  {{- if and .Values.swift2_service_password (ne .Values.swift2_service_password "DEFINED_IN_REGION_CHART") }}
  swift2_service_password: {{ .Values.swift2_service_password | b64enc }}
  {{- end }}
  {{ $.Values.cluster_name }}_service_password: {{ required ".Values.$cluster_id.swift_service_password" $.Values.swift_service_password | b64enc }}
