apiVersion: v2
name: neutron-agents
description: Library chart that exposes named templates (container, volumes, config) for embedding neutron agents into a consumer's Pod spec. The linuxbridge agent is implemented today; metadata and dhcp agents can be added as siblings sharing the common neutron config plumbing.
type: library
version: 0.1.0
appVersion: "caracal"
dependencies:
  - name: utils
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: '>= 0.0.0'
