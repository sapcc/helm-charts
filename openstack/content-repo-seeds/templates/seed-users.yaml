{{- $vbase  := .Values.global.vaultBaseURL | required "missing value for .Values.global.vaultBaseURL" -}}
{{- $region := .Values.global.region       | required "missing value for .Values.global.region"       -}}

apiVersion: "openstack.stable.sap.cc/v1"
kind: OpenstackSeed
metadata:
  name: content-repo-user-seed

spec:
  requires:
    - {{ .Values.global.keystoneNamespace }}/keystone-seed
    - {{ .Values.global.keystoneNamespace }}/domain-default-seed
    - {{ .Values.global.keystoneNamespace }}/domain-ccadmin-seed

  domains:
    - name: Default
      users:
        # full access to content-repo-payloads (used by repo sync jobs to write into content-repo and by s3-proxy to serve it read-only)
        - name: content-repo
          description: Content Repo Service
          password: {{ printf "%s/%s/content-repo/keystone-user/content-repo/password" $vbase $region | quote }}
        # used by teams to upload content to team-managed source buckets (migrated from swift-utils) and also for legacy sync jobs into repo-old
        - name: repo
          description: Repo Service User
          password: {{ printf "%s/%s/content-repo/keystone-user/repo/password" $vbase $region | quote }}
          role_assignments:
            - project: service
              role: service
      projects:
        - name: content-repo-payloads
          role_assignments:
            - user: content-repo@Default
              role: service            # to validate users' Keystone tokens
            - user: content-repo@Default
              role: objectstore_admin  # to read/write objects in this project's Ceph account

    - name: ccadmin
      projects:
        - name: master
          role_assignments:
            - user: repo@Default
              role: objectstore_admin  # required for repo sync
            - user: content-repo@Default
              role: objectstore_viewer
