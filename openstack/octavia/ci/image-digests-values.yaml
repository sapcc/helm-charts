---
# Standalone pinned fixture; ci/test-values.yaml remains the ordinary fixture.
imageVersion: train@sha256:1111111111111111111111111111111111111111111111111111111111111111
watcher:
  enabled: true
workers:
  test-worker:
    model: r5900
    availability_zone: foo
    bigip_urls: [https://bigip.example.com]
global:
  dbPassword: secret!
  master_password: topSecret!
  octavia_service_password: topSecret!!
  region: regionOne
  tld: example.com
  clusterDNSSearchDomain: cluster.local
  registry: my.docker.registry
  registryAlternateRegion: other.docker.registry
  dockerHubMirror: my.dockerhub.mirror
  dockerHubMirrorAlternateRegion: other.dockerhub.mirror
  availability_zones: [foo, bar]
mariadb:
  root_password: topSecret
  users:
    octavia:
      password: topSecret
    backup:
      password: topSecret
  backup_v2:
    enabled: false
rabbitmq:
  metrics:
    enabled: false
  users:
    default:
      password: defaultpass
    admin:
      password: adminpass
rabbitmq_notifications:
  metrics:
    enabled: false
  users:
    default:
      password: defaultpass
    admin:
      password: adminpass
tls:
  versions:
    minimum: TLSv1.3
    default:
      listeners: []
      pools: []
  cipher_suites:
    allow_list: []
    default:
      listeners: []
