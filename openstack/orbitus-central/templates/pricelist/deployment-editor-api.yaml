kind: Deployment
apiVersion: apps/v1

metadata:
  name: pricelist-editor-api

spec:
  revisionHistoryLimit: 5
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      name: pricelist-editor-api
  template:
    metadata:
      labels:
        name: pricelist-editor-api
        app: pricelist-editor-api
      annotations:
        checksum/configmap: {{ include "orbitus-central/templates/pricelist/configmap.yaml" $ | sha256sum }}
        kubectl.kubernetes.io/default-container: api
    spec:
      volumes:
        - name: config
          configMap:
            name: pricelist
        - name: pricelist-data
          emptyDir: {}
      initContainers:
        - name: pricelist-loader
          image: {{ include "pricelist_data_image" . }}
          imagePullPolicy: IfNotPresent
          command: [ /bin/cp ]
          args:
            - /pricelist/{{ .Values.orbitus.deployment_name }}/pricelist.json.gz
            - /pricelist-out/pricelist.json.gz
          volumeMounts:
            - mountPath: /pricelist-out
              name: pricelist-data
      containers:
        - name: api
          image: {{ include "orbitus_image" $ }}
          imagePullPolicy: IfNotPresent
          args:
            - pricelist-{{ .Values.orbitus.deployment_name }}-editor-api
            - ":80"
          env:
            {{ include "pricelist_common_envvars" $ | indent 12 }}
          securityContext:
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/pricelist
              name: config
            - mountPath: /pricelist-data
              name: pricelist-data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            timeoutSeconds: 10
            periodSeconds: 60
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            timeoutSeconds: 5
            periodSeconds: 5
          {{- if $.Values.pricelist.resources.enabled }}
          # TODO: Track and update the resource limits to realistic values during pilot phase
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          {{- end }}
