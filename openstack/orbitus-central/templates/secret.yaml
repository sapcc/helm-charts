{{- $vbase := .Values.global.vaultBaseURL | required "missing value for .Values.global.vaultBaseURL" -}}
{{- $region := .Values.global.region | required "missing value for .Values.global.region" -}}
{{- $regions := .Values.orbitus.regions | required "missing value for .Values.orbitus.regions" -}}

apiVersion: v1
kind: Secret
metadata:
  name: orbitus-secret
data:
  # Base credentials for validating incoming tokens in the deployment region.
  os_password: {{ printf "%s/%s/orbitus/keystone-user/service/password" $vbase $region | b64enc }} 
  # Credentials to query API endpoints in each configured region.
  {{- range $r := splitList "," $regions }}
  {{- $r = trim $r }}
  os_password_{{ $r | replace "-" "_" | upper }}: {{ printf "%s/%s/orbitus/keystone-user/service/password" $vbase $r | b64enc }}
  {{- end }}
