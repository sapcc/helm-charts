{{- if .Values.apacheMetrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-apache-exporter
  labels:
    app: barbican
    system: openstack
    component: barbican
    type: podmonitor
    prometheus: openstack
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      name: {{ .Release.Name }}-api
  podMetricsEndpoints:
    - port: apache-metrics
      path: /metrics
      honorLabels: true
      interval: 60s
      {{- if .Values.apacheMetrics.linkerdMTLS }}
      # Scrape via Linkerd mTLS: the apache-exporter port is proxied by Linkerd,
      # so scheme=https with the cluster trust anchor authenticates the scrape.
      # Requires: (a) this Prometheus is Linkerd-meshed, (b) the trust anchor
      # secret "linkerd-trust-anchor" is projected into the Prometheus pod.
      scheme: https
      tlsConfig:
        caFile: /etc/prometheus/secrets/linkerd-trust-anchor/ca.crt
        insecureSkipVerify: false
      {{- end }}
{{- end }}
