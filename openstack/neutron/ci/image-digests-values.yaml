---
# Standalone pinned fixture; ci/test-values.yaml remains the ordinary fixture.
imageVersion: queens@sha256:1111111111111111111111111111111111111111111111111111111111111111
api:
  uwsgi: true
global:
  region: staging
  tld: example.com
  clusterDNSSearchDomain: cluster.local
  registry: registry.example.com/internal
  registryAlternateRegion: other.docker.registry
  dockerHubMirror: registry.example.com/mirror
  dockerHubMirrorAlternateRegion: registry.example.org/mirror
  osprofiler:
    enabled: true
  dbPassword: topSecret
  nova_metadata_secret: topSecret
  master_password: topSecret
  availability_zones: [foo, bar]
  domain_seeds:
    customer_domains: [bar, foo, baz]
    customer_domains_without_support_projects: [baz]
mariadb:
  root_password: john
  backup_v2:
    enabled: false
nsxv3_logstash:
  dbPassword: topSecret
rabbitmq:
  users:
    default:
      password: bunny0
    admin:
      password: bunny1
  metrics:
    password: bunny2
rabbitmq_notifications:
  users:
    default:
      password: bunny3
    admin:
      password: bunny4
  metrics:
    password: bunny5
secgroup_entanglement_exporter:
  release: queens
agent:
  multus: true
  dhcp:
    num_sync_threads: 10
manila:
  physnet: myphysnet
aci:
  apic_application_profile: converged_cloud_openstack
  support_remote_mac_clear: 'True'
  sync_allocations: 'True'
  apic_tenant_name: cc
  apic_hosts: myHost
  apic_user: myUser
  apic_password: myPassword
  bindings: myBinding
  aci_hostgroups:
    hostgroups: []
asr:
  physnet: cp090
sftp:
  externalIPs: myIP
  password: swordfish
  os_password: secret
  server_key: myKey
interconnection:
  password: topSecret
ml2_mechanismdrivers: myDriver
dns_forwarders: myDNS
ntp_servers: 192.0.2.123, 192.0.2.222
dns_local_domain: myDNSLocal
dns_ml2_extension: myDNS
cp_physical_network: myPN
cp_network_interface: myBond
interface_driver: myID
dhcp_lease_duration: '86400'
max_fixed_ips_per_port: 100
max_allowed_address_pair: 100
allow_automatic_dhcp_failover: 'true'
imageVersionNetworkAgentDHCP: queens
imageVersionNetworkAgentLinuxBridge: queens
imageVersionEntanglement: queens
