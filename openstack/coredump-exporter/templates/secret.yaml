apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    system: openstack
    type: configuration
    component: coredump-exporter
type: Opaque
data:
  OS_USERNAME: {{ required ".Values.username is missing" .Values.username | b64enc | quote }}
  OS_PASSWORD: {{ required ".Values.password is missing" .Values.password | b64enc | quote }}
