apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    system: openstack
    type: configuration
    component: coredump-exporter
type: Opaque
data:
  OS_APPLICATION_CREDENTIAL_ID: {{ required ".Values.applicationCredentialID is missing" .Values.applicationCredentialID | b64enc | quote }}
  OS_APPLICATION_CREDENTIAL_SECRET: {{ required ".Values.applicationCredentialSecret is missing" .Values.applicationCredentialSecret | b64enc | quote }}
