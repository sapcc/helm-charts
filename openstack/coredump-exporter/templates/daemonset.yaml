{{- $region := required ".Values.global.region is missing" .Values.global.region }}
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}
  labels:
    component: coredump-exporter
spec:
  revisionHistoryLimit: {{ .Values.pod.lifecycle.upgrades.daemonsets.revisionHistory }}
  selector:
    matchLabels:
      name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        name: {{ .Release.Name }}
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.pod.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      tolerations:
      {{- range $k, $v := .Values.pod.tolerations }}
      - # {{ $k }}
      {{- toYaml $v | nindent 8 }}
      {{- end }}
      {{- if .Values.pod.nodeSelector }}
      nodeSelector:
        {{- .Values.pod.nodeSelector | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.pod.affinity }}
      affinity:
        {{- .Values.pod.affinity | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: coredump-exporter
        image: {{ .Values.imageName }}:{{ .Values.imageVersion | required "Please set imageVersion" }}
        imagePullPolicy: IfNotPresent
        command:
        - "/bin/sh"
        - "/scripts/ship.sh"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: OS_AUTH_URL
          value: {{ required ".Values.osAuthUrl is missing" .Values.osAuthUrl }}
        - name: OS_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}
              key: OS_USERNAME
        - name: OS_USER_DOMAIN_NAME
          value: {{ .Values.swiftUserDomainName }}
        - name: OS_PROJECT_NAME
          value: {{ .Values.swiftProjectName }}
        - name: OS_PROJECT_DOMAIN_NAME
          value: {{ .Values.swiftProjectDomainName }}
        - name: OS_REGION_NAME
          value: {{ .Values.global.region | required ".Values.global.region missing" }}
        - name: OS_ENDPOINT_TYPE
          value: {{ .Values.swiftEndpointType }}
        - name: OS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}
              key: OS_PASSWORD
        - name: HOME
          value: /tmp
        - name: SWIFT_CONTAINER
          value: {{ .Values.swiftContainer }}
        - name: POLLING_DELAY
          value: {{ .Values.pollingDelay | quote }}
        - name: POLLING_FUDGING
          value: {{ .Values.pollingFudging | quote }}
        - name: SWIFT_DELETE_AFTER
          value: {{ .Values.swiftDeleteAfter | quote }}
        - name: RCLONE_OPERATION
          value: {{ .Values.rcloneOperation }}
        resources:
          {{- toYaml .Values.pod.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: data
          readOnly: true
        - mountPath: /etc/os-release
          name: os-release
          readOnly: true
        - mountPath: /config/rclone
          name: config
          readOnly: true
        - mountPath: /scripts
          name: scripts
          readOnly: true
        - mountPath: /tmp
          name: tmp
      volumes:
      - name: data
        hostPath:
          path: /var/lib/systemd/coredump/
          type: Directory
      - name: os-release
        hostPath:
          path: /etc/os-release
          type: File
      - name: config
        configMap:
          name: {{ .Release.Name }}
      - name: scripts
        configMap:
          name: {{ .Release.Name }}-scripts
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
