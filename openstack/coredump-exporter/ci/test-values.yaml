global:
  region: xx-yy-1
  tld: example.org
  registry: registry.example.com
  dockerHubMirror: registry.example.com/dockerhub

imageVersion: latest

osAuthUrl: https://identity.example.com/v3

username: vault+kvv2:///path/to/username
password: vault+kvv2:///path/to/password

pod:
  tolerations:
    hypervisorNoSchedule:
      key: "species"
      operator: "Equal"
      value: "hypervisor"
      effect: "NoSchedule"
  nodeSelector:
    species: hypervisor
