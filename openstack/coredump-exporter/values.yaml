global:
  dockerHubMirror:
  registry:
  region: null

imageName: rclone/rclone
imageVersion: null

osAuthUrl: null
swiftUserDomainName: Default
swiftProjectName: master
swiftProjectDomainName: ccadmin
swiftEndpointType: internal

swiftContainer: coredump-exporter

username: null
password: null

# Seconds between shipment passes.
pollingDelay: 300
pollingFudging: 30

rcloneOperation: "copyto" # Keeps the files, in comparison to moveto

# Object expiry in Swift (seconds).
swiftDeleteAfter: 864000

pod:
  lifecycle:
    upgrades:
      daemonsets:
        revisionHistory: 5
  tolerations: {}
  nodeSelector: {}
  affinity: {}
  priorityClassName: null
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

owner-info:
  support-group: compute-storage-api
  service: nova
  maintainers:
  - Johannes Kulik
  - Jakob Karge
  - Andrew Karpow
  - Fabian Wiesel
  - mchristianl
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/openstack/coredump-exporter
