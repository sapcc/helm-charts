{{- if .Values.seed.enabled -}}
{{- $vbase  := .Values.global.vaultBaseURL | required "missing value for .Values.global.vaultBaseURL" -}}
{{- $region := .Values.global.region       | required "missing value for .Values.global.region"       -}}
{{- $az := index .Values "kvm-ha-service" "global" "az" | required "missing value for .Values.kvm-ha-service.global.az" -}}
{{- $credentialPath := .Values.seed.keystoneUserSecretPath | default (printf "%s/kvm-ha/%s/keystone-user" $region $az) -}}
{{- $username := printf "%s/%s/username" $vbase $credentialPath -}}
{{- $password := printf "%s/%s/password" $vbase $credentialPath -}}

apiVersion: "openstack.stable.sap.cc/v1"
kind: "OpenstackSeed"
metadata:
  name: kvm-ha-service-{{ $az }}-seed
spec:
  requires:
  - {{ .Values.global.keystoneNamespace }}/keystone-seed

  domains:
  - name: Default
    users:
    - name: {{ $username | quote }}
      description: "kvm-ha-service-{{ $az }} service user for CC. This user was automatically generated by a user seed: https://github.com/sapcc/helm-charts/tree/master/openstack/kvm-ha-service/"
      password: {{ $password | quote }}
      role_assignments:
      # VM evacuation
      - project: kvm-ha-service-{{ $az }}@ccadmin
        role: cloud_compute_admin

  - name: ccadmin
    projects:
    - name: kvm-ha-service-{{ $az }}
      description: "kvm-ha-service-{{ $az }} for CC. This project was automatically generated by a project seed: https://github.com/sapcc/helm-charts/tree/master/openstack/kvm-ha-service/"
{{- end -}}