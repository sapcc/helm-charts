{{- $region   := .Values.global.region                        | required "missing value for .Values.global.region"       -}}
{{- $cdomains := .Values.global.domain_seeds.customer_domains | required "missing value for .Values.global.domain_seeds.customer_domains" -}}
{{- $domains  := concat (list "cc3test") $cdomains -}}

apiVersion: "openstack.stable.sap.cc/v1"
kind: OpenstackSeed
metadata:
  name: keppel-seed

spec:
  requires:
  - {{ .Values.global.keystoneNamespace }}/keystone-seed
  - {{ .Release.Namespace }}/keppel-user-seed
  - monsoon3/domain-ccadmin-seed
  {{- range $domains }}
  - monsoon3/domain-{{replace "_" "-" .}}-seed
  {{- end }}

  domains:
    - name: Default
      projects:
        - name: keppel-payloads
          role_assignments:
            - group: CCADMIN_CLOUD_ADMINS@ccadmin
              role: objectstore_viewer # to allow inspection by cloud admins into this project's Ceph account
            - group: CCADMIN_CLOUD_ADMINS@ccadmin
              role: objectstore_admin # TODO: remove once <https://github.com/cobaltcore-dev/cloud-storage/issues/468> is resolved and the above role assignment can be used instead

    - name: ccadmin
      groups:
        - name: CCADMIN_CLOUD_ADMINS
          role_assignments:
            - project: cloud_admin
              role: cloud_registry_admin
            - project: cloud_admin
              role: cloud_registry_viewer # technically unnecessary, but allows creating application credentials with read-only permissions
            - project: master
              role: registry_admin
            - project: master
              role: registry_viewer # technically unnecessary, but allows creating application credentials with read-only permissions
        - name: CCADMIN_DOMAIN_REGISTRY_ADMINS
          role_assignments:
            - domain: ccadmin
              role: registry_admin
            - domain: ccadmin
              role: registry_viewer # technically unnecessary, but allows creating application credentials with read-only permissions
        {{- if not ($region | hasPrefix "qa-") }}
        - name: CCADMIN_KEPPEL_IMAGE_PUSHERS
          role_assignments:
            - project: master
              role: registry_pusher
            - project: master
              role: registry_viewer # technically unnecessary, but allows creating application credentials with read-only permissions
        {{- end }}

    {{- range $domains }}
    - name: {{.}}
      groups:
        - name: {{ hasPrefix "iaas-" . | ternary . ( upper . ) }}_DOMAIN_REGISTRY_ADMINS
          role_assignments:
            - domain: {{.}}
              role: registry_admin
            - domain: {{.}}
              role: registry_viewer # technically unnecessary, but allows creating application credentials with read-only permissions
      {{- if eq . "monsoon3" }}
      projects:
        - name: cc-demo
          role_assignments:
          - group: MONSOON3_DOMAIN_ADMINS
            role: registry_admin
          - group: MONSOON3_DOMAIN_ADMINS
            role: registry_viewer # technically unnecessary, but allows creating application credentials with read-only permissions
      {{- end }}
    {{- end }}
