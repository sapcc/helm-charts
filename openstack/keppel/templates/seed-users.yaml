{{- $vbase  := .Values.global.vaultBaseURL | required "missing value for .Values.global.vaultBaseURL" -}}
{{- $region := .Values.global.region       | required "missing value for .Values.global.region"       -}}

apiVersion: "openstack.stable.sap.cc/v1"
kind: OpenstackSeed
metadata:
  name: keppel-user-seed

spec:
  requires:
  - {{ .Values.global.keystoneNamespace }}/keystone-seed
  - {{ .Values.global.keystoneNamespace }}/domain-default-seed
  - {{ .Values.global.keystoneNamespace }}/domain-ccadmin-seed

  roles:
    - name: cloud_registry_admin
    - name: cloud_registry_viewer
    - name: registry_admin
    - name: registry_pusher
    - name: registry_viewer

  domains:
    - name: Default
      users:
        - name: keppel
          description: Keppel Service
          password: {{ printf "%s/%s/keppel/keystone-user/service/password" $vbase $region | quote }}
          role_assignments:
            - project: service
              role:    service
            - project: service
              role:    registry_admin # for keppel-health-monitor
        {{- if eq $region "qa-de-1" }}
        - name: keppel_e2e
          description: Keppel End-to-End Test User
          password: {{ printf "%s/%s/keppel/keystone-user/e2e-test/password" $vbase $region | quote }}
        {{- end }}
        {{- if eq $region "eu-de-1" }}
        - name: keppel-argo
          description: Keppel Access User for Argo CD
          password: {{ printf "%s/%s/keppel/keystone-user/argo/password" $vbase $region | quote }}
          role_assignments:
            - project: service
              role:    registry_viewer # worthless role assignment, used only to enable Keystone login (actual access to relevant Keppel accounts is given by RBAC policies)
        - name: keppel-concourse
          description: Keppel Access User for Concourse CI
          password: {{ printf "%s/%s/keppel/keystone-user/concourse/password" $vbase $region | quote }}
          role_assignments:
            - project: service
              role:    registry_viewer # worthless role assignment, used only to enable Keystone login (actual access to relevant Keppel accounts is given by RBAC policies)
        - name: keppel-greenhouse-ci
          description: Keppel Access User for Greenhouse CI
          password: {{ printf "%s/%s/keppel/keystone-user/greenhouse-ci/password" $vbase $region | quote }}
          role_assignments:
            - project: service
              role:    registry_viewer # worthless role assignment, used only to enable Keystone login (actual access to relevant Keppel accounts is given by RBAC policies)
        - name: keppel-github-actions
          description: Keppel Access User for GitHub Actions
          password: {{ printf "%s/%s/keppel/keystone-user/github-actions/password" $vbase $region | quote }}
          role_assignments:
            - project: service
              role:    registry_viewer # worthless role assignment, used only to enable Keystone login (actual access to relevant Keppel accounts is given by RBAC policies)
        {{- end }}
      projects:
        - name: keppel-payloads # NOTE: in buildup, there is _probably_ a Limes dependency here, because the Ceph account for this project is probably only created once Limes assigns quota to it
          role_assignments:
            - user: keppel@Default
              role: service           # to validate users' Keystone tokens
            - user: keppel@Default
              role: objectstore_admin # to read/write objects (blobs, manifests, reports) in this project's Ceph account
            {{- if eq .Values.keppel.driver "both" }}
            - user: keppel@Default
              role: cloud_objectstore_admin # to read/write objects (blobs, manifests, reports) in customers' Swift accounts
            {{- end }}

    - name: ccadmin
      projects:
        - name: cloud_admin
          {{- if ne .Values.keppel.driver "ceph" }}
          role_assignments:
            - user: keppel@Default
              role: service       # to validate users' Keystone tokens
            - user: keppel@Default
              role: cloud_objectstore_admin # to read/write blobs and manifests from/into customer's Swift accounts
          {{- end }}
        - name: master
          role_assignments:
            - user: keppel@Default
              role: objectstore_admin # to write into the "keppel_federation_db" container
            {{- if eq $region "qa-de-1" }}
            - user: keppel_e2e@Default
              role: admin # to create Keppel accounts
            - user: keppel_e2e@Default
              role: registry_admin # to pull/push images
            {{- end }}
