global:
  nova_service_application_credential_id: nova-application-credential-id
  nova_service_application_credential_secret: nova-application-credential-secret
  dockerHubMirror: myRegistry/dockerhub
  registry: myRegistry

imageVersion: latest

defaultUsersRabbitMQ:
  cell1: default

rabbitmq:
  users:
    default:
      user: rabbitmq
      name: name
      password: password

defaults:
  hypervisor:
    kvm:
      pod:
        tolerations:
          hypervisorNoSchedule:
            key: "species"
            operator: "Equal"
            value: "hypervisor"
            effect: "NoSchedule"
        nodeSelector:
          species: hypervisor
