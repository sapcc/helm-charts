global:
  dockerHubMirror: myRegistry/dockerhub
  registry: myRegistry

service_users:
  defaultUser: not-nova
  users:
    nova:
      username: nova1
      password: testing
    not-nova:
      username: veryNova
      password: forSure

imageVersion: latest

defaultUsersRabbitMQ:
  cell1: default

rabbitmq:
  users:
    default:
      user: rabbitmq
      name: name
      password: password

defaults:
  hypervisor:
    kvm:
      pod:
        tolerations:
          hypervisorNoSchedule:
            key: "species"
            operator: "Equal"
            value: "hypervisor"
            effect: "NoSchedule"
        nodeSelector:
          species: hypervisor

