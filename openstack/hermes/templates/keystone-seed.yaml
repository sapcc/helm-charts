{{- if .Values.hermes.keystone_seed_enabled }}
{{- $cdomains := .Values.global.domain_seeds.customer_domains | required "missing value for .Values.global.domain_seeds.customer_domains" -}}
{{- $domains  := concat (list "cc3test" "ccadmin" "Default") $cdomains -}}
{{- $cdomainsWithoutSupportProjects := .Values.global.domain_seeds.customer_domains_without_support_projects | required "missing value for .Values.global.domain_seeds.customer_domains_without_support_projects" -}}

apiVersion: "openstack.stable.sap.cc/v1"
kind: OpenstackSeed
metadata:
  name: hermes-seed
  labels:
    component: hermes
spec:
  requires:
  - {{ .Values.global.keystoneNamespace }}/{{ .Values.global.is_global_region | ternary "keystone-global-seed" "keystone-seed" }}
  {{- range $domains}}
  {{- if not (hasPrefix "iaas-" .)}}
  - {{ $.Values.global.keystoneNamespace }}/domain-{{ replace "_" "-" . | lower }}-seed
  {{- end}}
  {{- end}}
  {{- if .Values.logRouter.enabled }}
  - monsoon3/ceph-seed
  {{- end}}

  roles:
    - name: audit_viewer
    {{- if .Values.logRouter.enabled }}
    - name: audit_admin
    {{- end }}

  services:
    - name:        hermes
      type:        audit-data
      description: 'OpenStack Audit Data access'
      enabled:     true
      endpoints:
        - region:    '{{.Values.global.region}}'
          interface: public
          enabled:   true
          url:       '{{.Values.hermes.catalog_url}}'

  # Default and cc3test get special handling
  # ccadmin gets additional role assignments for the master project
  # iaas- is excluded

  domains:
    - name: Default
      {{- if $.Values.logRouter.enabled }}
      # Same assignment on every domain below: hermes@Default gets
      # objectstore_admin in every project, so log-router can log in scoped to
      # the customer's project and Ceph makes that project the owner of every
      # audit object. iaas- domains are not seeded; hermes-api grants the role
      # per project on enable there (HERMES_DATAPLANE_ASSIGN_WRITER_ROLE).
      role_assignments:
      - user: hermes@Default
        role: objectstore_admin
        inherited: true
      {{- end }}
      users:
        - name: 'hermes'
          description: Hermes Service
          password: '{{.Values.hermes.seed_password}}'
          role_assignments:
            - project: service
              role:    service
        - name: admin
          role_assignments:
          - domain: Default
            role: audit_viewer
          - project: admin
            role: audit_viewer
      {{- if .Values.logRouter.enabled }}
      projects:
        # Scope for log-router's token once logRouter.swift.writerProject is
        # switched. Plain objectstore_admin (not cloud_objectstore_admin, which
        # is RGW admin). hermes@Default also holds objectstore_admin inherited
        # on every non-iaas domain (see role_assignments on the domains), which
        # log-router uses for project-scoped writes.
        - name: hermes-dataplane
          description: Hermes dataplane writer, owns no customer data
          role_assignments:
            - user: hermes@Default
              role: objectstore_admin
      {{- end }}
      groups:
        - name: administrators
          role_assignments:
            - domain: Default
              role: audit_viewer
            - project: admin
              role: audit_viewer

    - name: cc3test
      {{- if $.Values.logRouter.enabled }}
      role_assignments:
      - user: hermes@Default
        role: objectstore_admin
        inherited: true
      {{- end }}
      groups:
      - name: CC3TEST_DOMAIN_ADMINS
        role_assignments:
        - project: admin
          role: audit_viewer

    {{- range $domains}}
    {{- if and (not (eq . "Default")) (not (eq . "cc3test")) (not (hasPrefix "iaas-" .))}}
    - name: {{ . }}
      {{- if $.Values.logRouter.enabled }}
      role_assignments:
      - user: hermes@Default
        role: objectstore_admin
        inherited: true
      {{- end }}
      {{- if eq . "ccadmin"}}
      projects:
      - name: master
        role_assignments:
        - group: CCADMIN_CLOUD_ADMINS
          role: audit_viewer
        - group: CCADMIN_DOMAIN_ADMINS
          role: audit_viewer
        - group: CCADMIN_MONITORING_USERS
          role: audit_viewer
      {{- if $.Values.logRouter.enabled }}
      - name: cloud_admin
        role_assignments:
        # Cloud-scoped: grants cloud_objectstore_admin across every project in
        # the Ceph RGW Keystone integration — same pattern as Keppel (to
        # read/write blobs from/into customer Swift/RGW accounts).
        - user: hermes@Default
          role: cloud_objectstore_admin
      {{- end }}
      {{- end }}
      groups:
      - name: {{ hasPrefix "iaas-" . | ternary . ( upper . ) }}_API_SUPPORT
        role_assignments:
        {{- if not (has . $cdomainsWithoutSupportProjects) }}
        - project: api_support
          role: audit_viewer
        {{- end }}
        {{- if eq . "ccadmin"}}
        - project: api_tools
          role: audit_viewer
        {{- end }}
        - domain: {{ . }}
          role: audit_viewer
          inherited: true
      - name: {{ hasPrefix "iaas-" . | ternary . ( upper . ) }}_COMPUTE_SUPPORT
        role_assignments:
        {{- if not (has . $cdomainsWithoutSupportProjects) }}
        - project: compute_support
          role: audit_viewer
        {{- end }}
        {{- if eq . "ccadmin"}}
        - project: compute_tools
          role: audit_viewer
        {{- end }}
        - domain: {{ . }}
          role: audit_viewer
          inherited: true
      - name: {{ hasPrefix "iaas-" . | ternary . ( upper . ) }}_NETWORK_SUPPORT
        role_assignments:
        {{- if not (has . $cdomainsWithoutSupportProjects) }}
        - project: network_support
          role: audit_viewer
        {{- end }}
        {{- if eq . "ccadmin"}}
        - project: network_tools
          role: audit_viewer
        {{- end }}
        - domain: {{ . }}
          role: audit_viewer
          inherited: true
      - name: {{ hasPrefix "iaas-" . | ternary . ( upper . ) }}_STORAGE_SUPPORT
        role_assignments:
        {{- if not (has . $cdomainsWithoutSupportProjects) }}
        - project: storage_support
          role: audit_viewer
        {{- end }}
        {{- if eq . "ccadmin"}}
        - project: storage_tools
          role: audit_viewer
        {{- end }}
        - domain: {{ . }}
          role: audit_viewer
          inherited: true
      - name: {{ hasPrefix "iaas-" . | ternary . ( upper . ) }}_SERVICE_DESK
        role_assignments:
        {{- if not (has . $cdomainsWithoutSupportProjects) }}
        - project: service_desk
          role: audit_viewer
        {{- end }}
        - domain: {{ . }}
          role: audit_viewer
          inherited: true
    {{- end }}
    {{- end }}
{{- end }}
