{{- if .Values.hermes.rabbitmq_dataplane_enabled }}
{{- $region := .Values.global.region | required "missing value for .Values.global.region" }}
{{- $tld    := .Values.global.tld    | required "missing value for .Values.global.tld" }}
{{- $ips    := .Values.rabbitmq_dataplane.externalIPs }}
{{- if $ips }}
apiVersion: disco.stable.sap.cc/v1
kind: Record
metadata:
  name: hermes-rabbitmq-dataplane.{{ $region }}.{{ $tld }}
spec:
  type: A
  record: {{ index $ips 0 | quote }}
  hosts:
    - hermes-rabbitmq-dataplane.{{ $region }}.{{ $tld }}
{{- end }}
{{- end }}
