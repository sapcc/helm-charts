{{- if not .Values.kos_conductor }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-quota-class-sync
  labels:
    system: openstack
    type: secret
    component: ironic
  annotations:
    cloud.sap/inject-secrets: "true"
type: Opaque
stringData:
  os_username: {{ required ".Values.global.ironicServiceUser is missing" .Values.global.ironicServiceUser | include "resolve_secret" }}
  os_password: {{ required ".Values.global.ironicServicePassword is missing" .Values.global.ironicServicePassword | include "resolve_secret" }}
{{- end }}
