{{- if not .Values.kos_conductor }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-quota-class-sync
  annotations:
    cloud.sap/inject-secrets: "true"
type: Opaque
data:
  os_username: {{ include "ironic.helpers.service_user_username" . | b64enc }}
  os_password: {{ include "ironic.helpers.service_user_password" . | b64enc }}
{{- end }}
