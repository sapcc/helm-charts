{{- if not .Values.kos_conductor }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-quota-class-sync
  annotations:
    cloud.sap/inject-secrets: "true"
type: Opaque
data:
  os_username: {{ required ".Values.global.ironicServiceUser is missing" .Values.global.ironicServiceUser | include "resolve_secret" | b64enc }}
  os_password: {{ required ".Values.global.ironicServicePassword is missing" .Values.global.ironicServicePassword | include "resolve_secret" | b64enc }}
{{- end }}
