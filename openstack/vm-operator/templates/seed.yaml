{{- if .Values.seed.enabled -}}
{{- $vbase  := .Values.global.vaultBaseURL | required "missing value for .Values.global.vaultBaseURL" -}}
{{- $region := .Values.global.region       | required "missing value for .Values.global.region"       -}}

apiVersion: "openstack.stable.sap.cc/v1"
kind: "OpenstackSeed"
metadata:
  name: vm-operator-seed
spec:
  requires:
  - {{ .Values.global.keystoneNamespace }}/keystone-seed

  domains:
  - name: Default
    users:
    - name: vm_operator
      description: "vm-operator service user for CC. This user was automatically generated by a user seed: https://github.com/sapcc/helm-charts/tree/master/openstack/vm-operator/"
      password: {{ printf "%s/%s/vm-operator/keystone-user/password" $vbase $region | quote }}

  - name: ccadmin
    projects:
    - name: vm-operator
      description: "vm-operator for CC. This project was automatically generated by a project seed: https://github.com/sapcc/helm-charts/tree/master/openstack/vm-operator/"
      role_assignments:
      - user: vm_operator@Default
        role: member
      - user: vm_operator@Default
        role: reader
      # Read access to all OpenStack Nova servers and flavors
      - user: vm_operator@Default
        role: cloud_compute_viewer
      # Read access to all OpenStack Glance images
      - user: vm_operator@Default
        role: cloud_image_viewer
{{- end -}}
