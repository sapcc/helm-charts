{{- if .Values.remoteRbac.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-operator-manager
  labels:
    app.kubernetes.io/name: vm-operator
    app.kubernetes.io/component: rbac
rules:
  # Reconcile on the VirtualMachine CRD.
  - apiGroups:
      - cobaltcore.cloud
    resources:
      - virtualmachines
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - cobaltcore.cloud
    resources:
      - virtualmachines/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - cobaltcore.cloud
    resources:
      - virtualmachines/finalizers
    verbs:
      - update
  # Leader election.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Event recording.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-operator-manager
roleRef:
  kind: ClusterRole
  name: vm-operator-manager
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: User
  apiGroup: rbac.authorization.k8s.io
  name: {{ .Values.global.region }}:system:serviceaccount:{{ .Values.remoteRbac.namespace }}:vm-operator-manager
{{- end -}}
