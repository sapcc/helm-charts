apiVersion: v1
kind: Secret
metadata:
  name: swift-utils-secret
data:
  caretaker_password: {{ .Values.swift_account_caretaker.password | b64enc }}
  {{- if and .Values.swift_account_caretaker2.password (ne .Values.swift_account_caretaker2.password "DEFINED_IN_REGION_CHART") }}
  caretaker2_password: {{ .Values.swift_account_caretaker2.password | b64enc }}
  {{- end }}
