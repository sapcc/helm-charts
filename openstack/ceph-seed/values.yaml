service_user_rotation:
  # Seed ceph2@Default alongside ceph@Default for staged RGW rotations.
  # Requires global.ceph_rotation_service_password from the secret values.
  # Seed passwords initialize new users; rotate existing users in Keystone.
  # This does not select the active RGW account. See README.md for the rollout.
  enabled: false

owner-info:
  helm-chart-url: 'https://github.com/sapcc/helm-charts/tree/master/openstack/ceph-seed'
  support-group: storage
