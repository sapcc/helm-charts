service_user_rotation:
  # Seed ceph2@Default alongside ceph@Default for staged RGW rotations.
  # Requires global.ceph_rotation_service_password from the regional Vault values.
  # Seed passwords initialize new users; rotate existing users in Keystone.
  # This does not select the active RGW account. See README.md for the rollout.
  enabled: false

# Configure these references in regional secret values, before vault-injector:
# global:
#   ceph_service_password: *vault(path: <region>/ceph/keystone-user/service/password, field: password)
#   ceph_rotation_service_password: *vault(path: <region>/ceph/keystone-user/ceph2/password, field: password)

owner-info:
  helm-chart-url: 'https://github.com/sapcc/helm-charts/tree/master/openstack/ceph-seed'
  support-group: storage
