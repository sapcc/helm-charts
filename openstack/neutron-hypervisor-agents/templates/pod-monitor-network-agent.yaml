apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-agent
  labels:
    release_name: "{{ .Release.Name }}"
    type: podmonitor
    component: {{ .Release.Name }}
    system: openstack
    prometheus: openstack
  namespace: {{ .Release.Namespace }}
spec:
  podMetricsEndpoints:
    - honorLabels: true
      port: metrics-export
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: name
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      application: neutron
      component: linuxbridge-agent
