apiVersion: "openstack.stable.sap.cc/v1"
kind: "OpenstackSeed"
metadata:
  name: placement-seed
spec:
  requires:
  - monsoon3/domain-default-seed

  roles:
  - name: compute_admin
  - name: compute_viewer
  - name: cloud_compute_admin
  - name: cloud_network_admin
  - name: cloud_volume_admin
  - name: cloud_baremetal_admin

  services:
  - name: placement
    type: placement
    description: Openstack Placement API
    endpoints:
    - interface: admin
      region: '{{ .Values.global.region }}'
      url: 'http://placement-api.{{ include "svc_fqdn" . }}:{{.Values.global.placementApiPortAdmin}}'
    - interface: internal
      region: '{{ .Values.global.region }}'
      url: 'http://placement-api.{{ include "svc_fqdn" . }}:{{.Values.global.placementApiPortInternal}}'
    - interface: public
      region: '{{ .Values.global.region }}'
      url: 'https://{{include "placement_api_endpoint_host_public" .}}:{{.Values.global.placementApiPortPublic}}'

  domains:
  - name: Default
    users:
    {{- range $userKey, $userValue := .Values.service_users.users }}
    {{- $username := $userValue.username | required (printf "'.Values.service_users.users.%s.username' is required" $userKey) }}
    {{- $password := $userValue.password | required (printf "'.Values.service_users.users.%s.password' is required" $userKey) }}
    - name: '{{ $username | include "resolve_secret" }}'
      description: Placement API Service User
      password: '{{ $password | include "resolve_secret" }}'
      role_assignments:
      - project: service
        role: service
      - project: service
        role: admin
    {{- end }}
