---
# Standalone pinned fixture, using a DNS-safe ordinary tag.
imageVersion: my-tag@sha256:1111111111111111111111111111111111111111111111111111111111111111
global:
  region: regionOne
  domain: evil.corp
  registry: keppel.regionOne.cloud
  registryAlternateRegion: other.docker.registry
  dockerHubMirrorAlternateRegion: dockerhubmirror.example.com
  tld: regionOne.cloud
  clusterDNSSearchDomain: cluster.local
  placement_service_password: verySecret
  dbBackupServicePassword: topSecret
mariadb:
  enabled: false
  name: placement
  root_password: topRootSecret
  users:
    placement:
      name: placement
      password: topUserSecretPlacement
  backup_v2:
    enabled: false
mariadb_api:
  enabled: false
  defaultUser: placement
  name: nova-api
  root_password: topRootSecret
  users:
    placement:
      name: placement
      password: topUserSecretAPI
  backup_v2:
    enabled: false
