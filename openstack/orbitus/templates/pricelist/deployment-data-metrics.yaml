kind: Deployment
apiVersion: apps/v1

metadata:
  name: orbitus-pricelist-data-metrics

spec:
  revisionHistoryLimit: 5
  replicas: 1
  strategy:
    # When scraping Prometheus metrics from this pod, we intentionally do not
    # add any labels to distinguish different pod names, so that there is no
    # break in the metrics on pod restart. Because of this, we can only run at
    # most one pod in this deployment at all times. Otherwise scraping would
    # fail because all pods would try to submit metrics with identical labels.
    type: Recreate
  selector:
    matchLabels:
      name: pricelist-data-metrics
  template:
    metadata:
      labels:
        name: pricelist-data-metrics
      annotations:
        checksum/configmap: {{ include "orbitus/templates/pricelist/configmap.yaml" . | sha256sum }}
        kubectl.kubernetes.io/default-container: metrics
    spec:
      volumes:
        - name: config
          configMap:
            name: pricelist
        - name: pricelist-data
          emptyDir: {}
      initContainers:
        {{ include "pricelist_init_container" . | indent 8 }}
      containers:
        - name: metrics
          image: {{ include "pricelist_image" . }}
          imagePullPolicy: IfNotPresent
          args:
            - pricelist-regional-data-metrics
            - ":8080"
          env:
            {{ include "pricelist_common_envvars" . | indent 12 }}
          securityContext:
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /etc/pricelist
              name: config
            - mountPath: /pricelist-data
              name: pricelist-data
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            timeoutSeconds: 10
            periodSeconds: 60
            initialDelaySeconds: 60
          ports:
            - name: metrics
              containerPort: 8080
          {{- if .Values.pricelist.resources.enabled }}
          # TODO: Track and update the resource limits to realistic values during pilot phase
          resources:
            limits:
              cpu: '1'
              memory: '512Mi'
            requests:
              cpu: '100m'
              memory: '128Mi'
          {{- end }}
