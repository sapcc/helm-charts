{{- if eq .Values.coordinationBackend "etcd" }}
apiVersion: druid.gardener.cloud/v1alpha1
kind: Etcd
metadata:
  name: {{ .Values.etcd.service_name }}
  namespace: monsoon3
  labels:
    app: etcd-cinder-statefulset
    role: etcd-cinder
spec:
  annotations:
    app: etcd-cinder-statefulset
    # networking.gardener.cloud/to-dns: allowed
    # networking.gardener.cloud/to-private-networks: allowed
    # networking.gardener.cloud/to-public-networks: allowed
    role: etcd-cinder
  labels:
    app: etcd-cinder-statefulset
    # networking.gardener.cloud/to-dns: allowed
    # networking.gardener.cloud/to-private-networks: allowed
    # networking.gardener.cloud/to-public-networks: allowed
    role: etcd-cinder
  etcd:
    image: keppel.global.cloud.sap/ccloud-europe-docker-pkg-dev-mirror/gardener-project/public/gardener/etcd-wrapper:v0.8.4
    enableGRPCGateway: true
    metrics: basic
    defragmentationSchedule: "0 */24 * * *"
    resources:
      limits: { cpu: 150m, memory: 1Gi }
      requests: { cpu: 50m, memory: 200Mi }
    clientPort: {{ .Values.etcd.port }}
    serverPort: 2380
    quota: 2Gi
  backup:
    image: keppel.global.cloud.sap/ccloud-europe-docker-pkg-dev-mirror/gardener-project/public/gardener/etcdbrctl:v0.45.3
  sharedConfig:
    autoCompactionMode: periodic
    autoCompactionRetention: "15m"
  replicas: 3
{{- end }}
