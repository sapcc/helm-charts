global:
  tld: DEFINED_IN_VALUES_FILE
  region: DEFINED_IN_VALUES_FILE
  registry: DEFINED_IN_VALUES_FILE
  linkerd_requested: true

linkerd-support:
  annotate_namespace: true

owner-info:
  support-group: containers
  service: repo
  maintainers:
    - Stefan Majewsky
    - Sandro Jäckel
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/openstack/content-repo

# NOTE: When deploying from an OCM bundle, the deployment will supply image refs here to override the legacy image ref templating logic.
image_refs:
  swift_http_import: null
  alpine_curl: null
  statsd_exporter: null

image_version: DEFINED_IN_VALUES_FILE
debug: false

image_version_s3_proxy: '5.2.0'

auth_url: DEFINED_IN_VALUES_FILE

# Swift target where swift-http-import writes replicated content.
target:
  user_name: repo
  user_domain_name: Default
  project_name: master
  project_domain_name: ccadmin
  service_type: object-store

# Map with auth passwords for Swift targets and sources. Only the
# `target_auth_password` key is required.
passwords:
  target_auth_password: DEFINED_IN_VALUES_FILE

statsd_hostname: DEFINED_IN_VALUES_FILE

# S3 proxy serving the new Ceph-backed `repo-new.$REGION.cloud.sap` endpoint.
s3_proxy:
  replicas: 2
  signed_url_expiration: 15m
  # If set, a dedicated Service with externalIPs=[public_ip] serves plain HTTP
  # on port 8080 for baremetal netboot firmware. Leave null to disable.
  public_ip: null
  log:
    level: info
    format: text
  bucket:
    name: DEFINED_IN_VALUES_FILE
    s3Endpoint: DEFINED_IN_VALUES_FILE
    access_key: DEFINED_IN_VALUES_FILE
    secret_key: DEFINED_IN_VALUES_FILE

alerts:
  enabled: true
  # Name of the Prometheus to which the alerts should be assigned to.
  prometheus: infra-frontend

