global:
  tld: DEFINED_IN_VALUES_FILE
  region: DEFINED_IN_VALUES_FILE
  registry: DEFINED_IN_VALUES_FILE
  linkerd_requested: true

linkerd-support:
  annotate_namespace: true

owner-info:
  support-group: containers
  service: repo
  maintainers:
    - Stefan Majewsky
    - Sandro Jäckel
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/openstack/content-repo

# NOTE: When deploying from an OCM bundle, the deployment will supply image refs here to override the legacy image ref templating logic.
image_refs:
  swift_http_import: null
  alpine_curl: null
  statsd_exporter: null

image_version: DEFINED_IN_VALUES_FILE
debug: false

image_version_s3_proxy: '5.2.0'

auth_url: DEFINED_IN_VALUES_FILE

# Legacy single-target config. Still honored: when .Values.targets is unset
# this block is synthesized into a single-entry targets map under the key
# "default", keeping the legacy unsuffixed resource names and TARGET_AUTH_PASSWORD
# env var. Prefer .Values.targets below when running multiple backends.
target:
  user_name: repo
  user_domain_name: Default
  project_name: master
  project_domain_name: ccadmin
  service_type: object-store

# Multi-target config for running swift-http-import against multiple backends
# simultaneously (e.g. during a swift->ceph transition period).
#
# The entry named "default" is rendered without a suffix, preserving back-compat
# resource names: config file <repo>.yaml, CronJob content-repo-<repo>, statsd
# prefix repo.<repo>, and env var TARGET_AUTH_PASSWORD.
#
# Any additional entry named <target> produces:
#   - config file  <repo>-<target>.yaml
#   - CronJob      content-repo-<repo>-<target>
#   - statsd prefix repo.<repo>-<target>
#   - env var      <TARGET>_AUTH_PASSWORD   (upper-cased, hyphens→underscores)
#
# Each entry references a key from .Values.passwords via `password_key`.
#
# targets:
#   default:
#     user_name:           repo
#     user_domain_name:    Default
#     project_name:        master
#     project_domain_name: ccadmin
#     service_type:        object-store
#     password_key:        target_auth_password
#   ceph:
#     user_name:           repo
#     user_domain_name:    Default
#     project_name:        master
#     project_domain_name: ccadmin
#     service_type:        object-store-ceph
#     password_key:        ceph_auth_password

# Map with auth passwords for Swift/Ceph targets and sources.
# `target_auth_password` is required for the default (swift) target.
# Add `ceph_auth_password` when using a `ceph` entry in .Values.targets.
passwords:
  target_auth_password: DEFINED_IN_VALUES_FILE
  # ceph_auth_password: DEFINED_IN_VALUES_FILE

statsd_hostname: DEFINED_IN_VALUES_FILE

# S3 proxy serving the new Ceph-backed `repo-new.$REGION.cloud.sap` endpoint.
s3_proxy:
  replicas: 2
  signed_url_expiration: 15m
  # If set, a dedicated Service with externalIPs=[public_ip] serves plain HTTP
  # on port 8080 for baremetal netboot firmware. Leave null to disable.
  public_ip: null
  log:
    level: info
    format: text
  bucket:
    name: DEFINED_IN_VALUES_FILE
    s3Endpoint: DEFINED_IN_VALUES_FILE
    access_key: DEFINED_IN_VALUES_FILE
    secret_key: DEFINED_IN_VALUES_FILE

alerts:
  enabled: true
  # Name of the Prometheus to which the alerts should be assigned to.
  prometheus: infra-frontend

