{{- if .Values.s3_proxy.enabled -}}

apiVersion: v1
kind: ConfigMap

metadata:
  name: s3-proxy
  namespace: content-repo
  labels:
    system: openstack
    component: content-repo

data:
  config.yaml: |
    log:
      level: {{ .Values.s3_proxy.log.level | default "info" | quote }}
      format: {{ .Values.s3_proxy.log.format | default "text" | quote }}

    server:
      listenAddr: ""
      port: 8080
      compress:
        enabled: true

    internalServer:
      listenAddr: ""
      port: 9090

    targets:
      repo:
        mount:
          path:
            - /
        actions:
          GET:
            enabled: true
            config:
              redirectToSignedUrl: true
              redirectWithTrailingSlashForNotFoundFile: true
              signedUrlExpiration: {{ .Values.s3_proxy.signed_url_expiration | default "15m" | quote }}
        bucket:
          name: {{ .Values.s3_proxy.bucket.name | required ".Values.s3_proxy.bucket.name is required" | quote }}
          region: {{ .Values.global.region }} # Ceph/RadosGW ignores this, but Swift expects the region name here
          s3Endpoint: {{ .Values.s3_proxy.bucket.s3Endpoint | required ".Values.s3_proxy.bucket.s3Endpoint is required" | quote }}
          disableSSL: false
          s3ForcePathStyle: true # required for non-AWS endpoints
          credentials:
            accessKey:
              path: /etc/ec2-creds/access-key
            secretKey:
              path: /etc/ec2-creds/secret-key
{{- end }}
