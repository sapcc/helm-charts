apiVersion: v1
kind: ServiceAccount
metadata:
  # This service account is used by the Job of the same name.
  name: issue-ec2-credentials

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: issue-ec2-credentials
rules:
  - apiGroups: [ "" ]
    resources: [ secrets ]
    verbs:     [ get, delete, patch, update ]
    resourceNames:
      - s3-proxy-ec2-credentials

  # "create" permission cannot be restricted to specific resourceNames
  # Ref: <https://stackoverflow.com/a/65203104>
  - apiGroups: [ "" ]
    resources: [ secrets ]
    verbs:     [ create ]

  # need the UID of the s3-proxy deployment to render an owner reference
  - apiGroups: [ apps ]
    resources: [ deployments ]
    verbs:     [ get ]
    resourceNames:
      - s3-proxy

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: issue-ec2-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: issue-ec2-credentials
subjects:
  - kind: ServiceAccount
    name: issue-ec2-credentials
    namespace: {{ .Release.Namespace }}
