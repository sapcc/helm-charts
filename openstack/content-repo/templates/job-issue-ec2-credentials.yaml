apiVersion: batch/v1
kind: Job

metadata:
  name: issue-ec2-credentials
  labels:
    system: openstack
    component: content-repo
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:
  completions: 1
  ttlSecondsAfterFinished: 300 # ensure that Job is cleaned up even if `helm delete` leaves it behind
  template:
    metadata:
      labels:
        component: issue-ec2-credentials
    spec:
      restartPolicy: OnFailure
      serviceAccountName: issue-ec2-credentials
      volumes:
        - name: workdir
          emptyDir: {}
      initContainers: # This "abuses" the initContainers vs. containers distinction to run two tasks in sequence.
        - name: issue-creds
          {{- $version := .Values.image_version_ec2_credentials_helper | required "missing value for .Values.image_version_ec2_credentials_helper" }}
          image: {{ $.Values.global.registry }}/ec2-credentials-helper:{{ $version }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OS_AUTH_URL
              value: "https://identity-3.{{ .Values.global.region }}.{{ .Values.global.tld }}/v3"
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_USERNAME
              value: content-repo
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swift-http-import
                  key: s3_auth_password
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: content-repo-payloads
            - name: OS_REGION_NAME
              value: {{ quote .Values.global.region }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - mountPath: /workdir
              name: workdir
          workingDir: /workdir
      containers:
        - name: write-creds
          image: {{ include "shared-app-images.ref" (tuple $ "alpine-kubectl" "latest") }}
          command: [ ash, -c, {{ .Files.Get "bin/write-ec2-credentials.sh" | quote }} ]
          env:
            - name: DEBUG
              value: "false" # set to true to `set -x`
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - mountPath: /workdir
              name: workdir
          workingDir: /workdir
