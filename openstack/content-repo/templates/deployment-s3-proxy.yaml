{{- if .Values.s3_proxy.enabled -}}
kind: Deployment
apiVersion: apps/v1

metadata:
  name: s3-proxy
  namespace: content-repo
  labels:
    system: openstack
    component: content-repo

spec:
  revisionHistoryLimit: 5
  replicas: {{ .Values.s3_proxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      component: s3-proxy
  template:
    metadata:
      labels:
        component: s3-proxy
      annotations:
        checksum/configmap: {{ include "content-repo/templates/configmap-s3-proxy.yaml" . | sha256sum }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - s3-proxy
              topologyKey: "kubernetes.io/hostname"
            weight: 10
      volumes:
        - name: config
          configMap:
            name: s3-proxy
        - name: ec2-creds
          emptyDir: {}
      initContainers:
        - name: issue-ec2-creds
          {{- if .Values.image_refs.swift_http_import }}
          image: {{ quote .Values.image_refs.swift_http_import }}
          {{- else }}
          image: {{ .Values.global.registry }}/swift-http-import:{{ include "image_version" .Values }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          args: [ '--replace-and-issue-ec2-credentials' ]
          env:
            - name: OS_AUTH_URL
              value: "http://keystone.{{ .Values.global.keystoneNamespace }}.svc.{{ .Values.global.clusterDNSSearchDomain }}:5000/v3"
            - name: OS_INTERFACE
              value: internal
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_USERNAME
              value: content-repo
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swift-http-import
                  key: s3_auth_password
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_NAME
              value: content-repo-payloads
            - name: OS_REGION_NAME
              value: {{ quote .Values.global.region }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - mountPath: /ec2-creds
              name: ec2-creds
          workingDir: /ec2-creds
      containers:
        - name: s3-proxy
          image: {{ .Values.global.ghcrIoMirror }}/oxyno-zeta/s3-proxy:{{ .Values.image_version_s3_proxy }}
          imagePullPolicy: IfNotPresent
          args: [ "--config", "/etc/s3-proxy" ]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/ec2-creds
              name: ec2-creds
              readOnly: true
            - mountPath: /etc/s3-proxy
              name: config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            timeoutSeconds: 5
            periodSeconds: 30
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            timeoutSeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
{{- end }}
