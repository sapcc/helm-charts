{{- if .Values.s3_proxy.enabled -}}
kind: Deployment
apiVersion: apps/v1

metadata:
  name: s3-proxy
  namespace: content-repo
  labels:
    system: openstack
    component: content-repo
  annotations:
    # This secret is updated at `helm upgrade` time by Job "issue-ec2-credentials".
    secret.reloader.stakater.com/reload: s3-proxy-ec2-credentials

spec:
  revisionHistoryLimit: 5
  replicas: {{ .Values.s3_proxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      component: s3-proxy
  template:
    metadata:
      labels:
        component: s3-proxy
      annotations:
        checksum/configmap: {{ include "content-repo/templates/configmap-s3-proxy.yaml" . | sha256sum }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - s3-proxy
              topologyKey: "kubernetes.io/hostname"
            weight: 10
      volumes:
        - name: config
          configMap:
            name: s3-proxy
        - name: ec2-creds
          secret:
            secretName: s3-proxy-ec2-credentials
            defaultMode: 0444 # read-only
      containers:
        - name: s3-proxy
          image: {{ .Values.global.ghcrIoMirror }}/oxyno-zeta/s3-proxy:{{ .Values.image_version_s3_proxy }}
          imagePullPolicy: IfNotPresent
          args: [ "--config", "/etc/s3-proxy" ]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/ec2-creds
              name: ec2-creds
              readOnly: true
            - mountPath: /etc/s3-proxy
              name: config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            timeoutSeconds: 5
            periodSeconds: 30
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            timeoutSeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
{{- end }}
