{{- $vbase  := .Values.global.vaultBaseURL | required "missing value for .Values.global.vaultBaseURL" -}}
{{- $region := .Values.global.region       | required "missing value for .Values.global.region"       -}}

apiVersion: v1
kind: Secret
metadata:
  name: limes-secret
data:
  os_password: {{ required ".Values.limes.passwords.ccloud.os_password" .Values.limes.passwords.ccloud.os_password | b64enc }}
  {{- if .Values.limes.has_audit_trail }}
  rabbitmq_username:     {{ printf "%s/%s/hermes/rabbitmq-user/notifications-limes-b/username" $vbase $region | b64enc }}
  rabbitmq_password:     {{ printf "%s/%s/hermes/rabbitmq-user/notifications-limes-b/password" $vbase $region | b64enc }}
  {{- end }}
