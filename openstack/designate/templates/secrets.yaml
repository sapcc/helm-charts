apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    system: openstack
    type: configuration
    application: {{ .Release.Name }}
type: Opaque
data: 
  secrets.conf: |
    {{ include (print .Template.BasePath "/etc/_secrets.conf.tpl") . | b64enc | indent 4 }}
  pools.yaml: |
    {{ include (print .Template.BasePath "/etc/_pools.yaml.tpl") . | b64enc | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets-rndc
  labels:
    system: openstack
    type: configuration
    application: {{ .Release.Name }}
stringData:
{{- range $pool := .Values.bind_pools }}
  {{ $pool.name }}.pool.key: |
    key "{{ $pool.rndc.keyname }}" {
      algorithm "{{ $pool.rndc.algo }}";
      secret "{{ $pool.rndc.secret }}";
    };
{{- end }}
