---
# Standalone pinned fixture, including optional cells and their real aliases.
imageVersion: my-tag@sha256:1111111111111111111111111111111111111111111111111111111111111111
imageVersionVspc: vspc-latest-tag
imageVersionConsoleMks: console-mks-tag
global:
  accessControlAllowOrigin: '*'
  region: regionOne
  domain: evil.corp
  registry: keppel.regionOne.cloud
  registryAlternateRegion: keppel.regionTwo.cloud
  dockerHubMirror: myRegistry/dockerhub
  dockerHubMirrorAlternateRegion: myRegistry/dockerhubalternate
  tld: regionOne.cloud
  clusterDNSSearchDomain: cluster.local
  domain_seeds:
    customer_domains: [bar, foo, baz]
    customer_domains_without_support_projects: [baz]
  master_password: topSecret
  nova_service_password: topSecret
  availability_zones: [foo, bar]
  nova_metadata_secret: topSecretWouldBuyAgain
cell2:
  enabled: true
  name: cell-b-2
cell3:
  enabled: true
  name: cell-c-3
defaultUsersMariaDB:
  api: nova_api
  cell0: nova_api_cell0
  cell1: nova
  cell2: nova_cell2
  cell3: nova_cell3
cell0dbTarget: api
proxysql:
  mode: host_alias
mysql_metrics:
  connections:
    default:
      db_type: mariadb
      db_instance_name: null
      db_name: nova
      db_user: metrics
      db_password: passwordMetrics
    cell2:
      db_type: mariadb
      db_instance_name: cell-b-2
      db_name: nova_cell2
      db_user: metrics
      db_password: passwordMetrics
    cell3:
      db_type: mariadb
      db_instance_name: cell-c-3
      db_name: nova_cell3
      db_user: metrics
      db_password: passwordMetrics
mariadb_api:
  enabled: true
  databases: [nova_api, nova_cell0]
  root_password: rootrootApi
  backup_v2:
    enabled: false
  users:
    backup:
      name: backup
      password: passwordBackupApi
    nova_api:
      name: nova_api
      password: passwordApi
    nova_api_cell0:
      name: nova_api_cell0
      password: passwordApiCell0
mariadb:
  enabled: true
  root_password: rootrootCell1
  backup_v2:
    enabled: false
  users:
    backup:
      name: backup
      password: passwordBackup
    nova:
      name: nova
      password: passwordCell1
    nova_cell0:
      name: nova_cell0
      password: passwordCell0
mariadb_cell2:
  enabled: true
  name: nova-cell-b-2
  root_password: rootrootCell2
  databases: [nova_cell_b_2]
  backup_v2:
    enabled: false
  users:
    nova_cell2:
      name: nova_cell2
      password: passwordCell2
mariadb_cell3:
  enabled: true
  name: nova-cell-c-3
  root_password: rootrootCell3
  databases: [nova_cell_c_3]
  backup_v2:
    enabled: false
  users:
    nova_cell3:
      name: nova_cell3
      password: passwordCell3
rabbitmq:
  users:
    admin:
      user: rabbitmq
      password: adminadmin
    default:
      user: rabbitmq
      password: defaultdefault
  metrics:
    password: passwordMetrics
rabbitmq_cell2:
  users:
    admin:
      user: admin
      password: adminadmin
    default:
      user: default
      password: defaultdefault
  metrics:
    password: passwordMetrics
rabbitmq_cell3:
  users:
    admin:
      user: admin
      password: adminadmin
    default:
      user: default
      password: defaultdefault
  metrics:
    password: passwordMetrics
