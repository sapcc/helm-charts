enabled: false

# Schedule in cron format (UTC)
schedule: "0 6 * * *"

# Namespace to deploy into
namespace: infra-monitoring

# Alpine image used by the CronJob container
image: keppel.eu-de-1.cloud.sap/ccloud-dockerhub-mirror/library/alpine

# GitHub token for cloning keystone-saml-federation (read-only access)
# In production: set via Vault/mutavault — value of github-access-token/ccee-bot
githubToken: ""

# Federation git repo URL
federationRepo: "https://github.wdf.sap.corp/sap-cloud-infrastructure/keystone-saml-federation.git"

# Region this CronJob is responsible for — must match exactly one region file basename
# (e.g. "eu-de-1"). Only certs for this region are checked; all others are skipped.
region: ""

# Days remaining before ALERT (cert needs rotation)
alertDays: 90
# Days remaining before WARN (rotation recommended)
warnDays: 180
