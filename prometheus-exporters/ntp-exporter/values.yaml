ntp:
  server: timehost1.global.cloud.sap
  # When the drift exceeds the high-drift threshold, the exporter measures
  # repeatedly for this long and reports the median. Keep it below the
  # Prometheus scrape timeout, or every scrape of a drifting node times out.
  measurementDuration: 10s
  # Optional high-drift threshold; the exporter's default is 10ms.
  # highDrift: 50ms

resources:
  requests:
    memory: 40Mi
    cpu: 10m
  limits:
    memory: 100Mi
    cpu: 20m

metrics:
  port: 9559

# Deploy Namespace exporters Prometheus alerts.
alerts:
  enabled: true
  # Name of the Prometheus to which the alerts should be assigned to.
  prometheus: kubernetes
  # The tier of the alert.
  tier: k8s
