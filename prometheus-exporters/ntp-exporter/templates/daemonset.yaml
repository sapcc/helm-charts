apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ntp-exporter
spec:
  minReadySeconds: 5

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: '50%' # these pods can be rolled rather quickly since they are not in the hot path

  selector:
    matchLabels:
      app: ntp-exporter

  template:
    metadata:
      name: ntp-exporter
      labels:
        app: ntp-exporter

    spec:
      tolerations:
      - key: "species"
        operator: "Exists"
        effect: "NoSchedule"

      containers:
        - name:  ntp-exporter
          image: {{ required ".Values.global.ghcrIoMirror missing" .Values.global.ghcrIoMirror }}/sapcc/ntp_exporter:{{ .Chart.AppVersion }}
          args:
            - "-ntp.server={{ required ".Values.ntp.server missing" .Values.ntp.server }}"
            # Above the high-drift threshold (default 10ms) the exporter measures
            # repeatedly for this long and reports the median. Keep it below the
            # Prometheus scrape timeout (25s), or every scrape of a drifting node
            # times out and the target shows up as down instead of as clock drift.
            - "-ntp.measurement-duration=10s"
          ports:
            - name: metrics
              containerPort: {{ required ".Values.metrics.port missing" .Values.metrics.port }}

          {{- if .Values.resources }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          {{- end }}
