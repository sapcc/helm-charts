{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ printf "%s-harvest-pod-monitor" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    prometheus: {{ required ".Values.global.prometheus missing" .Values.global.prometheus }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      component: harvest-worker
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        # PodMonitor does not copy pod labels onto metrics by default;
        # map them so queries can filter e.g. by app (sapcc/helm-charts#12884).
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
{{- end }}
