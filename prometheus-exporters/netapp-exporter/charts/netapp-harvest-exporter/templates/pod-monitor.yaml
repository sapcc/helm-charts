{{- if .Values.podMonitor.enabled }}
{{- range $az := .Values.global.availability_zones }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ printf "%s-harvest-pod-monitor-%s" $.Release.Name $az | trunc 63 | trimSuffix "-" }}
  labels:
    prometheus: {{ printf "storage-metrics-product-%s" $az }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  selector:
    matchLabels:
      component: harvest-worker
      # pod label set by netappsd (sapcc/netappsd#14)
      availability-zone: {{ $az }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
{{- end }}
