groups:
  - name: manila-maia
    rules:
      - alert: ManilaMaiaMetricsAbsent
        expr: |
          absent({__name__=~".+:maia"})
          and count(netapp_volume_labels:manila) > 0
        for: 30m
        labels:
          severity: info
          context: maia
          service: manila
          tier: os
          support_group: compute-storage-api
          support_component: manila_netapp
        annotations:
          description: >
            No Maia recording-rule metrics (metric names ending in :maia) are
            present, while Manila volume inventory still exists.
          summary: Maia metrics are absent while Manila volumes exist

