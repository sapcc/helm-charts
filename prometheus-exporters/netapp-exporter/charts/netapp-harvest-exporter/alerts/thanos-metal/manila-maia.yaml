groups:
  - name: manila-maia
    rules:
      # netapp_snapmirror_labels:maia is computed centrally (see
      # aggregations/thanos-metal/snapmirror.yaml), so this absence check must
      # also run centrally rather than per-AZ.
      - alert: AbsentNetAppSnapmirrorLabelsMaia
        expr: absent(netapp_snapmirror_labels:maia)
        for: 30m
        labels:
          severity: info
          context: maia
          service: manila
          tier: os
          support_group: compute-storage-api
          support_component: manila_netapp
        annotations:
          description: Metrics `netapp_snapmirror_labels:maia` missing
          summary: Metrics `netapp_snapmirror_labels:maia` missing
