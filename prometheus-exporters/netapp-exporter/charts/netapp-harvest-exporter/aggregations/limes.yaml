groups:
  - name: manila-limes
    rules:
      # building a heuristic to tell how much space is consumed by backend (non-manila) snapmirror replication.
      # we look at the source (volume_type is not dp)
      # we only look at volumes that have dedicated snapshot policy: case insensitive hxm_backups or ec2_backups
      # we require share type and project id to be able to associate to valid billing targets.
      # we multiply the source bytes with the count of target snapmirrors, that are not matching the manila naming pattern
      # such EC2DR (different region) or EC2BKP (same region) snapmirrors are setup outside of manila
      # and have a (not so easily predictable) suffix at the vserver name.
      # last over time to bridge gaps of missing metrics.
      # max by the labels that limes is expecting: availability_zone, project_id, share_id, share_type

      - record: netapp_snapmirror_capacity_count
        expr: |
            count by (volume) (label_replace(
                    last_over_time(
                        netapp_snapmirror_endpoint_labels{
                            destination_vserver!~"ma_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"}[15m]
                    ),
                    "volume", "$1", "source_volume", "(.*)"))

      - record: netapp_snapmirror_capacity_total_bytes:single
        expr: |
            netapp_volume_total_bytes:manila * on (app, host, svm, volume)
                group_left(snapshot_policy, volume_state) netapp_volume_labels{
                    project_id!="",
                    share_type!="",
                    snapshot_policy=~"(?i:(hxm|ec2))_(?i:(backups))",
                    volume_state="online",
                    volume_type!="dp"}

      - record: netapp_snapmirror_capacity_total_bytes
        expr: |
            netapp_snapmirror_capacity_total_bytes:single * on(volume) group_left() netapp_snapmirror_capacity_count

      - record: netapp_snapmirror_capacity_total_bytes:backup_for_limes
        expr: |
            max by (availability_zone, project_id, share_id, share_type) (
                last_over_time(netapp_snapmirror_capacity_total_bytes[15m]))

      # SMAS-NAS (automated_failover) replicates the whole vserver, so there are no
      # per-volume snapmirror relationships to count. Every manila volume on such an
      # SVM is replicated exactly once, hence the plain capacity of the source volume.
      # 'and on (svm)' is a pure membership filter: it keeps the volume capacity value
      # untouched instead of scaling it by the snapmirror label value.
      - record: netapp_snapmirror_capacity_total_bytes:automated_failover
        expr: |
            netapp_volume_total_bytes:manila{project_id!="", share_type!="", volume_type!="dp"}
            and on (svm) max by (svm) (label_replace(
                netapp_snapmirror_labels{policy_type="automated_failover"},
                "svm", "$1", "source_vserver", "(.*)"))

      - record: netapp_snapmirror_capacity_total_bytes:automated_failover_for_limes
        expr: |
            max by (availability_zone, project_id, share_id, share_type) (
                last_over_time(netapp_snapmirror_capacity_total_bytes:automated_failover[15m]))

      # Both replication flavours are billed through this single rule, so the metric can
      # never be emitted twice for the same share. Each source is already deduplicated to
      # one series per share by its own 'max by' above, and the sum is what limes has to
      # charge: should a volume ever be part of SMAS-NAS *and* of a backend backup
      # snapmirror, both replicas occupy space and both have to be accounted for.
      - record: netapp_snapmirror_capacity_total_bytes_for_limes
        expr: |
            sum by (availability_zone, project_id, share_id, share_type) (
                {__name__=~"netapp_snapmirror_capacity_total_bytes:(backup|automated_failover)_for_limes"})

      - record: netapp_snapmirror_capacity_used_bytes:single
        expr: |
            netapp_volume_used_bytes:manila * on (app, host, svm, volume)
                group_left(snapshot_policy, volume_state) netapp_volume_labels{
                    project_id!="",
                    share_type!="",
                    snapshot_policy=~"(?i:(hxm|ec2))_(?i:(backups))",
                    volume_state="online",
                    volume_type!="dp"}

      - record: netapp_snapmirror_capacity_used_bytes
        expr: |
            netapp_snapmirror_capacity_used_bytes:single * on(volume) group_left() netapp_snapmirror_capacity_count

      - record: netapp_snapmirror_capacity_used_bytes:backup_for_limes
        expr: |
            max by (availability_zone, project_id, share_id, share_type) (
                last_over_time(netapp_snapmirror_capacity_used_bytes[15m]))

      # Same SMAS-NAS (automated_failover) reasoning as for the total bytes above.
      - record: netapp_snapmirror_capacity_used_bytes:automated_failover
        expr: |
            netapp_volume_used_bytes:manila{project_id!="", share_type!="", volume_type!="dp"}
            and on (svm) max by (svm) (label_replace(
                netapp_snapmirror_labels{policy_type="automated_failover"},
                "svm", "$1", "source_vserver", "(.*)"))

      - record: netapp_snapmirror_capacity_used_bytes:automated_failover_for_limes
        expr: |
            max by (availability_zone, project_id, share_id, share_type) (
                last_over_time(netapp_snapmirror_capacity_used_bytes:automated_failover[15m]))

      - record: netapp_snapmirror_capacity_used_bytes_for_limes
        expr: |
            sum by (availability_zone, project_id, share_id, share_type) (
                {__name__=~"netapp_snapmirror_capacity_used_bytes:(backup|automated_failover)_for_limes"})

      - record: netapp_volume_used_bytes_for_limes
        expr: |
            max by (availability_zone, project_id, share_id, share_type) (
                last_over_time(manila_share_used_bytes_for_castellum{project_id!="", share_type!="", share_id!=""}[15m]))

      - record: netapp_snapshot_used_bytes_for_limes
        expr: |
            max by (availability_zone, project_id, share_id, share_type) (
                last_over_time(netapp_volume_snapshots_size_used{app="netapp-harvest-exporter-manila", project_id!="", share_id!="", volume_type!="dp"}[15m]))
