# Five-minute snapshot counts for long-term error-line trends, not counters.
# The window is shifted 25min into the past so ingestion can catch up.
[query_opensearch_logs_cinder_error_lines]
QueryIntervalSecs = 300
QueryTimeoutSecs = 15
QueryOnMissing = zero
QueryOnError = drop
QueryIndices = logs*
QueryJson = {
      "size": 0,
      "track_total_hits": true,
      "query": {
        "bool": {
          "filter": [
            {"range": {"@timestamp": {"gte": "now-30m", "lt": "now-25m"}}},
            {"term": {"resource.app.label.ccloud.support-group": "compute-storage-api"}},
            {"prefix": {"resource.k8s.container.name": "cinder-"}},
            {"match": {"body": "error"}}
          ]
        }
      }
    }

[query_opensearch_logs_cinder_total_lines]
QueryIntervalSecs = 300
QueryTimeoutSecs = 15
QueryOnMissing = zero
QueryOnError = drop
QueryIndices = logs*
QueryJson = {
      "size": 0,
      "track_total_hits": true,
      "query": {
        "bool": {
          "filter": [
            {"range": {"@timestamp": {"gte": "now-30m", "lt": "now-25m"}}},
            {"term": {"resource.app.label.ccloud.support-group": "compute-storage-api"}},
            {"prefix": {"resource.k8s.container.name": "cinder-"}}
          ]
        }
      }
    }
