[query_opensearch_logs_saml_sp_cert_expiry_warn]
QueryIntervalSecs = 3600
QueryTimeoutSecs = 15
QueryIndices = logs-*
QueryJson = {
        "size": 0,
        "query": {
          "bool": {
            "must": [
              {
                "range": {
                  "@timestamp": {
                    "gt": "now-1h",
                    "format": "epoch_millis"
                  }
                }
              }
            ],
            "filter": [
              {
                "multi_match": {
                  "type": "phrase",
                  "query": "WARN: SP cert",
                  "lenient": true
                }
              }
            ],
            "should": [],
            "must_not": []
          }
        }
    }
