# Five-minute snapshot counts for long-term error-line trends, not counters.
# Use the exact _hits metrics; there is no container-bucket limit.
[query_opensearch_logs_nova_error_lines]
QueryIntervalSecs = 300
QueryTimeoutSecs = 15
QueryOnMissing = zero
QueryOnError = drop
QueryIndices = logs-*
QueryJson = {
      "size": 0,
      "track_total_hits": true,
      "query": {
        "bool": {
          "filter": [
            {"range": {"@timestamp": {"gte": "now-5m"}}},
            {"term": {"resource.app.label.ccloud.support-group": "compute-storage-api"}},
            {"prefix": {"resource.k8s.container.name": "nova-"}},
            {"match": {"body": "error"}}
          ]
        }
      }
    }

[query_opensearch_logs_nova_total_lines]
QueryIntervalSecs = 300
QueryTimeoutSecs = 15
QueryOnMissing = zero
QueryOnError = drop
QueryIndices = logs-*
QueryJson = {
      "size": 0,
      "track_total_hits": true,
      "query": {
        "bool": {
          "filter": [
            {"range": {"@timestamp": {"gte": "now-5m"}}},
            {"term": {"resource.app.label.ccloud.support-group": "compute-storage-api"}},
            {"prefix": {"resource.k8s.container.name": "nova-"}}
          ]
        }
      }
    }
