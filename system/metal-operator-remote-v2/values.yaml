# Default values for metal-operator-remote-v2 Helm chart.
# This is a YAML-formatted file for DDO (DualDeploymentOperator) integration.

# Mode selection: 'seed' or 'shoot'
mode: seed

# Metal Operator subchart configuration
metal-operator:
  # Disable by default; DDO will manage deployment via dual-render
  enabled: true

# Seed-mode DDO configuration (rendered when mode: seed)
seedValues: {}
  # Placeholder for seed-specific CR fields
  # Example:
  # replicas: 1
  # seedSelector:
  #   matchLabels:
  #     environment: seed

# Shoot-mode DDO configuration (rendered when mode: shoot)
shootValues: {}
  # Placeholder for shoot-specific CR fields
  # Example:
  # replicas: 2
  # shootSelector:
  #   matchLabels:
  #     environment: shoot

# Global configuration
global:
  # Namespace where resources are deployed
  namespace: metal-system
