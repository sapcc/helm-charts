{{- /*
Shoot-RBAC bootstrap (design.md 3.6.7; README 2.6): the operator applies the shoot render
AS the token-requestor ServiceAccount, which cannot grant itself RBAC (Kubernetes
privilege-escalation prevention). A privileged principal must seed its apply permissions
first. This ManagedResource is delivered by gardener-resource-manager (GRM) in the seed CP
namespace to the shoot (GRM holds cluster-admin-equivalent there), creating an apply-scoped
ClusterRole + binding for the SA.

CARVE-OUT (matches dualdeploymentoperator-cr.yaml): renders ONLY when .Values.mode is unset
(direct helm install) AND enabled — it MUST NOT appear inside an operator render (mode=seed
/shoot), because the operator cannot deliver its own bootstrap (chicken-and-egg). It is
install-time plumbing, applied by helm+GRM before/independently of the operator, exactly
like the token-requestor Secret it complements.
*/ -}}
{{- if and (not .Values.mode) .Values.shootRbacBootstrap.enabled }}
{{- $saName := required "shootRbacBootstrap.serviceAccountName is required" .Values.shootRbacBootstrap.serviceAccountName }}
{{- $saNamespace := required "shootRbacBootstrap.serviceAccountNamespace is required" .Values.shootRbacBootstrap.serviceAccountNamespace }}
{{- $objects := printf `apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dual-deployment-operator-shoot-applier
  labels:
    dual-deployment-operator.cc.sap/bootstrap: "true"
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["serviceaccounts", "configmaps", "secrets", "services", "namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dual-deployment-operator-shoot-applier
  labels:
    dual-deployment-operator.cc.sap/bootstrap: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dual-deployment-operator-shoot-applier
subjects:
- kind: ServiceAccount
  name: %s
  namespace: %s
` $saName $saNamespace }}
apiVersion: resources.gardener.cloud/v1alpha1
kind: ManagedResource
metadata:
  name: dual-deployment-operator-shoot-rbac-bootstrap
  namespace: {{ default .Release.Namespace .Values.shootRbacBootstrap.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  secretRefs:
  - name: dual-deployment-operator-shoot-rbac-bootstrap
  keepObjects: false
---
apiVersion: v1
kind: Secret
metadata:
  name: dual-deployment-operator-shoot-rbac-bootstrap
  namespace: {{ default .Release.Namespace .Values.shootRbacBootstrap.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  objects.yaml: {{ $objects | b64enc }}
{{- end }}
