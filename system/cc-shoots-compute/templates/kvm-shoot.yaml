{{- if .Values.kvmShoots -}}
{{- range $key, $cluster := .Values.kvmShoots }}
---
apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: {{ $key }}
  labels:
    cluster-type: sci-k8s-compute
    greenhouse.sap/owned-by: compute
    greenhouse.sap/shoot-grafter-transport: {{ $.Values.greenhouseShootGrafter }}
    metadata.greenhouse.sap/region: {{ coalesce $.Values.contextSuffix $cluster.region }}
    {{- with merge (default dict $cluster.extraLabels) (default dict $.Values.shootExtraLabels) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  purpose: {{ default $.Values.purpose $cluster.purpose }}
  cloudProfile:
    kind: CloudProfile
    name: ironcore-metal
  credentialsBindingName: metal-wi-{{ $cluster.region | default $.Values.global.region }}
  region: {{ $cluster.region | default $.Values.global.region }}
  {{- if $cluster.seedSelector }}
  seedSelector: {{- toYaml $cluster.seedSelector | nindent 4 }}
  {{- end }}
  networking:
    pods: {{ default $.Values.networking.pods $cluster.networking.pods }}
    services: {{ default $.Values.networking.services $cluster.networking.services }}
    nodes: {{ $cluster.networking.nodes }}
    type: calico
    providerConfig:
      apiVersion: calico.networking.extensions.gardener.cloud/v1alpha1
      kind: NetworkConfig
      {{- if not $.Values.networking.overlay }}
      backend: bird
      {{- end }}
      {{- if $.Values.networking.overlay }}
      vethMTU: "8930"
      {{- else }}
      vethMTU: "8950"
      {{- end }}
      ipam:
        type: host-local
        cidr: usePodCIDR
      {{- if $.Values.networking.overlay }}
      overlay:
        enabled: true
      {{- else }}
      overlay:
        enabled: false
        createPodRoutes: true
      {{- end }}
      birdExporter:
        enabled: {{ required ".Values.networking.enableBirdExporter is required" $.Values.networking.enableBirdExporter }}
  kubernetes:
    version: {{ default $.Values.kubernetes.version $cluster.version }}
    kubeAPIServer:
      featureGates:
        AnonymousAuthConfigurableEndpoints: true
      structuredAuthentication:
        configMapName: {{ printf "sci-k8s-compute-auth-%s" $cluster.region }}
      {{- if $cluster.auditing.enabled }}
      auditConfig:
        auditPolicy:
          configMapRef:
            name: {{ $cluster.auditing.configMapName | default $.Values.auditing.configMapName }}
      {{- end }}
    verticalPodAutoscaler:
      enabled: false
  {{- if $cluster.auditing.enabled }}
  extensions:
  - type: auditing
    providerConfig:
      apiVersion: auditing.extensions.gardener.cloud/v1alpha1
      kind: AuditConfiguration
      backends:
      - http:
          url: {{ $cluster.auditing.url }}
          tls:
            secretReferenceName: auditing-mtls-compute
  {{- end }}
  resources:
  - name: extraignition-compute-{{ $key }}
    resourceRef:
      apiVersion: v1
      kind: Secret
      name: extraignition-compute-{{ $key }}
  {{- if $cluster.auditing.enabled }}
  - name: auditing-mtls-compute
    resourceRef:
      apiVersion: v1
      kind: Secret
      name: {{ $cluster.auditing.secretName | default $.Values.auditing.secretName }}
  {{- end }}
  maintenance:
    autoUpdate:
      kubernetesVersion: false
      machineImageVersion: false
  provider:
    type: ironcore-metal
    infrastructureConfig:
      apiVersion: ironcore-metal.provider.extensions.gardener.cloud/v1alpha1
      kind: InfrastructureConfig
      networks:
      {{- if kindIs "slice" $cluster.networking.nodes }}
      {{- range $cluster.networking.nodes }}
      - name: nodenetwork-{{ . | replace "/" "-" | replace "." "-" }}
        cidr: {{ . }}
      {{- end }}
      {{- else if $cluster.networking.nodes }}
      - name: nodenetwork-{{ $cluster.networking.nodes | replace "/" "-" | replace "." "-" }}
        cidr: {{ $cluster.networking.nodes }}
      {{- end }}
    controlPlaneConfig:
      apiVersion: ironcore-metal.provider.extensions.gardener.cloud/v1alpha1
      kind: ControlPlaneConfig
      nodeNamePolicy: "BMCName"
      cloudControllerManager:
        networking:
          configureNodeAddresses: true
          ipamKind:
            apiGroup: ipam.cluster.x-k8s.io
            kind: IPAddress
      loadBalancerConfig:
        calicoConfig:
          IPPools:
            {{- range $cluster.networking.externalServices }}
            - cidr: {{ .cidr }}
              assignmentMode: {{ default $.Values.networking.externalServiceAssignmentMode .assignmentMode }}
            {{- end }}
          calicoBgpConfig:
            asNumber: {{ include "asNumber" $cluster.networking.asNumber }}
            bgpPeer:
            {{- range $cluster.networking.bgpPeers }}
            - asNumber: {{ include "asNumber" (default $cluster.networking.asNumber .asNumber) }}
              nodeSelector: {{ .nodeSelector }}
              peerIP: {{ .peerIP }}
              filters:
              - v4filter
            {{- end }}
            bgpFilter:
              - name: v4filter
                exportV4:
                  {{- /* Skip /32 and /128 host routes - these are anycast VIPs that must be advertised via BGP */}}
                  {{- range $cluster.networking.externalServices }}
                  {{- if not (or (hasSuffix "/32" .cidr) (hasSuffix "/128" .cidr)) }}
                  {{- /* Block non-pod nodes from re-exporting mesh-learned /32 LB routes to eBGP TOR peers */}}
                  {{- if $.Values.networking.overlay }}
                  - cidr: {{ .cidr }}
                    matchOperator: In
                    action: Reject
                    source: RemotePeers
                  {{- end }}
                  - cidr: {{ .cidr }}
                    matchOperator: Equal
                    action: Reject
                  {{- end }}
                  {{- end }}
                  {{- if $.Values.networking.overlay }}
                  - cidr: {{ default $.Values.networking.pods $cluster.networking.pods }}
                    matchOperator: In
                    action: Reject
                  {{- end }}
            {{- if $.Values.networking.overlay }}
            nodeToNodeMeshEnabled: true
            {{- else }}
            nodeToNodeMeshEnabled: false
            {{- end }}
            serviceLoadBalancerIPs:
            {{- range $cluster.networking.externalServices }}
            - {{ .cidr }}
            {{- end }}
    workers:
    {{- range $workerkey, $worker := $cluster.workers }}
      {{- $workerChannel := coalesce $worker.channel $cluster.channel $.Values.workerDefaults.channel }}
      {{- $updateStrategy := coalesce $worker.updateStrategy $cluster.updateStrategy $.Values.defaultUpdateStrategy }}
      {{- $imageVersion:= "unset" }}
      {{- if eq $workerChannel "preRelease" }}
      {{- $imageVersion = coalesce $worker.preReleaseImageVersion $cluster.preReleaseImageVersion $.Values.preReleaseImageVersion }}
      {{- else if eq $workerChannel "release" }}
      {{- $imageVersion = coalesce $worker.imageVersion $cluster.imageVersion $.Values.imageVersion }}
      {{- else }}
      {{- fail (printf "worker %s has invalid channel '%s': must be either 'release' or 'preRelease'" $workerkey $workerChannel) }}
      {{- end }}
      - name: {{ $workerkey }}
        machine:
          architecture: amd64
          image:
            name: gardenlinux
            version: {{ $imageVersion | quote }}
          type: baremetal
        minimum: {{ $worker.poolSize }}
        maximum: {{ $worker.poolSize }}
        {{- if not (has $updateStrategy (list "ManualInPlaceUpdate" "AutoInPlaceUpdate")) }}
        maxSurge: {{ $worker.maxSurge | default 0 }}
        maxUnavailable: {{ default 1 $worker.maxUnavailable }}
        {{- end }}
        updateStrategy: {{ $updateStrategy }}
        zones:
        {{- toYaml $worker.zones | nindent 8 }}
        machineControllerManager:
          machineCreationTimeout: {{ coalesce $worker.machineCreationTimeout $cluster.machineCreationTimeout $.Values.workerDefaults.machineControllerManager.machineCreationTimeout }}
          machineHealthTimeout: {{ coalesce $worker.machineHealthTimeout $cluster.machineHealthTimeout $.Values.workerDefaults.machineControllerManager.machineHealthTimeout }}
          machineDrainTimeout: {{ coalesce $worker.machineDrainTimeout $cluster.machineDrainTimeout $.Values.workerDefaults.machineControllerManager.machineDrainTimeout }}
        {{- if has $updateStrategy (list "ManualInPlaceUpdate" "AutoInPlaceUpdate") }}
          inPlaceUpdateTimeout: {{coalesce $worker.inPlaceUpdateTimeout $cluster.inPlaceUpdateTimeout $.Values.workerDefaults.machineControllerManager.inPlaceUpdateTimeout }}
        {{- end }}
        sysctls:
          vm.hugetlb_shm_group: "64055"
          vm.unprivileged_userfaultfd: "1"
          vm.overcommit_memory: "2"
          {{- if $worker.sysctls }}
          {{- toYaml $worker.sysctls | nindent 10 }}
          {{- end }}
        labels:
          cloud.sap/channel: {{ $workerChannel }}
          cloud.sap/imageVersion: {{ $imageVersion | quote }}
          {{- if $worker.labels }}
          {{- toYaml $worker.labels | nindent 10 }}
          {{- end }}
        {{- if $worker.annotations }}
        annotations:
          {{- toYaml $worker.annotations | nindent 10 }}
        {{- end }}
        providerConfig:
          apiVersion: ironcore-metal.provider.extensions.gardener.cloud/v1alpha1
          kind: WorkerConfig
          extraServerLabels:
            kubernetes.metal.cloud.sap/bb: {{ required "worker.bb is required" $worker.bb }}
            kubernetes.metal.cloud.sap/cluster: {{ $key }}
            {{- with $worker.extraServerLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          metadata:
            interfaces: {{ coalesce $worker.interfaces $cluster.networking.interfaces $.Values.networking.interfaces }}
            vlan: {{ default $.Values.networking.vlan $cluster.networking.vlan | quote }}
            region: {{ $cluster.region | default $.Values.global.region }}
          ipamConfig:
          - metadataKey: bond
            ipamRef:
              apiGroup: ipam.cluster.x-k8s.io
              kind: GlobalInClusterIPPool
              name: compute-{{ $key }}
          extraIgnition:
            override: false
            secretRef: extraignition-compute-{{ $key }}
            raw: |
            {{- include "cc-shoots-compute.kvmIgnition" (dict "root" $ "cluster" $cluster "worker" $worker "workerChannel" $workerChannel) | nindent 14 }}
{{- end }}
{{- end }}
{{- end }}
