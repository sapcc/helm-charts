{{- range $key, $cluster := .Values.kvmShoots }}
{{- range $workerkey, $worker := $cluster.workers }}
{{- $workerIgnition := coalesce ($worker.extraIgnition).commonFiles ($cluster.extraIgnition).commonFiles ($.Values.extraIgnition).commonFiles | required (printf "extraIgnition.commonFiles is required for shoot %s worker %s (set at worker, shoot, or global level)" $key $workerkey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: xtra-ign-{{ $key }}-{{ $workerkey }}
type: Opaque
stringData:
  ignition: |
    passwd:
      users:
        - name: "{{ printf "{{ resolve `vault+kvv2:///secrets/%s/cc-gardener/nodes/compute-user/username` }}" $cluster.region }}"
          password_hash: "{{ printf "{{ resolve `vault+kvv2:///secrets/%s/cc-gardener/nodes/compute-user/passwordHash` }}" $cluster.region }}"
          groups: [ "wheel" ]
          {{- if contains "qa" $.Values.global.region }}
          ssh_authorized_keys:
            - "{{ printf "{{ resolve `vault+kvv2:///secrets/%s/kvm-ha/hatest-ssh-user/public` }}" $cluster.region }}"
          {{- end }}
    storage:
      files:
{{ $workerIgnition | indent 8 }}
{{- end }}
{{- end }}
