defaultUpdateStrategy: AutoRollingUpdate
greenhouseShootGrafter: greenhouse-prod-sci
purpose: production
authenticationConfig: {}
kvmShoot: false
auditing:
  configMapName: audit-policy-cp-compute
  secretName: auditing-mtls-compute
networking:
  enableBirdExporter: true
  overlay: true
  externalServiceAssignmentMode: Automatic
# Ignition files use the first non-empty configuration in this order:
# kvmShoots.<shoot>.workers.<worker>.extraIgnition.commonFiles,
# kvmShoots.<shoot>.extraIgnition.commonFiles, extraIgnition.commonFiles.
# Each worker pool gets its own ignition Secret, including the compute user.
workerDefaults:
  channel: release
  feature: stable
  machineControllerManager:
    machineCreationTimeout: 1h20m0s
    machineHealthTimeout: 1h0m0s
    machineDrainTimeout: 240h0m0s
    inPlaceUpdateTimeout: 1h20m0s
coredump:
  enabled: false
