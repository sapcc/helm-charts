kind: Deployment
apiVersion: apps/v1

metadata:
  name: {{ .Release.Name }}

spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  revisionHistoryLimit: 3
  replicas: {{ required ".Values.replicas missing" .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: external-plugin
          image: {{ include "external-plugin.image" . }}
          imagePullPolicy: {{ required ".Values.image.pullPolicy missing" .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64M"
            limits:
              cpu: "100m"
              memory: "128M"
          livenessProbe:
            httpGet:
              path: /index.js
              port: 80
            timeoutSeconds: 10
            periodSeconds: 60
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /index.js
              port: 80
            timeoutSeconds: 5
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 30"]
