apiVersion: v2
appVersion: "1.0"
description: Kubernetes admin k3s cluster monitoring.
name: kube-monitoring-admin-k3s
version: 4.8.12
home: https://github.com/sapcc/helm-charts/tree/master/system/kube-monitoring-admin-k3s
dependencies:
  - condition: absent-metrics-operator.enabled
    name: absent-metrics-operator
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: "^1"
  - condition: kube-state-metrics.enabled
    name: kube-state-metrics
    repository: https://prometheus-community.github.io/helm-charts
    version: 8.4.0
  - condition: kube-state-metrics-exporter.enabled
    name: kube-state-metrics-exporter
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: 0.2.1
  - condition: ntp-exporter.enabled
    name: ntp-exporter
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: "^2.5"
  - condition: oomkill-exporter.enabled
    name: oomkill-exporter
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: "^1.x"
  - condition: ping-exporter.enabled
    name: ping-exporter
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: 0.1.2
  - condition: prometheus-crds.enabled
    name: prometheus-crds
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: 11.0.0
  - condition: prometheus-kubernetes-rules.enabled
    name: prometheus-kubernetes-rules
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: "^1.10"
  - condition: prometheus-node-exporter.enabled
    name: prometheus-node-exporter
    repository: https://prometheus-community.github.io/helm-charts
    version: 4.56.1
  - condition: kubernikus-monitoring.enabled
    name: kubernikus-monitoring
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: 1.2.1
  - condition: blackbox-exporter.enabled
    name: blackbox-exporter
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: "^2.3"
  - name: owner-info
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: "^1"
  - name: falco
    repository: https://falcosecurity.github.io/charts
    version: 4.21.3
    condition: falco.enabled
  - condition: kubelet-stats-metrics.enabled
    name: kubelet-stats-metrics
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: 0.1.5
  - condition: x509CertificateExporter.enabled
    name: x509-certificate-exporter
    repository: https://charts.enix.io
    version: 4.2.0
