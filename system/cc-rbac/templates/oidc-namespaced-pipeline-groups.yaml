{{- range $npg := .Values.oidcIAS.namespacedPipelineGroups | default list }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $npg.namespace }}-cc:oidc-pipeline-admin
  namespace: {{ required "For each namespacedPipelineGroup a namespace must be given" $npg.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cc:admin
subjects:
  {{- range $npg.groups }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ . }}
  {{- end }}
{{- end }}
