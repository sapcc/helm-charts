{{/*
  Etcd encryption Secret seeding.
  On first deploy (Secret does not exist yet): generates a random encryption key
  and creates a Secret with the EncryptionConfiguration YAML. On subsequent deploys:
  lookup finds the existing Secret and skips creation, so the CronJob-managed
  key is never overwritten.

  Only activates when the cluster sets etcdEncryption: true explicitly.
  Clusters using the legacy additionalConfig.secrets path (etcd.useEncryption)
  are not affected.

  Values per cluster:
    etcdEncryption: true/false — enables the new Secret-based path
    encryptionProvider: provider name (default: aescbc)
    encryptionResources: list of resources to encrypt (default: [secrets, configmaps])
    encryptionSecretName: Secret name (default: etcd-encryption-config)
*/}}
{{- range $cluster := .Values.clusters }}
{{- if $cluster.etcdEncryption }}
{{- $secretName := default "etcd-encryption-config" $cluster.encryptionSecretName }}
{{- $existing := lookup "v1" "Secret" $cluster.namespace $secretName }}
{{- if not $existing }}
{{- $keyName := printf "key-%s-%s" (now | date "20060102") (randAlphaNum 5 | lower) }}
{{- $keySecret := randBytes 32 | b64enc }}
{{- $encResources := default (list "secrets" "configmaps") $cluster.encryptionResources }}
{{- $encProvider := default "aescbc" $cluster.encryptionProvider }}
{{- $configContent := include "cc-runtime-cluster.encryptionConfig" (dict "keyName" $keyName "keySecret" $keySecret "resources" $encResources "provider" $encProvider) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $cluster.namespace }}
  labels:
    app.kubernetes.io/managed-by: cc-runtime-cluster
    app.kubernetes.io/component: etcd-encryption
  annotations:
    etcd.encryption/phase: "completed"
    etcd.encryption/key-generated-at: {{ now | date "2006-01-02T15:04:05Z" | quote }}
type: Opaque
stringData:
  config: |
{{ $configContent | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
