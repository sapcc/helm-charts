{{- range $cluster := .Values.clusters }}
{{- if $cluster.etcdEncryption }}
{{- $secretName := default "etcd-encryption-config" $cluster.encryptionSecretName }}
{{- $existing := lookup "v1" "Secret" $cluster.namespace $secretName }}
{{- if not $existing }}
{{/*
  First deploy only — seed initial encryption key.
  resource-policy: keep prevents deletion on subsequent deploys.
  The rotation CronJob owns the Secret after this point.
*/}}
{{- $keyName := printf "key-%s-%s" (now | date "20060102") (randAlphaNum 5 | lower) }}
{{- $keySecret := randBytes 32 | b64enc }}
{{- $encResources := default (list "secrets" "configmaps" "bmcsecrets.metal.ironcore.dev") $cluster.encryptionResources }}
{{- $configContent := include "cc-runtime-cluster.encryptionConfig" (dict "keyName" $keyName "keySecret" $keySecret "resources" $encResources) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $cluster.namespace }}
  labels:
    app.kubernetes.io/managed-by: cc-runtime-cluster
    app.kubernetes.io/component: etcd-encryption
  annotations:
    helm.sh/resource-policy: keep
    etcd.encryption/phase: "completed"
    etcd.encryption/key-generated-at: {{ now | date "2006-01-02T15:04:05Z" | quote }}
type: Opaque
stringData:
  config: |
{{ $configContent | indent 4 }}
{{/*
  Seed config-previous present-but-empty so the KCP files[].contentFrom.secret
  reference for enc_previous.yaml resolves on the first deploy. Without this key
  CAPI leaves the KubeadmConfig stuck DataSecretAvailable=False /
  DataSecretNotAvailable. The rotation CronJob overwrites it with the
  retired key during the cleanup phase.
*/}}
  config-previous: ""
{{- end }}
{{- end }}
{{- end }}
