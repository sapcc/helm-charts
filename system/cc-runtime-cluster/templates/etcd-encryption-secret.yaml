{{- range $cluster := .Values.clusters }}
{{- if $cluster.etcdEncryption }}
{{- $secretName := default "etcd-encryption-config" $cluster.encryptionSecretName }}
{{- $existing := lookup "v1" "Secret" $cluster.namespace $secretName }}
{{- if $existing }}
{{/*
  Secret exists (created by a previous deploy or managed by the rotation CronJob).
  Re-render it so helm continues to track the resource. The data and phase
  annotations come from the live object — helm will see no diff unless the
  CronJob changed the Secret between deploys (in which case helm converges
  to the CronJob's state, which is correct).
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $cluster.namespace }}
  labels:
    app.kubernetes.io/managed-by: cc-runtime-cluster
    app.kubernetes.io/component: etcd-encryption
  annotations:
    helm.sh/resource-policy: keep
    {{- range $k, $v := $existing.metadata.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
type: Opaque
data:
  config: {{ index $existing.data "config" }}
{{- if index $existing.data "key-history" }}
  key-history: {{ index $existing.data "key-history" }}
{{- end }}
{{- if index $existing.data "config-previous" }}
  config-previous: {{ index $existing.data "config-previous" }}
{{- end }}
{{- else }}
{{/* First deploy: seed initial key */}}
{{- $keyName := printf "key-%s-%s" (now | date "20060102") (randAlphaNum 5 | lower) }}
{{- $keySecret := randBytes 32 | b64enc }}
{{- $encResources := default (list "secrets" "configmaps" "bmcsecrets.metal.ironcore.dev") $cluster.encryptionResources }}
{{- $configContent := include "cc-runtime-cluster.encryptionConfig" (dict "keyName" $keyName "keySecret" $keySecret "resources" $encResources) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $cluster.namespace }}
  labels:
    app.kubernetes.io/managed-by: cc-runtime-cluster
    app.kubernetes.io/component: etcd-encryption
  annotations:
    helm.sh/resource-policy: keep
    etcd.encryption/phase: "completed"
    etcd.encryption/key-generated-at: {{ now | date "2006-01-02T15:04:05Z" | quote }}
type: Opaque
stringData:
  config: |
{{ $configContent | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
