global:
  region:

replicaCount: 3

mutatingWebhook:
  enabled: true

staging:
  enabled: false
  namespace: sci-label-injector-staging

# Namespaces where the mutating webhook should NOT run in production mode
excludedNamespaces:
  - kube-node-lease
  - kube-system
  - kube-public

sci:
  # Owned domain the sci label keys derive from (SCI_DOMAIN). The Kubernetes
  # label prefix is "<domain>/" and the OCI label prefix is its reverse-DNS.
  domain: cloud.sap
  # Comma-separated registry hosts the injector may read image config from
  # (SCI_ALLOWED_REGISTRIES, an SSRF allowlist). Empty allows any host; set it
  # in production. When empty the ConfigMap defaults to the Keppel hosts that
  # serve application images (global plus the regional host from global.region).
  allowedRegistries: ""

image:
  repository: keppel.global.cloud.sap/ccloud/sci-label-injector
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

nameOverride: ""
fullnameOverride: ""

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 443


resources:
  limits:
    cpu: 800m
    memory: 8000Mi
  requests:
    cpu: 400m
    memory: 4000Mi
