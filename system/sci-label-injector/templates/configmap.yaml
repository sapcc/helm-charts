apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sci-label-injector.fullname" . }}
  labels:
    {{- include "sci-label-injector.labels" . | nindent 4 }}
data:
  SCI_DOMAIN: {{ .Values.sci.domain | quote }}
  SCI_ALLOWED_REGISTRIES: {{ include "sci-label-injector.allowedRegistries" . | quote }}
