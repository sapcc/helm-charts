authenticationConfig: {}
regions: [] # List of regions to create shoots in
networking:
  pods: ""
  services: ""
  enableBirdExporter: true
  overlay: true

# cpShoots is a map keyed by landscape of per-controlplane-shoot configuration.
# Values documented here for reference; actual values are supplied
# per-landscape from downstream values files.
#
# Per-landscape overrides that this chart understands:
#
# cpShoots:
#   <landscape>:
#     # Optional. Overrides the Shoot / ManagedSeed / Seed resource name.
#     # Defaults to "cp-<landscape>". The DNS domain always uses the literal
#     # "cp-<landscape>" prefix regardless of this override.
#     name: cp-<landscape>
#     # Optional. Sets maintenance timeWindow and confineSpecUpdateRollout.
#     # One of bronze, silver, gold.
#     tier: gold
#     # Optional. Seed backup configuration. Defaults to provider "aws" with
#     # credentials secret "aws-backup-<landscape>". Set provider "openstack"
#     # for alt-region seeds (credentials secret "openstack-<altRegion>").
#     backup:
#       provider: aws
#       region: eu-central-1
#     # Optional. Alternate region for seeds that share another region's
#     # OpenStack credentials (DNS + openstack backup) and backup region.
#     altRegion: <other-landscape>
#     # Optional. Overrides Seed.spec.settings.zoneSelection on the rendered
#     # ManagedSeed. Defaults to "Prefer" (safe: never blocks scheduling).
#     # Set to "Enforce" per-landscape once all shoots on that seed have
#     # worker zones matching the seed's spec.provider.zones.
#     zoneSelection: Prefer
