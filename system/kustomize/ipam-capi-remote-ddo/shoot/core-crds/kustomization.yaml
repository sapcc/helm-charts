apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# CAPI v1.14.2, resolved to its immutable commit. Only these three are owned
# by this operand; the full CAPI directory would introduce ten extra CRDs.
resources:
  - cluster.x-k8s.io_clusters.yaml
  - ipam.cluster.x-k8s.io_ipaddresses.yaml
  - ipam.cluster.x-k8s.io_ipaddressclaims.yaml
# The apiserver-defaulted field is explicit in the existing delivered bundle.
# Restore it without copying or changing any upstream schema.
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /spec/conversion
        value:
          strategy: None
