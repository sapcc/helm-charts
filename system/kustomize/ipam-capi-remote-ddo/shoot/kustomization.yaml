apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../additions/shoot
  # Provider v1.1.1, resolved to its immutable commit (not the mutable tag).
  # Written scheme-less (no https://) ON PURPOSE: this is a git-DIRECTORY ref,
  # and krusty (kustomize) does an HTTP GET-file FIRST for any http(s):// URL,
  # falling back to git only on a non-2xx. An https:// git-dir URL would be
  # fetched as a file, so the ?ref=<sha> pin would never be consulted. The
  # scheme-less github.com/... form forces the git loader, where the SHA is
  # actually checked out. Do NOT add https:// here or the pin becomes a no-op.
  - github.com/kubernetes-sigs/cluster-api-ipam-provider-in-cluster//config/crd?ref=7933583138cf1b5b16b6a1dd82a804729f83afab
  - core-crds
  - rbac.yaml
  # Webhook manifests fetched from upstream config/webhook (same SHA pin as CRDs above).
  # The upstream directory ships manifests.yaml (MWC+VWC in service-form) and service.yaml.
  # The upstream webhook-service (Service/system/webhook-service) is deleted below via
  # $patch: delete — targeted removal in the overlay so it never reaches DDO at all.
  # DDO converts the remaining service-form clientConfigs -> url-form via rewriteWebhookURL.
  # Plain `kustomize build shoot/` shows pre-rewriteWebhookURL (service-form) webhook
  # clientConfig — that is expected; webhook_parity_test.sh simulates the DDO transform.
  - github.com/kubernetes-sigs/cluster-api-ipam-provider-in-cluster//config/webhook?ref=7933583138cf1b5b16b6a1dd82a804729f83afab
  - metrics-service.yaml
patches:
  - path: patches/conversion-globalinclusterippools.yaml
  - path: patches/conversion-globalinclusterprefixpools.yaml
  - path: patches/conversion-inclusterippools.yaml
  - path: patches/conversion-inclusterprefixpools.yaml
  # Delete the upstream webhook-service (Service) from the shoot render.
  # The upstream config/webhook dir ships this Service alongside MWC/VWC; we remove it
  # here via a targeted kustomize delete patch rather than a DDO filterKinds[Service],
  # which would be a GLOBAL kind filter and would wrongly drop the shoot metrics Service
  # and the seed admission endpoint Service too.
  - target:
      kind: Service
      name: webhook-service
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: webhook-service
        namespace: system
  # Rename upstream webhook configs to the SAP names and add the injector label.
  # JSON patch (RFC 6902) replaces the name in-place and adds the label in one step.
  - target:
      kind: MutatingWebhookConfiguration
      name: mutating-webhook-configuration
    patch: |-
      - op: replace
        path: /metadata/name
        value: ipam-capi-remote-mutating-webhook-configuration
      - op: add
        path: /metadata/labels
        value:
          dual-deployment-operator.cc.sap/webhook-injector: ipam-capi-remote
  - target:
      kind: ValidatingWebhookConfiguration
      name: validating-webhook-configuration
    patch: |-
      - op: replace
        path: /metadata/name
        value: ipam-capi-remote-validating-webhook-configuration
      - op: add
        path: /metadata/labels
        value:
          dual-deployment-operator.cc.sap/webhook-injector: ipam-capi-remote
