  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ipam-capi-remote-leader-election-role
subjects:
  - kind: ServiceAccount
    name: ipam-capi-controller-manager
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ipam-capi-remote-webhook-injector
