apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# POC Lane B: remote-source the manager Deployment from upstream config/manager.
#
# FRICTION FINDINGS (documented in patches/manager-deployment.yaml and below):
# (a) args list -> strategic-merge REPLACES (no merge key). Full args restated in patch.
# (b) initContainers -> additive merge by name. Clean.
# (c) Namespace "system" + Deployment namespace "system" arrive from upstream.
#     The Namespace + upstream manager-config ConfigMap are filtered in POC test (simulate DDO).
#     Deployment name is renamed controller-manager -> ipam-capi-controller-manager via JSON patch.
#     Deployment namespace "system" is left as-is (DDO applies namespace at deploy time).
# (d) upstream configMapGenerator produces ConfigMap "manager-config" alongside our
#     "ipam-capi-manager-config". Different names -> no collision. Both appear in render;
#     POC test filters manager-config + Namespace (simulated DDO filterKinds).
#
# See shoot/kustomization.yaml lines 6-12 for the scheme-less git-dir rationale.
resources:
  - ../base
  # Upstream config/manager: Namespace + ConfigMap(manager-config) + Deployment(controller-manager)
  - upstream-manager
  # SAP additions (all except deployment.yaml, which is sourced from upstream above + patched)
  - webhook-service.yaml
  - webhook-injector-rbac.yaml
  - webhook-injector-metrics-service.yaml
  - webhook-injector-servicemonitor.yaml
  - remote-kubeconfig-secret.yaml
  - remote-kubeconfig-configmap.yaml
  - networkpolicies.yaml
  - manager-config.yaml
commonAnnotations:
  dual-deployment-operator.cc.sap/origin: additions
images:
  - name: registry.k8s.io/capi-ipam-ic/cluster-api-ipam-in-cluster-controller
    newName: keppel.global.cloud.sap/ccloud-gcr-mirror/k8s-staging-capi-ipam-ic/cluster-api-ipam-in-cluster-controller
    newTag: v1.1.1
  - name: ghcr.io/sap-cloud-infrastructure/webhook-injector
    newName: keppel.global.cloud.sap/i-cant-believe-its-not-cloud-infrastructure-dev/webhook-injector
    newTag: sha-f85df8e3d55165e3b6e1117f6b120624268d0976
  # Upstream uses "controller:latest" image placeholder; rewrite to the keppel mirror.
  - name: controller
    newName: keppel.global.cloud.sap/ccloud-gcr-mirror/k8s-staging-capi-ipam-ic/cluster-api-ipam-in-cluster-controller
    newTag: v1.1.1
patches:
  # 1. Rename Deployment: controller-manager -> ipam-capi-controller-manager (JSON patch)
  - target:
      kind: Deployment
      name: controller-manager
      namespace: system
    patch: |-
      - op: replace
        path: /metadata/name
        value: ipam-capi-controller-manager
      - op: remove
        path: /metadata/namespace
  # 2. SAP overlay: add labels, update spec, add initContainer, env, volumes, etc.
  #    Targets the renamed deployment (after patch 1 above).
  - path: patches/manager-deployment.yaml
