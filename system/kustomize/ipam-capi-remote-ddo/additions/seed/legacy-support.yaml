# Preserved from Helm chart 1.2.37 at 97d52c25ae067c00fd5f5b3e7a66771fdcbc10db.
# Namespace is supplied by DDO; peers and ports are intentionally unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ipam-capi-ingress-from-kube-apiserver
spec:
  ingress:
  - ports:
    - port: 9443
      protocol: TCP
    from:
    - podSelector:
        matchLabels:
          app: kubernetes
          role: apiserver
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ipam-capi-remote
      app.kubernetes.io/name: ipam-capi-remote
      control-plane: controller-manager
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-apiserver-egress-to-ipam-capi
spec:
  egress:
  - ports:
    - port: 9443
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: ipam-capi-remote
          app.kubernetes.io/name: ipam-capi-remote
          control-plane: controller-manager
  podSelector:
    matchLabels:
      app: kubernetes
      role: apiserver
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ipam-capi-ingress-from-kube-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ipam-capi-remote
      app.kubernetes.io/name: ipam-capi-remote
      control-plane: controller-manager
  ingress:
  - ports:
    - protocol: TCP
      port: 8082
    from:
    - namespaceSelector:
        matchLabels:
          name: kube-monitoring
  policyTypes:
  - Ingress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipam-capi-manager-config
  labels:
    helm.sh/chart: ipam-capi-remote-1.2.37
    app.kubernetes.io/name: ipam-capi-remote
    app.kubernetes.io/instance: ipam-capi-remote
    app.kubernetes.io/version: 0.1.0
data:
  controller_manager_config.yaml: |-
    apiVersion: controller-runtime.sigs.k8s.io/v1alpha1
    kind: ControllerManagerConfig
    health:
      healthProbeBindAddress: :8081
    metrics:
      bindAddress: 127.0.0.1:8080
    webhook:
      port: 9443
    leaderElection:
      leaderElect: true
      resourceName: 7bb7acb4.ipam.cluster.x-k8s.io
