apiVersion: v1
kind: Service
metadata:
  name: ipam-capi-webhook-injector-metrics
  labels:
    app.kubernetes.io/name: ipam-capi-remote
    app.kubernetes.io/instance: ipam-capi-remote
    app.kubernetes.io/component: webhook-injector-metrics
spec:
  ports:
  - name: metrics
    port: 8082
    targetPort: metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: ipam-capi-remote
    app.kubernetes.io/instance: ipam-capi-remote
    control-plane: controller-manager
