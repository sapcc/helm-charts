apiVersion: metal.ironcore.dev/v1alpha1
kind: ServerReadinessRule
metadata:
  name: mmo-initial-setup
spec:
  serverSelector: {}
  conditions:
    - type: metal.cloud.sap/step5-bios-settings-done
      requiredStatus: "True"
  enforcementMode: BootstrapOnly
  taint:
    key: metal.ironcore.dev/Uninitialized
    effect: NoBind
