{{- if .Values.discoveryRegistry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-discovery-registry-service
  labels:
  {{- include "chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.discoveryRegistry.service.type }}
  selector:
    control-plane: controller-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: mmo-core
  ports:
  {{- .Values.discoveryRegistry.service.ports | toYaml | nindent 2 }}
{{- end }}
