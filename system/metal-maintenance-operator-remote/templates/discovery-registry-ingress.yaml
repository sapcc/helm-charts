{{- if .Values.discoveryRegistry.enabled }}
{{- $domain := printf "metal-maintenance-operator-remote.%s.%s.%s" $.Values.global.clusterType $.Values.global.region $.Values.global.tld }}
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: {{ include "chart.fullname" . }}-discovery-registry-ingress
  annotations:
    kubernetes.io/tls-acme: "true"
    disco: "true"
spec:
  ingressClassName: nginx
  tls:
  - secretName: tls-metal-maintenance-operator
    hosts: [ {{ $domain }} ]
  rules:
  - host: {{ $domain }}
    http:
      paths:
      - path: /register
        pathType: Prefix
        backend:
          service:
            name: {{ include "chart.fullname" . }}-discovery-registry-service
            port:
              number: {{ index (.Values.discoveryRegistry.service.ports | first) "port" }}
{{- end }}
