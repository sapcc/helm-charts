# Input values for make build-metal-maintenance-operator-remote.
# Renders CRDs + RBAC only; Deployment and all other resources are suppressed.
crd:
  enable: true
  keep: false
manager:
  enabled: false
rbac:
  namespaced: false
  helpers:
    enable: false
serviceAccount:
  enable: true
metrics:
  enable: false
prometheus:
  enable: false
certManager:
  enable: false
ingress:
  enable: false
extraObjects: []
serverReadinessNamespaces: []
