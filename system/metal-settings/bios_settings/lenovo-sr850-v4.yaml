# BIOS Settings Lenovo ThinkSystem SR850 V4
# XCC3 uses WorkloadProfile to apply performance tuning as a single setting.
# Ref: https://support.lenovo.com/us/en/solutions/ht115952
#
# Values sourced from: baremetal-config/lenovo/thinksystem-sr850-v4/bios/default-settings.yml
settingsFlow:
- name: defaultsettings
  priority: 20
  settings:
    SystemSettings_WorkloadProfile: "Virtualization_MaxPerformance"
