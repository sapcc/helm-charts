# Test a targeted rollout - deploy only Dell PowerEdge R7615, sci-k8s-controlplane only
# This tests combining parameters.<vendor/model>.enabled with a rollouts.types override
crdVersionControl:
  features:
    biosSettings:
      enabled: true
    biosVersions:
      enabled: true
    bmcVersions:
      enabled: true
    bmcSettings:
      enabled: true

# Real, per-cluster override: restrict to sci-k8s-controlplane only (see values.yaml's "Machine
# inventory" comment - a cluster override file defines its own top-level rollouts.types to deploy
# to a specific subset of the chart's known cluster types instead of the full default catalog).
# Workflow is already defined in the chart's own values.yaml, so it's referenced here by name
# (tpl-evaluated against the fully-merged .Values tree at render time) 
rollouts:
  types:
    sci-k8s-controlplane:
      - workflow: "{{ .Values.workflow | toYaml }}"

parameters:
  hpe:
    enabled: false
  lenovo:
    enabled: false
  dell:
    poweredge-r640:
      enabled: false
    poweredge-r660:
      enabled: false
    poweredge-r6715:
      enabled: false
    poweredge-r740:
      enabled: false
    poweredge-r740xd:
      enabled: false
    poweredge-r760:
      enabled: false
    poweredge-r770:
      enabled: false
    poweredge-r7715:
      enabled: false
    poweredge-r840:
      enabled: false
    poweredge-r860:
      enabled: false
    poweredge-xe9680:
      enabled: false
