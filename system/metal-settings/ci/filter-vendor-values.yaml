# Test scoping to a single vendor - deploy only Dell resources
# This tests parameters.<vendor>.enabled used to disable the other vendors
CRDVersionControl:
  features:
    biosSettings:
      enabled: true
    biosVersions:
      enabled: true
    bmcVersions:
      enabled: true
    bmcSettings:
      enabled: true

parameters:
  hpe:
    enabled: false
  lenovo:
    enabled: false
