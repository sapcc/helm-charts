suite: bios_versions
templates:
  - bios_versions.yaml
tests:
  #############################################################################
  # BASELINE TESTS - Verify current behavior (deploy everything)
  #############################################################################

  - it: should render BIOSVersionSet resources by default
    asserts:
      - hasDocuments:
          count: 26
      - isKind:
          of: BIOSVersionSet

  - it: should render Dell resources
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true

  - it: should render HPE resources
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl560-gen11
          any: true

  - it: should render Lenovo resources
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: lenovo-thinksystem-sr850p
          any: true

  - it: should set correct serverSelector labels
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.serverSelector.matchLabels["kubernetes.metal.cloud.sap/type"]
          value: poweredge-r7615

  # These tests pin parameters.dell.poweredge-r7615.bios.versions.defaultVersion.imagePath
  # to a synthetic value via `set`, so they only assert the URI composition logic
  # (scheme + host/region/tld + imagePath) and stay stable if the real
  # firmware version/path in values.yaml changes.
  - it: should build image URI from firmwareRepo.host + global.region + global.tld + imagePath
    set:
      parameters.dell.poweredge-r7615.bios.versions.defaultVersion.imagePath: /test-fw.EXE
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.biosVersionTemplate.image.URI
          value: https://repo.eu-de-1.cloud.sap/test-fw.EXE

  - it: should build image URI using overridden global.region
    set:
      global.region: qa-de-1
      parameters.dell.poweredge-r7615.bios.versions.defaultVersion.imagePath: /test-fw.EXE
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.biosVersionTemplate.image.URI
          value: https://repo.qa-de-1.cloud.sap/test-fw.EXE

  - it: should use firmwareRepo.hostOverride instead of host+region+tld composition when set
    set:
      firmwareRepo.hostOverride: custom-repo.example.com
      parameters.dell.poweredge-r7615.bios.versions.defaultVersion.imagePath: /test-fw.EXE
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.biosVersionTemplate.image.URI
          value: https://custom-repo.example.com/test-fw.EXE

  - it: should build image URI using overridden firmwareRepo.scheme
    set:
      firmwareRepo.scheme: http
      parameters.dell.poweredge-r7615.bios.versions.defaultVersion.imagePath: /test-fw.EXE
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.biosVersionTemplate.image.URI
          value: http://repo.eu-de-1.cloud.sap/test-fw.EXE

  - it: should use imageURI directly when set (legacy fallback)
    set:
      parameters.dell.poweredge-r7615.bios.versions.defaultVersion.imageURI: http://repo.eu-de-1.cloud.sap/firmware/bios-legacy.exe
      parameters.dell.poweredge-r7615.bios.versions.defaultVersion.imagePath: /test-fw.EXE
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.biosVersionTemplate.image.URI
          value: http://repo.eu-de-1.cloud.sap/firmware/bios-legacy.exe

  - it: should set serverMaintenancePolicy to OwnerApproval
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.biosVersionTemplate.serverMaintenancePolicy
          value: OwnerApproval

  #############################################################################
  # ENABLED TESTS
  #############################################################################

  # UC1: Disable a vendor
  - it: should skip a vendor when parameters.<vendor>.enabled is false
    set:
      parameters.hpe.enabled: false
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: lenovo-thinksystem-sr850p
          any: true
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl560-gen11
          any: true

  # UC2: Disable a specific model
  - it: should skip a model when parameters.<vendor>.<model>.enabled is false
    set:
      parameters.dell.poweredge-r7615.enabled: false
    asserts:
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660
          any: true

  # UC3: Combination of vendor/model disables
  - it: should combine vendor and model disables down to a single resource
    set:
      parameters.hpe.enabled: false
      parameters.lenovo.enabled: false
      parameters.dell.poweredge-r640.enabled: false
      parameters.dell.poweredge-r660.enabled: false
      parameters.dell.poweredge-r6715.enabled: false
      parameters.dell.poweredge-r740.enabled: false
      parameters.dell.poweredge-r740xd.enabled: false
      parameters.dell.poweredge-r760.enabled: false
      parameters.dell.poweredge-r770.enabled: false
      parameters.dell.poweredge-r7715.enabled: false
      parameters.dell.poweredge-r840.enabled: false
      parameters.dell.poweredge-r860.enabled: false
      parameters.dell.poweredge-xe9680.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true

  # UC4: Disable entirely
  - it: should render no resources when enabled is false
    set:
      crdVersionControl.features.biosVersions.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # UC5: Disable a domain (bios) for one model
  - it: should skip just the bios domain when parameters.<vendor>.<model>.bios.enabled is false
    set:
      parameters.dell.poweredge-r7615.bios.enabled: false
    asserts:
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660
          any: true

  # UC6: Disable a specific version variant
  - it: should skip a model when its bios.versions.defaultVersion.enabled is false
    set:
      parameters.dell.poweredge-r7615.bios.versions.defaultVersion.enabled: false
    asserts:
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true

  #############################################################################
  # DUPLICATION TESTS
  #
  # BIOSVersionSets are generated per model+version and named "<vendor>-<model>",
  # so two DIFFERENT models can only collide if one explicitly overrides
  # params.setMetadataName onto another model's name. If two such colliding
  # entries also carry different bios.version/imagePath, the template would
  # otherwise silently emit two documents with the same metadata.name. The
  # template guards against this generically by failing the render whenever a
  # name collision is detected, regardless of which models are involved.
  #############################################################################

  - it: should render exactly one BIOSVersionSet for the real proliant-dl560-gen11 clusterType split
    documentSelector:
      path: metadata.name
      value: hpe-proliant-dl560-gen11
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true

  # setMetadataName now lives EXCLUSIVELY on the Workflow step (see values.yaml's "Machine
  # inventory" comment) - there's no per-model parameters.<vendor>.<model>.rollouts.types override
  # anymore, so forcing a generic collision requires a top-level rollouts.types override. Setting
  # ANY top-level rollouts.types key replaces the WHOLE catalog (see values.yaml comment), so the
  # full 6-cluster-type catalog is replicated here with poweredge-r660 split into its own rule
  # whose bios-version step carries setMetadataName onto poweredge-r640's name, with a different
  # bios-version version/imageURI - proving the guard is generic and not hardcoded to one known
  # duplicate. Every other step/model keeps resolving normally via the unmodified *workflow/
  # *workflowSciSettings variants (identical to values.yaml's real ones).
  - it: should fail to render if ANY two entries (any vendor/model) produce a BIOSVersionSet with the same name but different versions
    set:
      rollouts.types:
        cc-kvm-compute:
          - filter: { exclude: { models: [poweredge-r660] } }
            workflow: &workflow
              bmcSettingsInitial: {order: 1, kind: BMCSettingsSet, settingsKey: bmc.settings.initialSettings, enabled: false}
              bmcVersion: {order: 2, kind: BMCVersionSet, versionKey: bmc.versions.defaultVersion}
              biosVersion: {order: 3, kind: BIOSVersionSet, versionKey: bios.versions.defaultVersion}
              bmcSettings: {order: 4, kind: BMCSettingsSet, versionKey: bmc.versions.defaultVersion, settingsKey: bmc.settings.defaultSettings}
              biosSettings: {order: 5, kind: BIOSSettingsSet, versionKey: bios.versions.defaultVersion, settingsKey: bios.settings.defaultSettings}
              firmware: {order: 6, kind: FirmwareUpdateSet, paramsKey: firmware.params.defaultVersion}
          - filter: { include: { models: [poweredge-r660] } }
            workflow: &WorkflowR660Collision
              bmcSettingsInitial: {order: 1, kind: BMCSettingsSet, settingsKey: bmc.settings.initialSettings, enabled: false}
              bmcVersion: {order: 2, kind: BMCVersionSet, versionKey: bmc.versions.defaultVersion}
              biosVersion: {order: 3, kind: BIOSVersionSet, versionKey: bios.versions.defaultVersion, setMetadataName: dell-poweredge-r640}
              bmcSettings: {order: 4, kind: BMCSettingsSet, versionKey: bmc.versions.defaultVersion, settingsKey: bmc.settings.defaultSettings}
              biosSettings: {order: 5, kind: BIOSSettingsSet, versionKey: bios.versions.defaultVersion, settingsKey: bios.settings.defaultSettings}
              firmware: {order: 6, kind: FirmwareUpdateSet, paramsKey: firmware.params.defaultVersion}
        sci-k8s-controlplane: &perClusterRules
          - filter: { exclude: { models: [proliant-dl560-gen11, poweredge-r660] } }
            workflow: *workflow
          - filter: { include: { models: [proliant-dl560-gen11] } }
            workflow:
              bmcSettingsInitial: {order: 1, kind: BMCSettingsSet, settingsKey: bmc.settings.initialSettings, enabled: "{{ .Values.crdVersionControl.features.readinessGates.enabled }}"}
              bmcVersion: {order: 2, kind: BMCVersionSet, versionKey: bmc.versions.defaultVersion}
              biosVersion: {order: 3, kind: BIOSVersionSet, versionKey: bios.versions.defaultVersion}
              bmcSettings: {order: 4, kind: BMCSettingsSet, versionKey: bmc.versions.defaultVersion, settingsKey: bmc.settings.defaultSettings}
              biosSettings: {order: 5, kind: BIOSSettingsSet, versionKey: bios.versions.defaultVersion, settingsKey: bios.settings.sciSettings}
              firmware: {order: 6, kind: FirmwareUpdateSet, paramsKey: firmware.params.defaultVersion}
          - filter: { include: { models: [poweredge-r660] } }
            workflow: *WorkflowR660Collision
        sci-k8s-management: *perClusterRules
        sci-k8s-runtime: *perClusterRules
        sci-k8s-storage: *perClusterRules
        cc-ironcore: *perClusterRules
      parameters.dell.poweredge-r660.bios.versions.defaultVersion.version: "9.9.9-test"
      parameters.dell.poweredge-r660.bios.versions.defaultVersion.imageURI: "https://example.invalid/test.EXE"
    asserts:
      - failedTemplate:
          errorPattern: "duplicate BIOSVersionSet name"

  - it: should not fail when a colliding entry's bios-version step is removed (duplication resolved)
    set:
      rollouts.types:
        cc-kvm-compute:
          - filter: { exclude: { models: [poweredge-r660] } }
            workflow: &Workflow2
              bmcSettingsInitial: {order: 1, kind: BMCSettingsSet, settingsKey: bmc.settings.initialSettings, enabled: false}
              bmcVersion: {order: 2, kind: BMCVersionSet, versionKey: bmc.versions.defaultVersion}
              biosVersion: {order: 3, kind: BIOSVersionSet, versionKey: bios.versions.defaultVersion}
              bmcSettings: {order: 4, kind: BMCSettingsSet, versionKey: bmc.versions.defaultVersion, settingsKey: bmc.settings.defaultSettings}
              biosSettings: {order: 5, kind: BIOSSettingsSet, versionKey: bios.versions.defaultVersion, settingsKey: bios.settings.defaultSettings}
              firmware: {order: 6, kind: FirmwareUpdateSet, paramsKey: firmware.params.defaultVersion}
          - filter: { include: { models: [poweredge-r660] } }
            workflow: &WorkflowR660Collision2
              bmcSettingsInitial: {order: 1, kind: BMCSettingsSet, settingsKey: bmc.settings.initialSettings, enabled: false}
              bmcVersion: {order: 2, kind: BMCVersionSet, versionKey: bmc.versions.defaultVersion}
              biosVersion: {order: 3, kind: BIOSVersionSet, versionKey: bios.versions.defaultVersion, setMetadataName: dell-poweredge-r640}
              bmcSettings: {order: 4, kind: BMCSettingsSet, versionKey: bmc.versions.defaultVersion, settingsKey: bmc.settings.defaultSettings}
              biosSettings: {order: 5, kind: BIOSSettingsSet, versionKey: bios.versions.defaultVersion, settingsKey: bios.settings.defaultSettings}
              firmware: {order: 6, kind: FirmwareUpdateSet, paramsKey: firmware.params.defaultVersion}
        sci-k8s-controlplane: &perClusterRules2
          - filter: { exclude: { models: [proliant-dl560-gen11, poweredge-r660] } }
            workflow: *Workflow2
          - filter: { include: { models: [proliant-dl560-gen11] } }
            workflow:
              bmcSettingsInitial: {order: 1, kind: BMCSettingsSet, settingsKey: bmc.settings.initialSettings, enabled: "{{ .Values.crdVersionControl.features.readinessGates.enabled }}"}
              bmcVersion: {order: 2, kind: BMCVersionSet, versionKey: bmc.versions.defaultVersion}
              biosVersion: {order: 3, kind: BIOSVersionSet, versionKey: bios.versions.defaultVersion}
              bmcSettings: {order: 4, kind: BMCSettingsSet, versionKey: bmc.versions.defaultVersion, settingsKey: bmc.settings.defaultSettings}
              biosSettings: {order: 5, kind: BIOSSettingsSet, versionKey: bios.versions.defaultVersion, settingsKey: bios.settings.sciSettings}
              firmware: {order: 6, kind: FirmwareUpdateSet, paramsKey: firmware.params.defaultVersion}
          - filter: { include: { models: [poweredge-r660] } }
            workflow: *WorkflowR660Collision2
        sci-k8s-management: *perClusterRules2
        sci-k8s-runtime: *perClusterRules2
        sci-k8s-storage: *perClusterRules2
        cc-ironcore: *perClusterRules2
      parameters.dell.poweredge-r660.bios.versions.defaultVersion.enabled: false
    asserts:
      - hasDocuments:
          count: 25

