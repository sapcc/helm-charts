suite: bios_versions
templates:
  - bios_versions.yaml
tests:
  #############################################################################
  # BASELINE TESTS - Verify current behavior (deploy everything)
  #############################################################################

  - it: should render BIOSVersionSet resources by default
    asserts:
      - hasDocuments:
          count: 26
      - isKind:
          of: BIOSVersionSet

  - it: should render Dell resources
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true

  - it: should render HPE resources
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl560-gen11
          any: true

  - it: should render Lenovo resources
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: lenovo-thinksystem-sr850p
          any: true

  - it: should set correct serverSelector labels
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.serverSelector.matchLabels["kubernetes.metal.cloud.sap/type"]
          value: poweredge-r7615

  - it: should set serverMaintenancePolicy to OwnerApproval
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r7615
    asserts:
      - equal:
          path: spec.biosVersionTemplate.serverMaintenancePolicy
          value: OwnerApproval

  #############################################################################
  # FILTERING TESTS
  #############################################################################

  # UC1: Filter by vendor
  - it: should only render Dell resources when vendors.included is set
    set:
      biosVersions.filters.vendors.included: [dell]
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl560-gen11
          any: true
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: lenovo-thinksystem-sr850p
          any: true

  # UC2: Filter by model
  - it: should only render specific model when models.included is set
    set:
      biosVersions.filters.models.included: [poweredge-r7615]
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660
          any: true

  # UC3: Combination filter
  - it: should filter by vendor and model combination
    set:
      biosVersions.filters.vendors.included: [dell]
      biosVersions.filters.models.included: [poweredge-r7615]
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true

  # UC4: Disable entirely
  - it: should render no resources when enabled is false
    set:
      biosVersions.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # UC5: Exclude model
  - it: should exclude specific model when models.excluded is set
    set:
      biosVersions.filters.vendors.included: [dell]
      biosVersions.filters.models.excluded: [poweredge-r7615]
    asserts:
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660
          any: true

  # UC6: Exclude vendor
  - it: should exclude vendor when vendors.excluded is set
    set:
      biosVersions.filters.vendors.excluded: [hpe]
    asserts:
      - containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r7615
          any: true
      - not: true
        containsDocument:
          kind: BIOSVersionSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl560-gen11
          any: true

  #############################################################################
  # DUPLICATION TESTS
  #
  # Models are sometimes split into multiple `machines.<vendor>.models.<key>`
  # entries (one per clusterType, e.g. proliant-dl560-gen11-kvm /
  # proliant-dl560-gen11-sci). VersionSets are generated per model+version and
  # ignore clusterType, so ALL entries sharing a model resolve to the exact
  # same default resource name ("<vendor>-<model>"). If any two such entries
  # (for ANY vendor/model/key - not just a specific example) also carry
  # different bios.version/imageURI, the template would otherwise silently
  # emit two documents with the same metadata.name. The template now guards
  # against this generically by failing the render whenever a name collision
  # is detected, regardless of which keys/models are involved.
  #############################################################################

  - it: should render exactly one BIOSVersionSet for the real proliant-dl560-gen11 clusterType split
    documentSelector:
      path: metadata.name
      value: hpe-proliant-dl560-gen11
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true

  - it: should fail to render if ANY two entries (any vendor/model/key) produce a BIOSVersionSet with the same name but different versions
    set:
      # Synthesize a generic collision unrelated to proliant-dl560-gen11: alias
      # an arbitrary second entry (poweredge-r660) onto an existing model
      # (poweredge-r640) with a different bios.version/imageURI. This proves
      # the guard is generic and not hardcoded to one known duplicate.
      machines.dell.models.poweredge-r660.model: poweredge-r640
      machines.dell.models.poweredge-r660.bios.version: "9.9.9-test"
      machines.dell.models.poweredge-r660.bios.imageURI: "https://example.invalid/test.EXE"
    asserts:
      - failedTemplate:
          errorPattern: "duplicate BIOSVersionSet name"

  - it: should not fail when a colliding entry's bios.imageURI is removed (duplication resolved)
    set:
      machines.dell.models.poweredge-r660.model: poweredge-r640
      machines.dell.models.poweredge-r660.bios.imageURI: null
    asserts:
      - hasDocuments:
          count: 25

