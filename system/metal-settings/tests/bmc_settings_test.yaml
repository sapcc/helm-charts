suite: bmc_settings
templates:
  - bmc_settings.yaml
tests:
  #############################################################################
  # BASELINE TESTS - Verify current behavior (deploy everything)
  #############################################################################

  - it: should render BMCSettingsSet resources when enabled
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
    asserts:
      - hasDocuments:
          count: 153
      - isKind:
          of: BMCSettingsSet

  - it: should render Dell resources
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
    asserts:
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true

  - it: should render HPE resources
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
    asserts:
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl380-gen11-sci-k8s-controlplane
          any: true

  - it: should render Lenovo resources
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
    asserts:
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: lenovo-thinksystem-sr650-sci-k8s-controlplane
          any: true

  - it: should set correct bmcSelector labels including cluster-type
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r660-sci-k8s-controlplane
    asserts:
      - equal:
          path: spec.bmcSelector.matchLabels["kubernetes.metal.cloud.sap/type"]
          value: poweredge-r660
      - equal:
          path: spec.bmcSelector.matchLabels["kubernetes.metal.cloud.sap/cluster-type"]
          value: sci-k8s-controlplane

  - it: should set serverMaintenancePolicy to OwnerApproval
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
    documentSelector:
      path: metadata.name
      value: dell-poweredge-r660-sci-k8s-controlplane
    asserts:
      - equal:
          path: spec.bmcSettingsTemplate.serverMaintenancePolicy
          value: OwnerApproval

  #############################################################################
  # ENABLED / clusterTypes TESTS
  #############################################################################

  # UC1: Disable a vendor
  - it: should skip a vendor when parameters.<vendor>.enabled is false
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
      parameters.hpe.enabled: false
    asserts:
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: lenovo-thinksystem-sr650-sci-k8s-controlplane
          any: true
      - not: true
        containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl380-gen11-sci-k8s-controlplane
          any: true

  # UC2: Disable a specific model
  - it: should skip a model when parameters.<vendor>.<model>.enabled is false
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
      parameters.dell.poweredge-r660.enabled: false
    asserts:
      - not: true
        containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r640-sci-k8s-controlplane
          any: true
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl380-gen11-sci-k8s-controlplane
          any: true

  # UC3: Narrow cluster types for the whole cluster
  - it: should only render the real cluster's clusterTypes when clusterTypes is set
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
      rollouts.Types:
        sci-k8s-controlplane:
          - workflow:
              bmc-settings:
                order: 1
                kind: BMCSettingsSet
                versionKey: bmc.versions.defaultVersion
                settingsKey: bmc.settings.defaultSettings
    asserts:
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true
      - not: true
        containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-cc-kvm-compute
          any: true
      - not: true
        containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-management
          any: true

  # UC4: Combination - disable other vendors/models and narrow clusterTypes
  - it: should combine vendor/model disable with a clusterTypes override
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
      parameters.hpe.enabled: false
      parameters.lenovo.enabled: false
      parameters.dell.poweredge-r640.enabled: false
      parameters.dell.poweredge-r6715.enabled: false
      parameters.dell.poweredge-r740.enabled: false
      parameters.dell.poweredge-r740xd.enabled: false
      parameters.dell.poweredge-r760.enabled: false
      parameters.dell.poweredge-r7615.enabled: false
      parameters.dell.poweredge-r770.enabled: false
      parameters.dell.poweredge-r7715.enabled: false
      parameters.dell.poweredge-r840.enabled: false
      parameters.dell.poweredge-r860.enabled: false
      parameters.dell.poweredge-xe9680.enabled: false
      rollouts.Types:
        sci-k8s-controlplane:
          - workflow:
              bmc-settings:
                order: 1
                kind: BMCSettingsSet
                versionKey: bmc.versions.defaultVersion
                settingsKey: bmc.settings.defaultSettings
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true

  # UC5: Disable entirely
  - it: should render no resources when enabled is false
    set:
      CRDVersionControl.features.bmcSettings.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # UC6: Disable a domain (bmc) for one model
  - it: should skip just the bmc domain when parameters.<vendor>.<model>.bmc.enabled is false
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
      parameters.dell.poweredge-r660.bmc.enabled: false
    asserts:
      - not: true
        containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r640-sci-k8s-controlplane
          any: true

  # UC7: Disable a vendor (inverse direction of UC1)
  - it: should keep other vendors when one vendor is disabled
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
      parameters.hpe.enabled: false
    asserts:
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: lenovo-thinksystem-sr650-sci-k8s-controlplane
          any: true
      - not: true
        containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: hpe-proliant-dl380-gen11-sci-k8s-controlplane
          any: true

  # UC8: rollouts.Types override narrows to the remaining types (equivalent to excluding one)
  - it: should exclude a single cluster type by omitting it from clusterTypes
    set:
      CRDVersionControl.features.bmcSettings.enabled: true
      rollouts.Types:
        sci-k8s-controlplane: &bmcSettingsOnlyWorkflow
          - workflow:
              bmc-settings:
                order: 1
                kind: BMCSettingsSet
                versionKey: bmc.versions.defaultVersion
                settingsKey: bmc.settings.defaultSettings
        sci-k8s-management: *bmcSettingsOnlyWorkflow
        sci-k8s-runtime: *bmcSettingsOnlyWorkflow
        sci-k8s-storage: *bmcSettingsOnlyWorkflow
        cc-ironcore: *bmcSettingsOnlyWorkflow
    asserts:
      - containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-sci-k8s-controlplane
          any: true
      - not: true
        containsDocument:
          kind: BMCSettingsSet
          apiVersion: metal.ironcore.dev/v1alpha1
          name: dell-poweredge-r660-cc-kvm-compute
          any: true
