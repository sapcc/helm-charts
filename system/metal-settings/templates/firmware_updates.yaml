{{- if .Values.crdVersionControl.features.firmware.enabled }}
{{- include "metal-settings.rejectLegacyMachinesKey" . }}
{{- $gatesEnabled := .Values.crdVersionControl.features.readinessGates.enabled }}
{{- if $gatesEnabled }}
{{- include "metal-settings.requireChainCapableAPI" . }}
{{- end }}
{{- $usedNames := dict }}
{{- $knownKinds := include "metal-settings.knownKinds" . | fromYamlArray }}
{{- $firmwareHost := $.Values.firmwareRepo.hostOverride | default (printf "%s.%s.%s" $.Values.firmwareRepo.host $.Values.global.region $.Values.global.tld) }}
{{- $effectiveTypes := include "metal-settings.effectiveRolloutTypes" $ | fromYaml }}
{{- $reservedVendorKeys := list "enabled" "rollouts" }}
{{- range $vendor, $vendorParams := .Values.parameters }}
{{- range $modelKey, $modelParams := $vendorParams }}
{{- if not (has $modelKey $reservedVendorKeys) }}
{{- $model := $modelKey }}
{{- range $clusterType, $_ := $effectiveTypes }}
{{- $chainsByRule := include "metal-settings.computedChain" (dict "vendor" $vendor "model" $model "clusterType" $clusterType "root" $) | fromYaml }}
{{- range $ruleIndex, $chain := $chainsByRule }}
{{- if $chain }}

{{/*
parameters.<vendor>.<model> is computed (via metal-settings.computedChain), for THIS cluster
type, into a map of stepName -> {kind, order, params}. Map iteration in Go templates is
key-sorted (not insertion order), so steps are re-sorted here by their explicit "order" field to
guarantee correct sequencing.
*/}}
{{- $orderedSteps := dict }}
{{- range $stepName, $step := $chain }}
{{- if not $step.kind }}
{{- fail (printf "metal-settings: chain step %q for parameters.%s.%s has no kind" $stepName $vendor $model) }}
{{- end }}
{{- if not $step.order }}
{{- fail (printf "metal-settings: chain step %q for parameters.%s.%s has no order" $stepName $vendor $model) }}
{{- end }}
{{- $orderKey := printf "%04d" (int $step.order) }}
{{- if hasKey $orderedSteps $orderKey }}
{{- fail (printf "metal-settings: parameters.%s.%s has two chain steps with order %d" $vendor $model (int $step.order)) }}
{{- end }}
{{- $_ := set $orderedSteps $orderKey (dict "stepName" $stepName "kind" $step.kind "enabled" $step.enabled "params" ($step.params | default dict)) }}
{{- end }}

{{- $stepIndex := 0 }}
{{- range $orderKey, $s := $orderedSteps }}
{{- $stepIndex = add $stepIndex 1 }}
{{- $stepName := $s.stepName }}
{{- $params := $s.params }}
{{- if eq $s.kind "FirmwareUpdateSet" }}
{{/*
FirmwareUpdateSet's firmwareUpdateTemplate has no generic version/image shape (unlike BIOS/BMC
VersionSet) - upstream metal-maintenance-operator currently only supports Dell's repository-based
update mechanism (see FirmwareUpdateTemplate's TODO about HPE/Lenovo image-based updates not yet
existing). A model may set Dell's repository fields (shareName/catalogFile/shareType/address/
credentialsRef/rebootNeeded/applyVersionPolicy/certificateVerification) either flat,
alongside progressDeadlineSeconds/ttlSecondsAfterFinished (auto-packed into dellRepository below -
the convenient, default way to write it), or pre-nested under an explicit params.dellRepository
object (passed through as-is, useful if a future HPE/Lenovo mechanism needs to coexist with a
differently-shaped sibling field). Adding HPE/Lenovo support upstream later needs no changes to
computedChain - just a model's own params.<vendor-specific-field>, passed through via paramsKey
exactly like dellRepository is here.
dellRepository.address/shareType follow the same shared-host composition convention as BIOS/BMC
VersionSet's imagePath->image.URI: a model only needs shareName (+ optional catalogFile) - address/
shareType default from firmwareRepo (same host used for imagePath), and either can be overridden
per-model exactly like imageURI overrides imagePath.
*/}}
{{- $dellRepoFieldNames := list "shareType" "address" "shareName" "catalogFile" "credentialsRef" "rebootNeeded" "applyVersionPolicy" "certificateVerification" }}
{{- $dellRepo := $params.dellRepository | default dict }}
{{- range $dellRepoFieldNames }}
{{- if hasKey $params . }}
{{- $_ := set $dellRepo . (index $params .) }}
{{- end }}
{{- end }}
{{- if eq (len $dellRepo) 0 }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) is a FirmwareUpdateSet step but defines no Dell repository fields (e.g. params.shareName, or a nested params.dellRepository) - this is the only firmware update mechanism metal-maintenance-operator currently supports" $stepName $vendor $model) }}
{{- end }}
{{- if include "metal-settings.stepEnabled" (dict "step" $s "root" $) }}
{{- if $gatesEnabled }}
{{- if not $params.completionConditionType }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) has no params.completionConditionType (required when crdVersionControl.features.readinessGates.enabled=true)" $stepName $vendor $model) }}
{{- end }}
{{- if and (gt $stepIndex 1) (not $params.readinessGates) }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) has no params.readinessGates (required for non-first chain steps when crdVersionControl.features.readinessGates.enabled=true)" $stepName $vendor $model) }}
{{- end }}
{{- end }}
{{- $serverFilters := $params.serverFilter | default (dict "included" (list) "excluded" (list)) }}
{{/* params.setMetadataName: see values.yaml's "Machine inventory" comment for naming/tpl rules. */}}
{{- $explicitName := "" }}
{{- if $params.setMetadataName }}
{{- $explicitName = tpl $params.setMetadataName $ }}
{{- end }}
{{- $defaultName := printf "%s-%s-%s" (lower $vendor) (lower $model) (lower $clusterType) }}
{{- if $gatesEnabled }}
{{- $defaultName = printf "%s-%s-%s-%s" (lower $vendor) (lower $model) (lower $clusterType) $stepName }}
{{- end }}
{{- $withCluster := printf "%s-%s" $explicitName (lower $clusterType) }}
{{- $resourceName := ternary $withCluster $defaultName (ne $explicitName "") }}
{{- if hasKey $usedNames $resourceName }}
{{- fail (printf "metal-settings: duplicate FirmwareUpdateSet name %q (model %q, clusterType %q). Set a unique params.setMetadataName on one of the conflicting chain steps." $resourceName $model $clusterType) }}
{{- end }}
{{- $_ := set $usedNames $resourceName true }}
{{/* firmwareUpdateTemplate content: everything in params except the chart-only control fields and the flat Dell-repo fields already packed into $dellRepo above. */}}
{{- $templateFields := omit $params "serverFilter" "setMetadataName" "completionConditionType" "readinessGates" "dellRepository" "shareType" "address" "shareName" "catalogFile" "credentialsRef" "rebootNeeded" "applyVersionPolicy" "certificateVerification" "serverMaintenancePolicy" "retryPolicy" }}
{{- if not (hasKey $dellRepo "address") }}
{{- $_ := set $dellRepo "address" $firmwareHost }}
{{- end }}
{{- if not (hasKey $dellRepo "shareType") }}
{{- $_ := set $dellRepo "shareType" (upper $.Values.firmwareRepo.scheme) }}
{{- end }}
{{- $_ := set $templateFields "dellRepository" $dellRepo }}
{{- $_ := set $templateFields "serverMaintenancePolicy" $.Values.crdVersionControl.features.firmware.serverMaintenancePolicy }}
{{- with $.Values.crdVersionControl.features.firmware.retryPolicy }}
{{- $_ := set $templateFields "retryPolicy" . }}
{{- end }}
apiVersion: {{ $.Values.crdVersionControl.apiVersions.firmwareUpdateSet }}
kind: FirmwareUpdateSet
metadata:
  name: {{ $resourceName }}
  namespace: {{ $.Values.clusterConfig.managedNamespace }}
spec:
  serverSelector:
    matchLabels:
      {{ $.Values.labelKeys.type }}: {{ $model }}
      {{ $.Values.labelKeys.clusterType }}: {{ $clusterType }}
{{- $serverMatchExpressions := include "metal-settings.serverMatchExpressions" (dict "serverFilters" $serverFilters "labelKey" $.Values.labelKeys.serverName) }}
{{- if $serverMatchExpressions }}
{{ $serverMatchExpressions | nindent 4 }}
{{- end }}
  firmwareUpdateTemplate:
{{ toYaml $templateFields | indent 4 }}
{{- if $gatesEnabled }}
{{- if $params.readinessGates }}
    readinessGates:
{{ toYaml $params.readinessGates | indent 6 }}
{{- end }}
    completionConditionType: {{ $params.completionConditionType }}
{{- end }}
---
{{- end }}
{{- else if not (has $s.kind $knownKinds) }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) has unknown kind %q (expected one of %v)" $stepName $vendor $model $s.kind $knownKinds) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
