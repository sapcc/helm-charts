{{- if .Values.biosSettings.enabled }}
{{- $gatesEnabled := .Values.CRDVersionControl.features.readinessGates.enabled }}
{{- if $gatesEnabled }}
{{- include "metal-settings.requireChainCapableAPI" . }}
{{- end }}
{{- $usedNames := dict }}
{{- range $vendor, $vendorConfig := .Values.machines }}
{{- if $vendorConfig }}

{{/* Vendor filtering */}}
{{- if include "metal-settings.shouldInclude" (dict "item" $vendor "filters" $.Values.biosSettings.filters.vendors) }}
{{- range $entryName, $entry := $vendorConfig.models }}
{{- include "metal-settings.rejectLegacyBiosBmcKeys" (dict "vendor" $vendor "entryName" $entryName "entry" $entry) }}
{{- if $entry.chain }}
{{- $model := $entry.model }}

{{/*
machines.<vendor>.models.<name>.chain is a map of stepName -> {kind, order, params}. Map
iteration in Go templates is key-sorted (not insertion order), so steps are re-sorted here by
their explicit "order" field to guarantee correct sequencing.
*/}}
{{- $orderedSteps := dict }}
{{- range $stepName, $step := $entry.chain }}
{{- if not $step.kind }}
{{- fail (printf "metal-settings: chain step %q for machines.%s.models.%s has no kind" $stepName $vendor $entryName) }}
{{- end }}
{{- if not $step.order }}
{{- fail (printf "metal-settings: chain step %q for machines.%s.models.%s has no order" $stepName $vendor $entryName) }}
{{- end }}
{{- $orderKey := printf "%04d" (int $step.order) }}
{{- if hasKey $orderedSteps $orderKey }}
{{- fail (printf "metal-settings: machines.%s.models.%s has two chain steps with order %d" $vendor $entryName (int $step.order)) }}
{{- end }}
{{- $_ := set $orderedSteps $orderKey (dict "stepName" $stepName "kind" $step.kind "params" ($step.params | default dict)) }}
{{- end }}

{{- $stepIndex := 0 }}
{{- range $orderKey, $s := $orderedSteps }}
{{- $stepIndex = add $stepIndex 1 }}
{{- $stepName := $s.stepName }}
{{- $params := $s.params }}
{{- if eq $s.kind "BIOSSettingsSet" }}
{{- $settingsFileName := $params.settingsFileName }}
{{- $settingsContent := $params.settingsContent }}
{{- if not (or $settingsFileName $settingsContent) }}
{{- fail (printf "metal-settings: chain step %q (machines.%s.models.%s) is a BIOSSettingsSet step but defines neither params.settingsFileName nor params.settingsContent" $stepName $vendor $entryName) }}
{{- end }}
{{- $version := $params.version }}
{{- if and $entry.clusterTypes (include "metal-settings.shouldInclude" (dict "item" $model "filters" $.Values.biosSettings.filters.models)) (include "metal-settings.shouldInclude" (dict "item" $version "filters" $.Values.biosSettings.filters.versions)) }}
{{- if $gatesEnabled }}
{{- if not $params.completionConditionType }}
{{- fail (printf "metal-settings: chain step %q (machines.%s.models.%s) has no params.completionConditionType (required when CRDVersionControl.features.readinessGates.enabled=true)" $stepName $vendor $entryName) }}
{{- end }}
{{- if and (gt $stepIndex 1) (not $params.readinessGates) }}
{{- fail (printf "metal-settings: chain step %q (machines.%s.models.%s) has no params.readinessGates (required for non-first chain steps when CRDVersionControl.features.readinessGates.enabled=true)" $stepName $vendor $entryName) }}
{{- end }}
{{- end }}
{{- $serverFilters := $params.serverFilter | default (dict "included" (list) "excluded" (list)) }}
{{/* params.setMetadataName: see values.yaml machines inventory comment block for naming/tpl rules. */}}
{{- $explicitName := "" }}
{{- if $params.setMetadataName }}
{{- $explicitName = tpl $params.setMetadataName $ }}
{{- end }}
{{- range $clusterType := $entry.clusterTypes }}
{{- if include "metal-settings.shouldInclude" (dict "item" $clusterType "filters" $.Values.biosSettings.filters.clusterTypes) }}
{{- $defaultName := printf "%s-%s-%s" (lower $vendor) (lower $model) (lower $clusterType) }}
{{- if $gatesEnabled }}
{{- $defaultName = printf "%s-%s-%s-%s" (lower $vendor) (lower $model) (lower $clusterType) $stepName }}
{{- end }}
{{- $withCluster := printf "%s-%s" $explicitName (lower $clusterType) }}
{{- $resourceName := ternary $withCluster $defaultName (ne $explicitName "") }}
{{- if hasKey $usedNames $resourceName }}
{{- fail (printf "metal-settings: duplicate BIOSSettingsSet name %q (entry %q, model %q, clusterType %q). Set a unique params.setMetadataName on one of the conflicting chain steps." $resourceName $entryName $model $clusterType) }}
{{- end }}
{{- $_ := set $usedNames $resourceName true }}
apiVersion: {{ $.Values.CRDVersionControl.apiVersions.biosSettingsSet }}
kind: BIOSSettingsSet
metadata:
  name: {{ $resourceName }}
spec:
  serverSelector:
    matchLabels:
      {{ $.Values.labelKeys.type }}: {{ $model }}
      {{ $.Values.labelKeys.clusterType }}: {{ $clusterType }}
{{- $serverMatchExpressions := include "metal-settings.serverMatchExpressions" (dict "serverFilters" $serverFilters "labelKey" $.Values.labelKeys.serverName) }}
{{- if $serverMatchExpressions }}
{{ $serverMatchExpressions | nindent 4 }}
{{- end }}
  biosSettingsTemplate:
    serverMaintenancePolicy: OwnerApproval
{{- with $.Values.biosSettings.retryPolicy }}
    retryPolicy:
{{ toYaml . | indent 6 }}
{{- end }}
{{- if $settingsContent }}
{{ $settingsContent | trim | indent 4 }}
{{- else }}
{{ $.Files.Get (printf "bios_settings/%s" $settingsFileName) | trim | indent 4 }}
{{- end }}
{{- if $version }}
    version: {{ $version | quote }}
{{- end }}
{{- if $gatesEnabled }}
{{- if $params.readinessGates }}
    readinessGates:
{{ toYaml $params.readinessGates | indent 6 }}
{{- end }}
    completionConditionType: {{ $params.completionConditionType }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- else if not (has $s.kind (list "BMCSettingsSet" "BMCVersionSet" "BIOSVersionSet")) }}
{{- fail (printf "metal-settings: chain step %q (machines.%s.models.%s) has unknown kind %q (expected BMCSettingsSet, BMCVersionSet, BIOSVersionSet, or BIOSSettingsSet)" $stepName $vendor $entryName $s.kind) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

