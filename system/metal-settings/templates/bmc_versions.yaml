{{- if .Values.crdVersionControl.features.bmcVersions.enabled }}
{{- include "metal-settings.rejectLegacyMachinesKey" . }}
{{- $gatesEnabled := .Values.crdVersionControl.features.readinessGates.enabled }}
{{- if $gatesEnabled }}
{{- include "metal-settings.requireChainCapableAPI" . }}
{{- end }}
{{- $usedNames := dict }}
{{- $knownKinds := include "metal-settings.knownKinds" . | fromYamlArray }}
{{- $firmwareHost := $.Values.firmwareRepo.hostOverride | default (printf "%s.%s.%s" $.Values.firmwareRepo.host $.Values.global.region $.Values.global.tld) }}
{{- $effectiveTypes := include "metal-settings.effectiveRolloutTypes" $ | fromYaml }}
{{- $reservedVendorKeys := list "enabled" "rollouts" }}
{{- range $vendor, $vendorParams := .Values.parameters }}
{{- range $modelKey, $modelParams := $vendorParams }}
{{- if not (has $modelKey $reservedVendorKeys) }}
{{- $model := $modelKey }}

{{/*
BMCVersionSet steps have no clusterType dimension of their own - they render once per MODEL. But
workflow is resolved per effective cluster type (see metal-settings.resolveWorkflowForClusterType),
so this collects each cluster type's resolved BMCVersionSet step(s) and verifies they're
identical before rendering once - a model whose cluster types resolve to genuinely different
version-kind definitions is a misconfiguration and fails fast here with a clear error.
*/}}
{{- $versionSteps := dict }}
{{- range $clusterType, $_ := $effectiveTypes }}
{{- $chainsByRule := include "metal-settings.computedChain" (dict "vendor" $vendor "model" $model "clusterType" $clusterType "root" $) | fromYaml }}
{{- range $ruleIndex, $chain := $chainsByRule }}
{{- range $stepName, $step := $chain }}
{{- if eq $step.kind "BMCVersionSet" }}
{{- if hasKey $versionSteps $stepName }}
{{- $existing := index $versionSteps $stepName }}
{{- if not (deepEqual $existing.step $step) }}
{{- fail (printf "metal-settings: parameters.%s.%s step %q (BMCVersionSet) resolves differently for cluster type %q (rule %d) than for cluster type %q (rule %d) - version-kind steps must be identical across every cluster type/rule a model has (check rollouts.types)" $vendor $model $stepName $clusterType $ruleIndex $existing.clusterType $existing.ruleIndex) }}
{{- end }}
{{- else }}
{{- $_ := set $versionSteps $stepName (dict "clusterType" $clusterType "ruleIndex" $ruleIndex "step" $step) }}
{{- end }}
{{- else if not (has $step.kind $knownKinds) }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) has unknown kind %q (expected one of %v)" $stepName $vendor $model $step.kind $knownKinds) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if gt (len $versionSteps) 0 }}

{{/*
Map iteration in Go templates is key-sorted (not insertion order), so steps are re-sorted here
by their explicit "order" field to guarantee correct sequencing.
*/}}
{{- $orderedSteps := dict }}
{{- range $stepName, $entry := $versionSteps }}
{{- $step := $entry.step }}
{{- if not $step.order }}
{{- fail (printf "metal-settings: chain step %q for parameters.%s.%s has no order" $stepName $vendor $model) }}
{{- end }}
{{- $orderKey := printf "%04d" (int $step.order) }}
{{- if hasKey $orderedSteps $orderKey }}
{{- fail (printf "metal-settings: parameters.%s.%s has two chain steps with order %d" $vendor $model (int $step.order)) }}
{{- end }}
{{- $_ := set $orderedSteps $orderKey (dict "stepName" $stepName "kind" $step.kind "enabled" $step.enabled "params" ($step.params | default dict)) }}
{{- end }}

{{- $stepIndex := 0 }}
{{- range $orderKey, $s := $orderedSteps }}
{{- $stepIndex = add $stepIndex 1 }}
{{- $stepName := $s.stepName }}
{{- $params := $s.params }}
{{- $imageURI := $params.imageURI }}
{{- $imagePath := $params.imagePath }}
{{- if not (or $imageURI $imagePath) }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) is a BMCVersionSet step but defines no params.imageURI or params.imagePath" $stepName $vendor $model) }}
{{- end }}
{{- $version := $params.version }}
{{- if not $version }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) is a BMCVersionSet step but defines no params.version" $stepName $vendor $model) }}
{{- end }}
{{- if include "metal-settings.stepEnabled" (dict "step" $s "root" $) }}
{{- if $gatesEnabled }}
{{- if not $params.completionConditionType }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) has no params.completionConditionType (required when crdVersionControl.features.readinessGates.enabled=true)" $stepName $vendor $model) }}
{{- end }}
{{- if and (gt $stepIndex 1) (not $params.readinessGates) }}
{{- fail (printf "metal-settings: chain step %q (parameters.%s.%s) has no params.readinessGates (required for non-first chain steps when crdVersionControl.features.readinessGates.enabled=true)" $stepName $vendor $model) }}
{{- end }}
{{- end }}
{{- $serverFilters := $params.serverFilter | default (dict "included" (list) "excluded" (list)) }}
{{- $defaultName := printf "%s-%s" (lower $vendor) (lower $model) }}
{{- if $gatesEnabled }}
{{- $defaultName = printf "%s-%s-%s" (lower $vendor) (lower $model) $stepName }}
{{- end }}
{{/* params.setMetadataName: see values.yaml's "Machine inventory" comment for naming/tpl rules. */}}
{{- $resourceName := $defaultName }}
{{- if $params.setMetadataName }}
{{- $resourceName = tpl $params.setMetadataName $ }}
{{- end }}
{{- if hasKey $usedNames $resourceName }}
{{- fail (printf "metal-settings: duplicate BMCVersionSet name %q (model %q). Set a unique params.setMetadataName on one of the conflicting chain steps." $resourceName $model) }}
{{- end }}
{{- $_ := set $usedNames $resourceName true }}
apiVersion: {{ $.Values.crdVersionControl.apiVersions.bmcVersionSet }}
kind: BMCVersionSet
metadata:
  name: {{ $resourceName }}
spec:
  bmcSelector:
    matchLabels:
      {{ $.Values.labelKeys.type }}: {{ $model }}
{{- $serverMatchExpressions := include "metal-settings.serverMatchExpressions" (dict "serverFilters" $serverFilters "labelKey" $.Values.labelKeys.serverName) }}
{{- if $serverMatchExpressions }}
{{ $serverMatchExpressions | nindent 4 }}
{{- end }}
  bmcVersionTemplate:
    serverMaintenancePolicy: {{ $.Values.crdVersionControl.features.bmcVersions.serverMaintenancePolicy }}
    version: {{ $version | quote }}
    image:
      URI: {{ if $imageURI }}{{ $imageURI | quote }}{{ else }}{{ printf "%s://%s%s" $.Values.firmwareRepo.scheme $firmwareHost $imagePath | quote }}{{ end }}
      transferProtocol: {{ upper $.Values.firmwareRepo.scheme | quote }}
{{- with $.Values.crdVersionControl.features.bmcVersions.retryPolicy }}
    retryPolicy:
{{ toYaml . | indent 6 }}
{{- end }}
{{- if $gatesEnabled }}
{{- if $params.readinessGates }}
    readinessGates:
{{ toYaml $params.readinessGates | indent 6 }}
{{- end }}
    completionConditionType: {{ $params.completionConditionType }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
