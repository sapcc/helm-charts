# Global values (typically provided by cluster-specific overrides in foundation-deployment)
global:
  region: eu-de-1
  tld: cloud.sap

# Firmware repository used to build BIOS/BMC image URLs together with global.region/tld
# example https://repo.eu-de-1.cloud.sap
firmwareRepo:
  scheme: https
  host: repo
  # Optional: fully override the composed host (host + global.region + global.tld),
  # e.g. for a cluster using a dedicated firmware repo server.
  hostOverride: ""

# Regional filtering configuration for selective deployment
# Use these settings to control which resources are deployed in each region
#
# FILTER BEHAVIOR:
# - included: [] (empty) = include all items (default behavior)
# - included: [dell, hpe] = ONLY include items in this list
# - excluded: [lenovo] = exclude these items (takes precedence over included)
# - If an item appears in both included and excluded, excluded wins
#
# CLUSTER TYPES & RESOURCE GENERATION:
# - BIOSSettingsSet/BMCSettingsSet: Generate one resource PER clusterType listed below
#   (e.g., if a model has 6 clusterTypes, it generates 6 separate Settings resources)
# - BIOSVersionSet/BMCVersionSet: Generate one resource PER model+version
#   (clusterTypes field is ignored)
#
# defaultClusterTypes anchor: Used by most models to reference standard cluster types
# Some models (e.g., proliant-dl560-gen11) may have multiple entries with different
# clusterTypes to support different BIOS/BMC settings per cluster type.

defaultClusterTypes: &defaultClusterTypes
  - cc-kvm-compute
  - sci-k8s-controlplane
  - sci-k8s-management
  - sci-k8s-runtime
  - sci-k8s-storage
  - cc-ironcore

biosSettings:
  enabled: true
  retryPolicy:
    maxAttempts: 5
  filters:
    # Filter by vendor (dell, hpe, lenovo)
    vendors:
      included: [] # Empty = include all. E.g., [dell, hpe]
      excluded: [] # E.g., [lenovo] to exclude Lenovo
    # Filter by model (e.g., poweredge-r7615, proliant-dl560-gen11)
    models:
      included: []
      excluded: []
    # Filter by cluster type (e.g., sci-k8s-controlplane, cc-kvm-compute)
    clusterTypes:
      included: []
      excluded: []
    # Filter by version
    versions:
      included: []
      excluded: []

bmcSettings:
  enabled: false
  filters:
    # Filter by vendor (dell, hpe, lenovo)
    vendors:
      included: [] # Empty = include all. E.g., [dell, hpe]
      excluded: [] # E.g., [lenovo] to exclude Lenovo
    # Filter by model (e.g., poweredge-r7615, proliant-dl560-gen11)
    models:
      included: []
      excluded: []
    # Filter by cluster type (e.g., sci-k8s-controlplane, cc-kvm-compute)
    clusterTypes:
      included: []
      excluded: []
    # Filter by version
    versions:
      included: []
      excluded: []

biosVersions:
  enabled: true
  retryPolicy:
    maxAttempts: 5
  filters:
    vendors:
      included: []
      excluded: []
    models:
      included: []
      excluded: []
    versions:
      included: []
      excluded: []

bmcVersions:
  enabled: true
  retryPolicy:
    maxAttempts: 5
  filters:
    vendors:
      included: []
      excluded: []
    models:
      included: []
      excluded: []
    versions:
      included: []
      excluded: []

# Label keys used to build serverSelector/bmcSelector matchLabels and
# matchExpressions in the generated BIOSSettingsSet/BMCSettingsSet/
# BIOSVersionSet/BMCVersionSet resources.
#
# Override these per-cluster to support migrations where a newer/renamed
# label group is used to identify servers (e.g. testing a new
# "kubernetes.metal.cloud.sap/cluster-type" replacement on a subset of
# clusters before rolling it out everywhere).
labelKeys:
  type: "kubernetes.metal.cloud.sap/type"
  clusterType: "kubernetes.metal.cloud.sap/cluster-type"
  serverName: "kubernetes.metal.cloud.sap/name"

# apiVersion used for the generated BIOSSettingsSet/BMCSettingsSet/
# BIOSVersionSet/BMCVersionSet resources, plus feature flags gated by those apiVersions.
#
# metal-operator (single-group project) serves these kinds under
# "metal.ironcore.dev/v1alpha1". metal-maintenance-operator (multigroup
# project) serves the same kinds under group-qualified versions, e.g.
# "system.metal.ironcore.dev/v1alpha1" for BIOSSettingsSet/BIOSVersionSet and
# "baseboard.metal.ironcore.dev/v1alpha1" for BMCSettingsSet/BMCVersionSet.
# Override per-cluster to test migrating from metal-operator to
# metal-maintenance-operator.
#
# Every model under `machines:` is configured via its `chain:` map (see the `machines:` section
# below) — there is no separate bios:/bmc: block anymore. CRDVersionControl.features.
# readinessGates.enabled (opt-in, disabled by default) only changes HOW a model's chain steps are
# rendered, not where their data comes from:
# - When false (default): each chain step is rendered as an independent resource (today's
#   behavior/names), with no readinessGates/completionConditionType fields — safe to use with the
#   plain metal-operator apiVersions.
# - When true: each model's chain steps are rendered as an ORDERED sequence of
#   BMCSettingsSet/BMCVersionSet/BIOSVersionSet/BIOSSettingsSet resources. Each step only starts
#   once the previous step's completionConditionType has been patched (status: True) onto the
#   related Server(s) — mirroring the readiness-gate pattern used by metal-maintenance-operator's
#   e2e chain test.
#
# PRECONDITION: CRDVersionControl.features.readinessGates.enabled requires
# CRDVersionControl.apiVersions.* above to point at metal-maintenance-operator's groups
# ("baseboard.metal.ironcore.dev/v1alpha1" for BMCSettingsSet/BMCVersionSet,
# "system.metal.ironcore.dev/v1alpha1" for BIOSSettingsSet/BIOSVersionSet) — the plain
# metal-operator group ("metal.ironcore.dev/v1alpha1") has no readinessGates/
# completionConditionType fields at all. The chart fails fast (via `fail`) if this precondition
# isn't met.
CRDVersionControl:
  apiVersions:
    biosSettingsSet: "metal.ironcore.dev/v1alpha1"
    bmcSettingsSet: "metal.ironcore.dev/v1alpha1"
    biosVersionSet: "metal.ironcore.dev/v1alpha1"
    bmcVersionSet: "metal.ironcore.dev/v1alpha1"
  features:
    readinessGates:
      enabled: false

# Cluster-specific values injected into the metal-bmc-settings ConfigMap.
# These are region/cluster-level overrides consumed by BMCSettings variables at reconcile time.
clusterConfig:
  # Name of the ConfigMap created by this chart and referenced by BMCSettings variables.
  configMapName: ""
  syslogServer: "" # e.g. "remotesyslog.cc.qa-de-1.cloud.sap"
  # Name of the Secret holding the HPE iLO license key (key: licenseKey).
  hpeLicenseSecretName: "" # e.g. "hpe-ilo-license"
  # The actual HPE iLO license key value — stored in the Secret above.
  # In production, override via external secret management (Vault, SealedSecrets, etc.).
  hpeLicenseKey: ""

  managedNamespace: "metal-servers" # Namespace where BMCSettingsSets related resources are deployed

# Machine inventory: Hardware configurations for all supported servers.
#
# Settings files live in bios_settings/ and bmc_settings/ (bundled with the chart); many models
# share a vendor-default file, while some use a model-specific file for special settings — see
# each model's settingsFileName below for the file actually in use.
#
# settingsFileName vs settingsContent: settingsFileName references a bundled file (shared, stable
# settings); settingsContent is an inline YAML string (region/node-specific overrides, e.g. via
# kube-secrets). If both are set, settingsContent wins. Use YAML anchors (&name/*name) to avoid
# duplicating inline content across values files.
#
# Map keys: use the hardware model name as the key (e.g., poweredge-r640). For models needing
# multiple entries (different clusterTypes/settings), use a descriptive suffix as the key (e.g.,
# proliant-dl560-gen11-kvm) and set model: explicitly so the hardware label in selectors stays
# correct.
#
# Each model is configured entirely through `chain:` — a map of stepName -> {kind, order, params}.
# "order" (integer) is required: map iteration in Go templates is key-sorted, not
# insertion-ordered, so it's the only way to guarantee steps render/chain in the right sequence.
# Standard steps (use these 4 names/orders; omit a step if the model has no data for it, e.g. a
# model with no BIOS settings file just omits bios-settings):
#   bmc-settings  (order 1, kind: BMCSettingsSet)  - rendered once per clusterType
#   bmc-version   (order 2, kind: BMCVersionSet)   - rendered once per model
#   bios-version  (order 3, kind: BIOSVersionSet)  - rendered once per model
#   bios-settings (order 4, kind: BIOSSettingsSet) - rendered once per clusterType
# Each step's params:
#   - version (required): firmware/settings version string
#   - settingsFileName (Settings kinds): references a file in bios_settings/ or bmc_settings/
#   - settingsContent (Settings kinds, optional): inline YAML string, wins over settingsFileName
#   - imageURI (Version kinds, required): firmware image URL
#   - serverFilter: { included: [], excluded: [] }   # empty included = all servers; excluded wins
#   - setMetadataName: <string>                       # optional explicit CRD metadata.name
#     For Settings kinds (bmc-settings/bios-settings, rendered once per clusterType), the final
#     name is "<setMetadataName>-<clusterType>"; for Version kinds (bmc-version/bios-version,
#     rendered once per model), setMetadataName is used verbatim. It may contain {{ }} template
#     expressions, resolved via Helm's tpl against the root context - e.g.:
#       setMetadataName: "abc-123"                                 -> abc-123(-<clusterType>)
#       setMetadataName: "abc-{{ .Values.clusterConfig.region }}"  -> abc-<region>(-<clusterType>)
#     Dot notation breaks on hyphenated map keys (model/step names), use "index" instead, e.g. to
#     embed this model's bmc-settings step order number:
#       setMetadataName: >-
#         abc-{{ index .Values.machines.dell.models "poweredge-r640" "chain" "bmc-settings" "order" }}
#   - readinessGates / completionConditionType: only used when
#     CRDVersionControl.features.readinessGates.enabled=true (overrides the auto-chained
#     readinessGates from the previous step / the auto-generated condition name)
#
# See machines.dell.models.poweredge-r640.chain below for a worked example.

machines:
  dell:
    models:
      poweredge-r640:
        model: poweredge-r640
        clusterTypes: *defaultClusterTypes
        chain:
          bmc-settings:
            kind: BMCSettingsSet
            order: 1
            params:
              version: "7.00.00.183"
              settingsFileName: dell-default.yaml
              completionConditionType: metal.cloud.sap/step1-bmc-settings-done
          bmc-version:
            kind: BMCVersionSet
            order: 2
            params:
              version: "7.00.00.183"
              imagePath: "/hw-firmware/dell/poweredge-r640/iDRAC-with-Lifecycle-Controller_Firmware_VP556_WN64_7.00.00.183_A00.EXE"
              completionConditionType: metal.cloud.sap/step2-bmc-version-done
              readinessGates:
                - type: metal.cloud.sap/step1-bmc-settings-done
                  requiredStatus: "True"
          bios-version:
            kind: BIOSVersionSet
            order: 3
            params:
              version: "2.22.2"
              imagePath: "/hw-firmware/dell/poweredge-r640/BIOS_F8GPH_WN64_2.22.2.EXE"
              completionConditionType: metal.cloud.sap/step3-bios-version-done
              readinessGates:
                - type: metal.cloud.sap/step2-bmc-version-done
                  requiredStatus: "True"
          bios-settings:
            kind: BIOSSettingsSet
            order: 4
            params:
              version: "2.22.2"
              settingsFileName: dell-default.yaml
              completionConditionType: metal.cloud.sap/step4-bios-settings-done
              readinessGates:
                - type: metal.cloud.sap/step3-bios-version-done
                  requiredStatus: "True"
              # Other params available on any step:
              # settingsContent: <inline YAML string>     # Settings-kind steps only; overrides settingsFileName
              # serverFilter: { included: [], excluded: [] }
              # setMetadataName: <string>                 # overrides the auto-generated resource name

      poweredge-r660:
