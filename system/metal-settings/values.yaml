# Global values (typically provided by cluster-specific overrides in foundation-deployment)
global:
  region: eu-de-1
  tld: cloud.sap

# Firmware repository used to build BIOS/BMC image URLs together with global.region/tld
# example https://repo.eu-de-1.cloud.sap
firmwareRepo:
  scheme: https
  host: repo
  # Optional: fully override the composed host (host + global.region + global.tld),
  # e.g. for a cluster using a dedicated firmware repo server.
  hostOverride: ""

# Label keys used to build serverSelector/bmcSelector matchLabels and
# matchExpressions in the generated BIOSSettingsSet/BMCSettingsSet/
# BIOSVersionSet/BMCVersionSet resources.
#
# Override these per-cluster to support migrations where a newer/renamed
# label group is used to identify servers (e.g. testing a new
# "kubernetes.metal.cloud.sap/cluster-type" replacement on a subset of
# clusters before rolling it out everywhere).
labelKeys:
  type: "kubernetes.metal.cloud.sap/type"
  clusterType: "kubernetes.metal.cloud.sap/cluster-type"
  serverName: "kubernetes.metal.cloud.sap/name"

# apiVersion used for the generated BIOSSettingsSet/BMCSettingsSet/
# BIOSVersionSet/BMCVersionSet resources, plus feature flags gated by those apiVersions.
#
# metal-operator (single-group project) serves these kinds under
# "metal.ironcore.dev/v1alpha1". metal-maintenance-operator (multigroup
# project) serves the same kinds under group-qualified versions, e.g.
# "system.metal.ironcore.dev/v1alpha1" for BIOSSettingsSet/BIOSVersionSet and
# "baseboard.metal.ironcore.dev/v1alpha1" for BMCSettingsSet/BMCVersionSet.
# Override per-cluster to test migrating from metal-operator to
# metal-maintenance-operator.
#
# Every model under `parameters:` is configured via its own bmc:/bios: blocks plus an optional
# rollouts: override (see the "Machine inventory" comment below). crdVersionControl.features.
# readinessGates.enabled (opt-in, disabled by default) only changes HOW a model's chain steps are
# rendered, not where their data comes from:
# - When false (default): each chain step is rendered as an independent resource (today's
#   behavior/names), with no readinessGates/completionConditionType fields — safe to use with the
#   plain metal-operator apiVersions.
# - When true: each model's chain steps are rendered as an ORDERED sequence of
#   BMCSettingsSet/BMCVersionSet/BIOSVersionSet/BIOSSettingsSet resources. Each step only starts
#   once the previous step's completionConditionType has been patched (status: True) onto the
#   related Server(s) — mirroring the readiness-gate pattern used by metal-maintenance-operator's
#   e2e chain test.
#
# PRECONDITION: crdVersionControl.features.readinessGates.enabled requires
# crdVersionControl.apiVersions.* above to point at metal-maintenance-operator's groups
# ("baseboard.metal.ironcore.dev/v1alpha1" for BMCSettingsSet/BMCVersionSet,
# "system.metal.ironcore.dev/v1alpha1" for BIOSSettingsSet/BIOSVersionSet) — the plain
# metal-operator group ("metal.ironcore.dev/v1alpha1") has no readinessGates/
# completionConditionType fields at all. The chart fails fast (via `fail`) if this precondition
# isn't met.
crdVersionControl:
  apiVersions:
    biosSettingsSet: "metal.ironcore.dev/v1alpha1"
    bmcSettingsSet: "metal.ironcore.dev/v1alpha1"
    biosVersionSet: "metal.ironcore.dev/v1alpha1"
    bmcVersionSet: "metal.ironcore.dev/v1alpha1"
    firmwareUpdateSet: "system.metal.ironcore.dev/v1alpha1"
  features:
    readinessGates:
      enabled: false
    # Per-kind enable toggles + retryPolicy + serverMaintenancePolicy for the generated CRD specs.
    # serverMaintenancePolicy is passed straight through to each kind's own <kind>Template.serverMaintenancePolicy
    # field (OwnerApproval by default) - override per-kind to change who/what must approve maintenance on affected Servers.
    biosSettings:
      enabled: true
      serverMaintenancePolicy: OwnerApproval
      retryPolicy:
        maxAttempts: 5
    bmcSettings:
      enabled: false
      serverMaintenancePolicy: OwnerApproval
    biosVersions:
      enabled: true
      serverMaintenancePolicy: OwnerApproval
      retryPolicy:
        maxAttempts: 5
    bmcVersions:
      enabled: true
      serverMaintenancePolicy: OwnerApproval
      retryPolicy:
        maxAttempts: 5
    firmware:
      enabled: false
      serverMaintenancePolicy: OwnerApproval
      retryPolicy:
        maxAttempts: 5

# Cluster-specific values injected into the metal-bmc-settings ConfigMap.
# These are region/cluster-level overrides consumed by BMCSettings variables at reconcile time.
clusterConfig:
  # Name of the ConfigMap created by this chart and referenced by BMCSettings variables.
  configMapName: ""
  syslogServer: "" # e.g. "remotesyslog.cc.qa-de-1.cloud.sap"
  # Name of the Secret holding the HPE iLO license key (key: licenseKey).
  hpeLicenseSecretName: "" # e.g. "hpe-ilo-license"
  # The actual HPE iLO license key value — stored in the Secret above.
  # In production, override via external secret management (Vault, SealedSecrets, etc.).
  hpeLicenseKey: ""

  managedNamespace: "metal-servers" # Namespace where BMCSettingsSets related resources are deployed

# Machine inventory: concerns kept separate, but co-located for override-ability.
#
# 1) parameters: — USER INPUT. Per vendor/model firmware/settings data and nothing else. This is
#    the only place that changes when bumping a firmware version, settings file, or toggling a
#    vendor/model/domain/variant on or off. Schema per parameters.<vendor>.<model>:
#      enabled: bool?                           # optional, default true - skips this whole vendor
#                                                # (parameters.<vendor>.enabled) or model
#                                                # (parameters.<vendor>.<model>.enabled) when false
#      bmc/bios:
#        enabled: bool?                         # optional, default true - skips this whole domain
#        versions:
#          <versionKey>: { version, imagePath|imageURI, enabled? }   # e.g. defaultVersion - imageURI
#                                                                     # overrides imagePath outright (legacy
#                                                                     # fallback: skips firmwareRepo host composition)
#        settings:
#          <settingsKey>: <settingsFileName>                # shorthand: plain string, enabled=true
#          <settingsKey>: { settingsFileName|settingsContent, enabled? }  # or an object when a
#                                                                          # variant needs its own
#                                                                          # enabled flag (e.g. a
#                                                                          # not-yet-ready initialSettings)

#    enabled defaults to true at every level (vendor, model, domain, versions.<key>, settings.<key>)
#    and cascades down: a disabled vendor/model/domain skips every step under it regardless of its
#    children's own enabled values.
#
#    Example: enabled: false at each of the 5 levels (all optional/independent, shown together only
#    for illustration - in practice you'd set just ONE of these):
#      parameters:
#        dell:                             # vendor level
#          enabled: false                  #   -> skips every Dell model entirely
#          poweredge-r640:                 # model level
#            enabled: false                #   -> skips just this model (bmc AND bios domains)
#            bmc:                          # domain level
#              enabled: false              #   -> skips just the bmc domain for this model
#              versions:
#                defaultVersion:
#                  version: "7.00.00.183"
#                  imagePath: "/hw-firmware/dell/poweredge-r640/..."
#                  enabled: false          # versions.<key> level -> skips just bmc-version/bmc-settings
#              settings:
#                initialSettings:
#                  settingsFileName: dell-initial-default.yaml
#                  enabled: false          # settings.<key> level -> skips just bmc-settings-initial
#
#    Map keys: use the hardware model name (e.g. poweredge-r640). A model that needs different
#    settings for different groups of cluster types (e.g. proliant-dl560-gen11, see worked example
#    below) expresses that via a rollouts.types rule (see (3) below) keyed off its model name,
#    rather than a separate parameters entry or a rollouts: key under parameters itself (parameters
#    has no "rollouts" key at all - ALL workflow routing/selection lives in rollouts.types) - ALL of
#    a model's data lives in exactly one parameters.<vendor>.<model> block.
#
# 2) Workflow: — WORKFLOW SHAPE. The one, global, vendor/model-agnostic definition of the 6-step
#    chain shape (stepName/kind, in order). A step's "versionKey"/"settingsKey" is a fully-qualified
#    relative path "<domain>.settings.<key>" / "<domain>.versions.<key>" (e.g.
#    "bmc.settings.initialSettings" reads bmc.settings.initialSettings) - <domain> must match the
#    domain implied by the step's own "kind" (BMC*->bmc, BIOS*->bios); a mismatch fails fast. This
#    makes each reference directly self-contained/greppable instead of relying on the reader
#    already knowing the domain-from-kind convention.
#    A step's "enabled" field (only bmc-settings-initial has one) may instead be a quoted template
#    string tied to another values path (e.g. "{{ .Values.crdVersionControl.features.
#    readinessGates.enabled }}"), re-evaluated via tpl at render time - a reusable pattern for any
#    future step whose presence should depend on a values field other than parameters: data.
#    completionConditionType/readinessGates are NOT data —
#    they're computed generically in _helpers.tpl's "metal-settings.computedChain" from each
#    step's position in this list and from which steps a model has parameters: data for.
#    A model needing a genuinely different step shape (extra/fewer steps, different
#    versionKey/settingsKey wiring) for some of its cluster types defines its own named Workflow
#    variant (e.g. workflowSciSettings below) and references it from a rollouts.types rule (3).
#    A step definition may additionally set these 3 OPTIONAL manual-override fields - all pure
#    rendering/selection control.
#      setMetadataName: replaces the auto-computed "<vendor>-<model>" resource name outright - a
#                        literal string applies identically to every model that resolves this exact
#                        Workflow (or Workflow variant), so a per-model custom name needs its own
#                        named Workflow variant referenced via a rollouts.types rule scoped to that
#                        one model (not a change to the shared Workflow).
#      completionConditionTypeOverride: replaces the auto-computed
#                        "metal.cloud.sap/step{order}-{name}-done" completionConditionType outright.
#      readinessGatesOverride: replaces the auto-computed readinessGates outright - only needed for
#                        a step that must gate on something other than "the nearest preceding step
#                        this model has data for" (e.g. a one-off entry that should gate on a
#                        different step).
#    serverFilter (restricting which individual servers a step's rendered resource targets) is
#    never set here - it is NEVER read from a Workflow step at all. Its ONLY source is a
#    rollouts.types rule's filter.include.servers/filter.exclude.servers (3). A step needing a
#    genuinely different server subset than its siblings gets its own rule (with its own
#    filter.include/filter.exclude) pointing at a Workflow variant that only changes that one step
#    - there is no separate step-level escape hatch. With no include.servers/exclude.servers from
#    the matched rule, a step's auto-computed behavior is to target every server matching the
#    resource's vendor/model/clusterType selector.
#
# 3) rollouts.types: — WORKFLOW/SERVER SELECTION, keyed by cluster type. Maps every known cluster
#    type to a LIST OF RULES, each shaped
#    { filter?: { include?: { models?, resources?, servers? }, exclude?: { models?, resources?, servers? } }, workflow }:
#      defaultRollouts.types.<clusterType>  - chart default catalog (below) - every cluster type
#                                              this chart knows about, used whenever a cluster
#                                              hasn't overridden rollouts:
#      rollouts.types.<clusterType>         - REAL, per-cluster override - set via the cluster's
#                                              own kube-secrets/foundation-deployment values file.
#                                              This is a plain top-level map the chart itself never
#                                              defines, so whatever a cluster's override file puts
#                                              here IS the complete list of cluster types deployed
#                                              to THIS cluster (no merge-with-defaults - that's what
#                                              makes it possible to deploy to a SUBSET of the known
#                                              catalog with a single override). Falls back to
#                                              defaultRollouts.types if this key is entirely absent.
#    For a given rule, "filter" is optional - omitted (or empty) matches every model/kind/server.
#    "include" is the POSITIVE match: include.models/include.resources (lists of model names /
#    kind names, e.g. BIOSSettingsSet) gate whether the rule applies at all - empty/absent means
#    "every model"/"every kind". include.servers does NOT gate matching (servers are never known at
#    template time, only forwarded as a label selector) - it becomes the base serverFilter.included
#    stamped onto every step this rule renders.
#    "exclude" is a NEGATIVE carve-out, evaluated per (model, kind) once the Workflow is walked:
#      - exclude.models/exclude.resources empty/absent = matches every model/kind (wildcard).
#      - if a (model, kind) matches exclude AND exclude has no "servers": that step is suppressed
#        entirely for THAT model only - other models the rule also matches still render that kind.
#      - if a (model, kind) matches exclude AND exclude HAS "servers": the step still renders, but
#        exclude.servers is merged into that step's serverFilter.excluded (on top of
#        include.servers), carving those servers out while a separate, more specific rule covers
#        them instead.
#      - exclude matching a model with NEITHER resources NOR servers set is a blanket exclusion -
#        the rule doesn't match that model at all (same as a full, old-style model exclude).
#    ALL rules that match a given model are used - not first-match-wins - so one rule scoped to
#    every model except X plus a second rule scoped to just X correctly produce two independent
#    resources for X (see the proliant-dl560-gen11 worked example below); similarly one broad rule
#    with exclude: { models: [X], servers: [nodeA] } plus a second, narrower rule with
#    include: { models: [X], servers: [nodeA] } correctly produce two independent resources that
#    together cover every server of X without overlap, with no separate parameters entry needed for
#    the second rule, and no disabled-step-stub Workflow variant needed either (which would
#    otherwise corrupt the readinessGates cascade - a disabled/omitted step still participates in
#    order-based cascade computation if left present in the Workflow map) - see README's UC13.
#    There is no separate vendor/model-level override cascade - parameters: has no "rollouts" key
#    at all; ALL workflow/server routing for a given model happens via a rollouts.types rule's
#    include/exclude.
#    For a given parameters.<vendor>.<model> and a given effective cluster type (a key of whichever
#    rollouts.types is in effect - the cluster override if set, else defaultRollouts.types), each
#    matching rule's resolved workflow's Settings-kind steps (BMCSettingsSet/BIOSSettingsSet) are
#    rendered once per (cluster type, matching rule); Version-kind steps (BMCVersionSet/
#    BIOSVersionSet) are rendered once per MODEL regardless of cluster type/rule - every matching
#    rule's resolved workflow, across every cluster type, must define identical version-kind steps
#    for a given model (the chart fails fast if they ever diverge).
#
# 4) crdVersionControl.features.readinessGates.enabled — FEATURE ENABLEMENT. Toggles whether the
#    chain shape from (2)/(3) is even applied: false (default) renders each present step as an
#    independent resource with no readinessGates/completionConditionType; true renders the full
#    ordered, gated chain.
#
# See parameters.hpe.proliant-dl560-gen11 and the sci-*/cc-ironcore rules in defaultRollouts.types
# below for a worked example of a model routed to a different Workflow for some cluster types via
# a rollouts.types rule's include.models (different bios settings for kvm vs. sci cluster types).

# Workflow: the one static, vendor/model-agnostic 6-step chain shape. "order" is explicit (map
# iteration in Go templates is key-sorted by step NAME, not insertion order, so each step declares
# its own position). Step keys are lowerCamelCase; the kebab-case form of the key is used in
# generated Kubernetes identifiers. completionConditionType is always "metal.cloud.sap/step{order}-{name}-done";
# readinessGates always gates on the nearest PRECEDING step (by this order) that the model has
# parameters: data for - computed once, generically, in _helpers.tpl, never hand-authored per model.
workflow: &workflow
  bmcSettingsInitial:
    order: 1
    kind: BMCSettingsSet
    settingsKey: bmc.settings.initialSettings
    enabled: "{{ .Values.crdVersionControl.features.readinessGates.enabled }}"
  bmcVersion:
    order: 2
    kind: BMCVersionSet
    versionKey: bmc.versions.defaultVersion
  biosVersion:
    order: 3
    kind: BIOSVersionSet
    versionKey: bios.versions.defaultVersion
  bmcSettings:
    order: 4
    kind: BMCSettingsSet
    versionKey: bmc.versions.defaultVersion
    settingsKey: bmc.settings.defaultSettings
  biosSettings:
    order: 5
    kind: BIOSSettingsSet
    versionKey: bios.versions.defaultVersion
    settingsKey: bios.settings.defaultSettings
  firmware:
    order: 6
    kind: FirmwareUpdateSet
    paramsKey: firmware.params.defaultVersion

# workflowSciSettings: used by parameters.hpe.proliant-dl560-gen11's rollouts.types override for
# sci-*/cc-ironcore cluster types - its ONLY real difference from Workflow is bios-settings reading
# bios.settings.sciSettings instead of bios.settings.defaultSettings, so it's a sparse,
# single-step Workflow (same UC13 pattern as workflowR770NicSlot10 below) rather than a full
# duplicate of every step - bmc-settings/bmc-version/bios-version/firmware for this model are
# covered uniformly by the shared *workflow instead (see defaultRollouts.types' exclude.resources/
# include.resources rule pair), so there's only ever ONE copy of those steps to keep in sync.
# readinessGatesOverride matches what the full Workflow's cascade computes for this step (order 5,
# nearest preceding step with data = bmc-settings at order 4) - this sparse Workflow has no
# preceding step of its own to auto-cascade from.
workflowSciSettings: &workflowSciSettings
  biosSettings:
    order: 5
    kind: BIOSSettingsSet
    versionKey: bios.versions.defaultVersion
    settingsKey: bios.settings.sciSettings
    readinessGatesOverride:
      - type: metal.cloud.sap/step4-bmc-settings-done
        requiredStatus: "True"
  firmware:
    order: 6
    kind: FirmwareUpdateSet
    paramsKey: firmware.params.defaultVersion
    

# defaultRollouts.types: chart default catalog - every cluster type this chart knows about, mapped
# to a LIST of rules (see the "Machine inventory" comment above for the full filter/include/exclude
# semantics). Applies whenever a cluster HASN'T overridden rollouts: - i.e. deploy to every known
# cluster type, today's default behavior. A cluster override file sets its own top-level
# rollouts.types (not nested under defaultRollouts) to deploy to a specific subset instead - e.g.
#   rollouts:
#     Types:
#       sci-k8s-management:
#         - workflow: *workflow
# deploys ONLY to sci-k8s-management on that cluster.
#
# sci-k8s-*/cc-ironcore each have TWO rules: the default Workflow covers every model uniformly
# (including proliant-dl560-gen11's bmc-settings/bmc-version/bios-version/firmware), except its own
# BIOSSettingsSet is excluded for just proliant-dl560-gen11 - workflowSciSettings (sparse,
# FastFaultTolerantADDDC bios-settings only) covers that one step instead - cc-kvm-compute uses the
# default Workflow (AdvancedEcc bios settings) for every model, proliant-dl560-gen11 included, so it
# only needs one rule.
defaultRollouts:
  types:
    cc-kvm-compute:
      - workflow: *workflow
    sci-k8s-controlplane:
      - filter:
          exclude:
            models: [proliant-dl560-gen11]
            resources: [BIOSSettingsSet]
        workflow: *workflow
      - filter: { include: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflowSciSettings
    sci-k8s-management:
      - filter: { exclude: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflow
      - filter: { include: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflowSciSettings
    sci-k8s-runtime:
      - filter: { exclude: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflow
      - filter: { include: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflowSciSettings
    sci-k8s-storage:
      - filter: { exclude: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflow
      - filter: { include: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflowSciSettings
    cc-ironcore:
      - filter: { exclude: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflow
      - filter: { include: { models: [proliant-dl560-gen11], resources: [BIOSSettingsSet] } }
        workflow: *workflowSciSettings
    sci-k8s-edmz:
      - workflow: *workflow

