{{- if $.Values.calicoLoadBalancer }}
{{/*
calico LB does not allow separate service objects per protocol, so we merge everything into one service object
we have to live with https://github.com/kubernetes/kubernetes/issues/39188
*/}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.unbound.name }}
  annotations:
    parrot.sap.cc/announce: 'true'
    service.alpha.kubernetes.io/reject-traffic-on-external-ip: "false"
    projectcalico.org/loadBalancerIPs: '{{ $.Values.unbound.externalIPs | toJson }}'
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: {{ $.Values.unbound.name }}
    type: dns
  ports:
{{- range $.Values.unbound.externalPorts | required "$.Values.unbound.externalPorts missing" }}
{{- $port := . }}
{{- range tuple "udp" "tcp"}}
{{- $proto := . }}
    - name: dns-{{ $proto }}-{{ $port }}
      protocol: {{ $proto | upper }}
      port: {{ $port }}
{{- end }} {{/* range proto */}}
{{- end }} {{/* range port */}}
{{- end }} {{/* if */}}
