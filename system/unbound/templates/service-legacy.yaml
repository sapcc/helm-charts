{{- if not $.Values.calicoLoadBalancer }}
{{/*
legacy clusters without calico LB allow separate service objects per protocol
solving https://github.com/kubernetes/kubernetes/issues/39188
*/}}
{{- range tuple "udp" "tcp"}}
{{- $proto := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Values.unbound.name }}-{{ $proto }}
  annotations:
    parrot.sap.cc/announce: 'true'
    service.alpha.kubernetes.io/reject-traffic-on-external-ip: "false"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: {{ $.Values.unbound.name }}
    type: dns
  ports:
{{- range $.Values.unbound.externalPorts | required "$.Values.unbound.externalPorts missing" }}
{{- $port := . }}
    - name: dns-{{ $proto }}-{{ $port }}
      protocol: {{ $proto | upper }}
      port: {{ $port }}
{{- end }} {{/* range port */}}
  externalIPs:
    {{- required "A valid $.Values.unbound.externalIPs required!" $.Values.unbound.externalIPs | toYaml | nindent 2 }}
{{- end }} {{/* range tuple "udp" "tcp" */}}
{{- end }} {{/* if */}}
