authenticationConfig: {}
regions: [] # List of regions to create shoots in
networking:
  pods: ""
  services: ""
  enableBirdExporter: true
  overlay: true

# edmzShoots is a map keyed by landscape of per-eDMZ-shoot configuration.
# Values documented here for reference; actual values are supplied
# per-landscape from downstream values files.
#
# eDMZ shoots are plain leaf Shoots of the ControlPlane Seed (seedName
# cp-<landscape>). They are never promoted to a Seed, so there is no
# ManagedSeed / backup / zoneSelection config here.
#
# Per-landscape overrides that this chart understands:
#
# edmzShoots:
#   <landscape>:
#     # Optional. Overrides the Shoot resource name.
#     # Defaults to "edmz-<landscape>".
#     name: edmz-<landscape>
#     # Optional. Sets maintenance timeWindow and confineSpecUpdateRollout.
#     # One of bronze, silver, gold.
#     tier: gold
