{{- if .Values.webhookInjector.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-webhook-injector-metrics
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-injector-metrics
spec:
  ports:
    - name: metrics
      port: 8082
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
{{- end }}
