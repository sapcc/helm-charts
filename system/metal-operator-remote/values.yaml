owner-info:
  support-group: containers
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/system/metal-operator-remote
kubernetesClusterDomain: cluster.local
metalRegistryService:
  ports:
    - port: 10000
      protocol: TCP
      targetPort: 10000
  type: ClusterIP
fullnameOverride: metal-operator
remote:
  ca: ""
ignition:
  override: false
hostNetwork: false
webhook:
  enable: true
  port: 9443
certManager:
  enable: false
metrics:
  enable: false
webhookInjector:
  repository: "keppel.global.cloud.sap/ccloud-ghcr-io-mirror/SAP-cloud-infrastructure/webhook-injector"
  tag: latest
# Reuses the webhook-injector ServiceAccount (see webhook-injector-rbac.yaml) so the manager pod needs no dedicated RBAC of its own.
serviceAccount:
  name: metal-operator-webhook-injector
# Disables metal-operator-core's own direct render (see the `condition` comment in Chart.yaml).
metal-operator-core:
  enabled: false
# Auto-generated by `make build-metal-operator-remote`; edit values-overrides.yaml and re-run make to customize.
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true
  replicas: 1
  strategy:
    type: Recreate
  image:
    repository: ghcr.io/ironcore-dev/metal-operator-controller-manager
    tag: sha-4d2a4eb
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent
  ## Arguments
  ##
  args:
    - --probe-image=keppel.global.cloud.sap/ccloud-ghcr-io-mirror/ironcore-dev/metalprobe:latest
    - --probe-os-image=ghcr.io/ironcore-dev/os-images/gardenlinux:1443.3
    - --insecure=false
    - --registry-url=http://[2a10:afc0:e013:d002::]:30010
    - --manager-namespace=metal-operator-system
  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: "5000m"
      memory: "5120Mi"
    requests:
      cpu: 300m
      memory: 50Mi
  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  envOverrides:
    KUBERNETES_SERVICE_HOST: "apiserver-url"
    KUBERNETES_CLUSTER_DOMAIN: "cluster.local"
    KUBECONFIG: "/var/run/remote-kubeconfig/kubeconfig"
  extraVolumeMounts:
    - name: webhook-certs
      mountPath: /tmp/k8s-webhook-server/serving-certs
      readOnly: true
    - name: remote-serviceaccount
      mountPath: /var/run/secrets/kubernetes.io/remote-serviceaccount
      readOnly: true
    - name: remote-kubeconfig
      mountPath: /var/run/remote-kubeconfig
      readOnly: true
  extraVolumes:
    - name: webhook-certs
      emptyDir: {}
    - name: remote-serviceaccount
      secret:
        secretName: metal-operator-remote-kubeconfig
        items:
          - key: token
            path: token
          - key: bundle.crt
            path: ca.crt
    - name: remote-kubeconfig
      configMap:
        name: remote-kubeconfig
  dnsRecordTemplate:
    enabled: false
  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    runAsUser: 65532 # ensure sidecar and main controller run as same user, so they can share generated tls certs via emptyDir volume
    runAsGroup: 65532
  ## Priority class name
  ##
  # priorityClassName: ""

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10
  ## Custom Deployment labels
  ##
  # labels: {}

  pod:
    labels:
      networking.gardener.cloud/to-dns: allowed
      networking.gardener.cloud/to-private-networks: allowed
      networking.gardener.cloud/to-public-networks: allowed
      networking.gardener.cloud/to-runtime-apiserver: allowed
      networking.resources.gardener.cloud/to-all-istio-ingresses-istio-ingressgateway-tcp-9443: allowed
      networking.resources.gardener.cloud/to-kube-apiserver-tcp-443: allowed
  env:
    - name: ENABLE_WEBHOOKS
      value: "true"
  ## Manager pod's affinity
  ##
  affinity: {}
  ## Manager pod's node selector
  ##
  nodeSelector: {}
  ## Manager pod's tolerations
  ##
  tolerations: []
  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%
# Values for the vendored metaldata DaemonSet (see templates/metaldata.yaml, templates/metaldata-rbac.yaml).
metaldata:
  image:
    repository: ghcr.io/ironcore-dev/metaldata
    tag: sha-4d2a4eb
    pullPolicy: IfNotPresent
  additionalLabels: {}
