{{ if .Values.override_conf }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keys
  labels:
    type: configuration
    component: bind
type: Opaque
data:
  named.conf.controls: |
    {{ include (print .Template.BasePath "/etc/_named.conf.controls.tpl") . | b64enc | indent 4 }}
  named.conf.allow-transfer: |
    {{ include (print .Template.BasePath "/etc/_named.conf.allow-transfer.tpl") . | b64enc | indent 4 }}
  rndc.key: |
    {{ include (print .Template.BasePath "/etc/_rndc.key.tpl") . | b64enc | indent 4 }}
  rndc.keys: |
    {{ include (print .Template.BasePath "/etc/_rndc.keys.tpl") . | b64enc | indent 4 }}
  tsig.conf: |
    {{ include (print .Template.BasePath "/etc/_tsig.conf.tpl") . | b64enc | indent 4 }}
  tsig.keys: |
    {{ include (print .Template.BasePath "/etc/_tsig.keys.tpl") . | b64enc | indent 4 }}
---
{{ end }}
{{ if .Values.zabbix.enabled }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ .Release.Name }}-zabbix-tls
  labels:
    type: configuration
    component: bind
data:
  tls.ca: {{ .Values.zabbix.tls_ca | b64enc | quote }}
  tls.crt: {{ .Values.zabbix.tls_crt | b64enc | quote }}
  tls.key: {{ .Values.zabbix.tls_key | b64enc | quote }}
{{/*
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-rndc-key
  labels:
    type: configuration
    component: bind
type: Opaque
data:
  rndc.key: |
    {{ include (print .Template.BasePath "/etc/_rndc.key.tpl") . | b64enc | indent 4 }}
*/}}
---
{{ end }}
{{ if .Values.secret_env }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Release.Name }}-secret-env
  labels:
    type: configuration
    component: bind
data:
  {{ .Values.secret_env | include "setup_secret_env" | indent 2 }}
---
{{ end }}
{{ if .Values.sshd.secret_env }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Release.Name }}-sshd-secret-env
  labels:
    type: configuration
    component: bind
data:
  {{ .Values.sshd.secret_env | include "setup_secret_env" | indent 2 }}
---
{{ end }}
