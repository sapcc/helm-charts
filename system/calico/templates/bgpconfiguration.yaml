{{ if .Values.bgp.enabled }}
apiVersion: crd.projectcalico.org/v1
kind: BGPConfiguration
metadata:
  name: default
spec:
  logSeverityScreen: Info
  nodeToNodeMeshEnabled: false
  asNumber: {{ required ".Values.bgp.asNumber is missing" .Values.bgp.asNumber }}
  serviceExternalIPs:
  {{- range .Values.bgp.serviceExternalIPs }}
    - cidr: {{ . }}
  {{- end }}
  {{- if .Values.bgp.serviceLoadBalancerIPs }}
  serviceLoadBalancerIPs:
  {{- range .Values.bgp.serviceLoadBalancerIPs }}
    - cidr: {{ . }}
  {{- end }}
  {{- end }}
  listenPort: 179
  bindMode: NodeIP
{{ else }}
apiVersion: crd.projectcalico.org/v1
kind: BGPConfiguration
metadata:
  name: default
spec:
  logSeverityScreen: Info
  nodeToNodeMeshEnabled: true
  listenPort: 179
  bindMode: NodeIP
{{ end }}
