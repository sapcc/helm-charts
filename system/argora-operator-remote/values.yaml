owner-info:
  support-group: containers
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/system/argora-operator-remote

argora-operator-core:
  # nameOverride: ""
  fullnameOverride: "argora-remote"
  manager:
    # enable: true
    # replicas: 1

    # image:
    #   repository: controller
    #   tag: latest
    #   pullPolicy: IfNotPresent

    # args:
    #   - --leader-elect
    #   - --zap-log-level=debug

    env:
      - name: KUBERNETES_SERVICE_HOST
        value: "apiserver-url"
      - name: ENABLE_WEBHOOKS
        value: "false"
      - name: KUBERNETES_CLUSTER_DOMAIN
        value: "cluster.local"

    # podSecurityContext:
    #   runAsNonRoot: true
    #   seccompProfile:
    #       type: RuntimeDefault

    # securityContext:
    #   allowPrivilegeEscalation: false
    #   capabilities:
    #       drop:
    #           - ALL

    # resources:
    #   limits:
    #       cpu: 500m
    #       memory: 128Mi
    #   requests:
    #       cpu: 10m
    #       memory: 64Mi

    # affinity: {}
    # nodeSelector: {}
    # tolerations: []

    pod:
      labels:
        networking.gardener.cloud/to-dns: allowed
        networking.gardener.cloud/to-private-networks: allowed
        networking.gardener.cloud/to-public-networks: allowed
        networking.gardener.cloud/to-runtime-apiserver: allowed
        networking.resources.gardener.cloud/to-all-istio-ingresses-istio-ingressgateway-tcp-9443: allowed
        networking.resources.gardener.cloud/to-kube-apiserver-tcp-443: allowed

    extraVolumes:
    - name: secret-volume
      secret:
        secretName: argora-remote-secret
    - name: remote-kubeconfig
      secret:
        secretName: argora-operator-remote-kubeconfig
        items:
        - key: token
          path: token
        - key: bundle.crt
          path: ca.crt
    extraVolumeMounts:
    - name: secret-volume
      mountPath: /etc/credentials
      readOnly: true
    - name: remote-kubeconfig
      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      readOnly: true

    serviceAccountName: default

  rbac:
    enabled: false

  # crd:
  #   enabled: false
  #   keep: true

  metrics:
    enabled: false

  # certManager:
  #   enabled: false

  # prometheus:
  #   enabled: false

  prometheusRules:
    create: true
    labels: {}
    annotations: {}

  # ironcore:
  #   enabled: true

  netboxURL: "https://netbox-url"

  credentials:
    bmcUser: ""
    bmcPassword: ""
    netboxToken: ""
