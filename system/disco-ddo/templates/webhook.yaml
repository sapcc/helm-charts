{{- if eq .Values.mode "seed" }}
---
apiVersion: v1
kind: Service
metadata:
  name: disco-webhook-service
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app: disco
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ .Release.Name }}-mutating-webhook-configuration
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/disco-serving-cert
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: disco-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /mutate-disco-stable-sap-cc-v1-record
      port: 443
  failurePolicy: Fail
  name: mrecord.kb.io
  rules:
  - apiGroups:
    - disco.stable.sap.cc
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - records
  sideEffects: None
{{- end }}
