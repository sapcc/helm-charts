chorusSecrets:
  create: true
  masterPassword: test-master-password
  redisPassword: test-redis-password

chorus:
  dynamicCredentials:
    enabled: true
    disableEncryption: false
    pollInterval: 3s
    masterPassword: ""
    existingSecret: chorus-secrets
    existingSecretKey: master-password
  storage:
    main: swift-main
    storages:
      swift-main:
        type: SWIFT
        authURL: http://keystone.openstack.example.com:5000/v3
        storageEndpointName: swift
        storageEndpointType: object-store
        region: RegionOne
        storageURL: http://swift-proxy.openstack.example.com:8080
      swift-backup:
        type: SWIFT
        authURL: http://keystone.openstack.example.com:5000/v3
        storageEndpointName: swift
        storageEndpointType: object-store
        region: RegionOne
        storageURL: http://swift-proxy.openstack.example.com:8080
  credentials:
    storages: {}
  redis:
    enabled: true
    architecture: standalone
    auth:
      enabled: true
      existingSecret: chorus-secrets
      existingSecretPasswordKey: redis-password
  proxy:
    enabled: false
  worker:
    replicas: 2
    image:
      repository: keppel.eu-de-2.cloud.sap/i-cant-believe-its-not-cloud-infrastructure-dev/cobaltcore-storage/chorus/worker
      tag: "v0.7.10"
      pullPolicy: IfNotPresent
    config:
      concurrency: 10
      api:
        enabled: true
        webhook:
          enabled: false
      log:
        json: true
        level: info
  ui:
    enabled: true
    replicas: 1
    image:
      repository: keppel.eu-de-2.cloud.sap/i-cant-believe-its-not-cloud-infrastructure-dev/cobaltcore-storage/chorus/web-ui
      tag: "v0.7.10"
      pullPolicy: IfNotPresent
