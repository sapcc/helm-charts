owner-info:
  enabled: true
  support-group: containers
  service: go-pmtud
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/system/go-pmtud
  maintainers:
    - Dmitri Fedotov
    - Goeran Gudat
    - Marian Schwarz

global:
  registry:
  registryAlternateRegion: test

images:
  pmtud:
    tag: sha-5f4a649e70bdf16214456beb5c18fe9f05509ac1

pmtud:
  ttl: 10
  metricsPort: 30040
  nflogGroup: 33
  # relayBackend selects the ICMP replication transport: "l2" (default, raw Ethernet
  # over a shared L2 segment) or "udp" (unicast UDP, works across L3 boundaries).
  relayBackend: "l2"
  replicationPort: 4390

alerts:
  enabled: true
  ruleSelector:
    prometheus: kubernetes
  supportGroup: containers
