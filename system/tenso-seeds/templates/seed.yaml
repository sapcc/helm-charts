{{- $vbase  := .Values.global.vaultBaseURL | required "missing value for .Values.global.vaultBaseURL" -}}
{{- $region := .Values.global.region       | required "missing value for .Values.global.region"       -}}
{{- $tld    := .Values.global.tld          | required "missing value for .Values.global.tld"          -}}

apiVersion: "openstack.stable.sap.cc/v1"
kind: OpenstackSeed
metadata:
  name: tenso-seed

spec:
  requires:
    - {{ .Values.global.keystoneNamespace }}/keystone-seed
    - monsoon3/domain-default-seed
    - monsoon3/domain-ccadmin-seed

  roles:
    - name: objectstore_admin

  services:
    - name:        tenso
      type:        tenso
      description: 'Translation and delivery service for lifecycle events'
      enabled:     true
      endpoints:
        - region:    '{{ $region }}'
          interface: public
          enabled:   true
          url:       'https://tenso.{{ $region }}.{{ $tld }}'

  domains:
    - name: Default
      users:
        - name: tenso
          description: Tenso Service
          password: {{ printf "%s/%s/tenso/keystone-user/service/password" $vbase $region | quote }}
        - name: tenso-ansible
          description: Technical User for submitting events into Tenso from Ansible
          password: {{ printf "%s/%s/tenso/keystone-user/tenso-ansible/password" $vbase $region | quote }}
          role_assignments:
            # The policy identifies this user by name instead of by role, but we need a project role somewhere to discover Tenso via Keystone catalog.
            - project: service
              role:    service
        - name: tenso-concourse
          description: Technical User for submitting events into Tenso from Concourse
          password: {{ printf "%s/concourse/common/keystone-user-password/tenso-%s/value" $vbase ($region | contains "qa" | ternary "qa" "prod") | quote }}
          role_assignments:
            # The policy identifies this user by name instead of by role, but we need a project role somewhere to discover Tenso via Keystone catalog.
            - project: service
              role:    service

    - name: ccadmin
      projects:
        - name: master
          role_assignments:
            - user: tenso@Default
              role: service       # to validate users' Keystone tokens
            - user: tenso@Default
              role: objectstore_admin # to persist events into Swift
