apiVersion: v1
kind: Secret
metadata:
  name: opensearch-hermes-manager-elasticvue-secret
  namespace: hermes
  labels:
    system: opensearch-hermes
    service: audit
    component: opensearch-hermes-manager-elasticvue
type: Opaque
stringData:
  ELASTICVUE_CLUSTERS: '[{"name": "OpenSearch Hermes", "uri": "http://localhost:9201", "username": "{{.Values.global.users.admin.username_resolve}}", "password": "{{.Values.global.users.admin.password_resolve}}"}]'
