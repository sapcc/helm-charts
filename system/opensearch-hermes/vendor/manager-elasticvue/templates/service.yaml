apiVersion: v1
kind: Service
metadata:
  name: opensearch-hermes-manager-elasticvue
  namespace: hermes
  labels:
    system: opensearch-hermes
    service: audit
    component: opensearch-hermes-manager-elasticvue
    role: manager-elasticvue
spec:
  selector:
    component: opensearch-hermes-manager-elasticvue
    role: manager-elasticvue
  ports:
    - name: manager
      port: {{.Values.port_internal}}
      targetPort: {{.Values.port_internal}}
