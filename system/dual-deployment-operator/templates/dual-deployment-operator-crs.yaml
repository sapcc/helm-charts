{{/*
DualDeploymentOperator CR instances — one CR per enabled entry in .Values.dualDeploymentOperatorCRs.

Each key becomes the CR's metadata.name.

DEFAULTS MERGE: for each instance <name>, the chart deep-merges
.Values.dualDeploymentOperatorCRDefaults.<name> (shared, operator-wide defaults —
repo/name, shootNamespace, macdb prefixes, seed/shootValues, transformations, common
args/images) UNDER the per-instance .Values.dualDeploymentOperatorCRs.<name> (per-cluster
overrides — server, version, apiserver host, registry-url, LB IP, region). The instance
values win on conflict (mergeOverwrite right-hand precedence).

This lets per-cluster kube-secrets overlays specify ONLY what differs per shoot, with the
bulk of the (identical) config living once in the shared defaults.

NOTE on lists: deep-merge replaces lists wholesale (it does not merge element-by-element).
So macdb.macPrefixes / args / transformations defined in defaults are used as-is UNLESS an
instance supplies its own full list, which then replaces the default list.

Example:
  dualDeploymentOperatorCRDefaults:
    metal-operator-remote:
      shootNamespace: kube-system
      applyOrder: SeedFirst
      source:
        repo: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
        name: metal-operator-remote-ddo
      values: {...}          # macdb, probe images, most args, dnsRecordTemplate
      seedValues: {...}
      shootValues: {...}
      transformations: [...]
  dualDeploymentOperatorCRs:
    metal-operator-remote:
      enabled: true
      source: {version: "0.1.1"}
      shootAccess: {server: https://api.m-qa-de-200...}
      values:
        global: {region: qa-de-1, clusterType: garden2}
        virtualGardenLBIP: 10.246.83.235
        controllerManager: {manager: {env: {KUBERNETES_SERVICE_HOST: ...}}}
*/}}
{{- range $name, $instance := .Values.dualDeploymentOperatorCRs }}
{{- /* Fail-safe: a CR renders ONLY when its instance explicitly sets enabled: true.
       Missing/nil enabled defaults to false — no CR is emitted. */}}
{{- if $instance.enabled | default false }}
{{- $defaults := get $.Values.dualDeploymentOperatorCRDefaults $name | default dict }}
{{- $cr := mergeOverwrite (deepCopy $defaults) (deepCopy $instance) }}
---
apiVersion: dual-deployment-operator.cc.sap/v1alpha1
kind: DualDeploymentOperator
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  applyOrder: {{ $cr.applyOrder | default "SeedFirst" }}

  shootNamespace: {{ required (printf "dualDeploymentOperatorCRs.%s.shootNamespace is required (set in defaults or instance)" $name) $cr.shootNamespace | quote }}

  shootAccess:
    secretName: {{ (($cr.shootAccess).secretName) | default "dual-deployment-operator-shoot-access" | quote }}
    server: {{ required (printf "dualDeploymentOperatorCRs.%s.shootAccess.server is required" $name) (($cr.shootAccess).server) | quote }}

  source:
    helm:
      repo: {{ required (printf "dualDeploymentOperatorCRs.%s.source.repo is required (set in defaults or instance)" $name) (($cr.source).repo) | quote }}
      name: {{ required (printf "dualDeploymentOperatorCRs.%s.source.name is required (set in defaults or instance)" $name) (($cr.source).name) | quote }}
      version: {{ required (printf "dualDeploymentOperatorCRs.%s.source.version is required" $name) (($cr.source).version) | quote }}
      {{- if $cr.values }}
      {{- /*
           Token substitution in the rendered values block. Shared defaults carry
           ${REGION} and ${CLUSTERTYPE} tokens so per-cluster overlays don't repeat
           region/clusterType-derived strings (macdb vault paths, DNS zone, registry-url):
             ${REGION}      -> values.global.region
             ${CLUSTERTYPE} -> values.global.clusterType
           Lists still replace wholesale on merge — but with these tokens the args list
           and macdb list can live entirely in the shared defaults.
      */}}
      {{- $region := (($cr.values).global).region | default "" }}
      {{- $clusterType := (($cr.values).global).clusterType | default "" }}
      {{- $renderedValues := toYaml $cr.values }}
      {{- if $region }}
      {{- $renderedValues = $renderedValues | replace "${REGION}" $region }}
      {{- end }}
      {{- if $clusterType }}
      {{- $renderedValues = $renderedValues | replace "${CLUSTERTYPE}" $clusterType }}
      {{- end }}
      values:
        {{- $renderedValues | nindent 8 }}
      {{- end }}
      {{- if $cr.seedValues }}
      seedValues:
        {{- toYaml $cr.seedValues | nindent 8 }}
      {{- end }}
      {{- if $cr.shootValues }}
      shootValues:
        {{- toYaml $cr.shootValues | nindent 8 }}
      {{- end }}
  {{- if $cr.transformations }}
  transformations:
    {{- toYaml $cr.transformations | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
