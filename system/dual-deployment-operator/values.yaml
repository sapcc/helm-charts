# Wrapper values for the dual-deployment-operator controller subchart (alias: controller).
# Only values that diverge from the subchart defaults are set here.
controller:
  enabled: true

  manager:
    image:
      # Pin by digest to the in-cluster-pullable keppel mirror. The @sha256: form suppresses
      # the :tag suffix (manager.yaml:106 `contains "@"` guard).
      repository: keppel.eu-de-2.cloud.sap/i-cant-believe-its-not-cloud-infrastructure-dev/dual-deployment-operator@sha256:66e753a85c99b6210fc875a179964d89e940c95f29eb9c07c18efcc613a6567e
      pullPolicy: IfNotPresent
    envOverrides:
      # main.go:213: webhook setup runs unless ENABLE_WEBHOOKS == "false".
      # certManager.enabled=false (default) → no TLS cert → webhook server crashloops.
      ENABLE_WEBHOOKS: "false"

  shootRbac:
    # SHOOT-READY: emit the shoot-applier bootstrap ManagedResource + token-requestor Secret
    # to the shoot. Per-shoot = per-shoot-cluster, so the static SA name is unique per shoot.
    enabled: true
    # required{} in applier-bootstrap.yaml:20-21 and remote-kubeconfig.yaml:13-14.
    # These equal the chart defaults (values.yaml:177,179) but must be explicit here because
    # enabled: true triggers the required{} checks at render time.
    serviceAccountName: dual-deployment-operator-shoot-applier
    serviceAccountNamespace: kube-system

  metrics:
    # Secure metrics endpoint needs a cert; certManager is off → disable metrics.
    enabled: false

  crd:
    # Seed-scoped CRD. The prod release (shoot--cp--m-<region>) is the durable owner
    # (crd.enabled: true). Non-owner releases set crd.enabled: false in their per-shoot
    # values file. NEVER flip the owner to false (resource-policy: keep orphans the CRD).
    enabled: true
    keep: true

# ---------------------------------------------------------------------------
# DualDeploymentOperator CR instances.
#
# Two maps, both keyed by CR name (= CR metadata.name):
#   dualDeploymentOperatorCRDefaults.<name>  — shared, operator-wide defaults (this file).
#   dualDeploymentOperatorCRs.<name>         — per-cluster enable + overrides (kube-secrets).
#
# For each enabled instance the template deep-merges defaults UNDER the instance
# (instance wins). Per-cluster overlays therefore specify ONLY what differs per shoot:
# typically source.version, shootAccess.server, the apiserver host, --registry-url,
# virtualGardenLBIP, and global.region/clusterType.
#
# Lists (macdb.macPrefixes, args, transformations) are replaced wholesale on merge,
# not merged element-by-element — override the whole list in the instance if needed.
# ---------------------------------------------------------------------------

# Shared defaults per operator. These are the fields identical across all shoots of a
# given operator. Having them here means a per-cluster overlay only sets the diff.
dualDeploymentOperatorCRDefaults:
  metal-operator-remote:
    shootNamespace: kube-system          # load-bearing — metal-operator SA lives in kube-system
    applyOrder: SeedFirst
    shootAccess:
      secretName: dual-deployment-operator-shoot-access
    source:
      repo: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
      name: metal-operator-remote-ddo
      # version is per-cluster (pinned in the instance overlay)
    values:
      global:
        tld: cloud.sap
        linkerd_enabled: false
        linkerd_requested: false
      controllerManager:
        manager:
          image:
            repository: keppel.global.cloud.sap/ccloud-ghcr-io-mirror/ironcore-dev/metal-operator-controller-manager
            tag: sha-23966a7
          env:
            KUBERNETES_CLUSTER_DOMAIN: cluster.local
            KUBECONFIG: /var/run/remote-kubeconfig/kubeconfig
          args:
            - --mac-prefixes-file=/etc/macdb/macdb.yaml
            - --probe-image=keppel.global.cloud.sap/ccloud-ghcr-io-mirror/ironcore-dev/metalprobe:v0.6.0
            - --probe-os-image=keppel.global.cloud.sap/ccloud-ghcr-io-mirror/gardenlinux/gardenlinux-sci:2150.6.0-baremetal-capi-amd64-2150-6-0-297ce257
            - --manager-namespace=metal-servers
            - --dns-record-template-path=/etc/metal-operator/dns/bmc_dns.yaml
            - --insecure=false
            - --enforce-first-boot
            - --enforce-power-off
            # NOTE: --registry-url is per-cluster — set it in the instance overlay args.
      dnsRecordTemplate:
        enabled: true
        zone: cc.qa-de-1.cloud.sap
      macdb:
        macPrefixes:
          - macPrefix: c4cbe1b1
            manufacturer: Dell
            protocol: Redfish
            port: 443
            type: bmc
            defaultCredentials:
              - username: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/username" }}'
                password: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/password" }}'
          - macPrefix: d08e79
            manufacturer: Dell
            protocol: Redfish
            port: 443
            type: bmc
            defaultCredentials:
              - username: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/username" }}'
                password: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/password" }}'
          - macPrefix: 0894ef
            manufacturer: Lenovo
            protocol: Redfish
            port: 443
            type: bmc
            defaultCredentials:
              - username: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/username" }}'
                password: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/password" }}'
          - macPrefix: 5ced8c
            manufacturer: HPE
            protocol: Redfish
            port: 443
            type: bmc
            defaultCredentials:
              - username: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/username" }}'
                password: '{{ resolve "vault+kvv2:///secrets/qa-de-1/ironic/ipmi-user/ironic/password" }}'
    seedValues:
      metal-operator-core:
        controllerManager: {enable: false}
        crd:               {enable: false}
        rbac:              {enable: false}
        webhook:           {enable: false}
        certmanager:       {enable: false}
        networkPolicy:     {enable: false}
        metrics:           {enable: false}
        prometheus:        {enable: false}
    shootValues:
      metal-operator-core:
        controllerManager: {enable: false}
        crd:               {enable: true}
        rbac:              {enable: true}
        webhook:           {enable: true}
        certmanager:       {enable: false}
        networkPolicy:     {enable: false}
        metrics:           {enable: false}
        prometheus:        {enable: false}
    transformations:
      - rewriteWebhookURL:
          urlPrefix: https://metal-operator-remote-webhook-service:443
      - patch:
          target:
            kind: ValidatingWebhookConfiguration
          strategicMerge:
            metadata:
              labels:
                dual-deployment-operator.cc.sap/webhook-injector: metal-operator

# Per-cluster enable + overrides. Empty by default — populated by kube-secrets overlays.
dualDeploymentOperatorCRs: {}
