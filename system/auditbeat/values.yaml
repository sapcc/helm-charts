global:
  prometheus: kubernetes
image:
  repository: beats/auditbeat-oss
  pullPolicy: IfNotPresent
  tag: "9.4.2-amd64"

# Flatcar only: turns on TTY auditing in Flatcar's PAM config
# (/usr/lib64/pam.d/system-auth). Set to false on other nodes, such as Garden Linux.
enable_pamd_tty: true

auditd:
  # Empty (Flatcar): auditbeat loads the chart's audit rules and is the only
  # receiver of the kernel's audit events (unicast).
  # multicast: for nodes that run their own auditd with their own rules, such as
  # Garden Linux. auditbeat then listens next to auditd in the host network (the
  # kernel multicasts audit events only there) and loads no rules, because
  # loading rules first deletes all audit rules on the node.
  socket_type: ""

elasticsearch:
  enabled: false
  # host:
  port: "443"
  # username:
  # password:
  protocol: https

logstash:
  enabled: true
  host: logstash-audit-external-beats
  port: "5044"

labels: {}

serviceAccount:
  create: true
  name: auditbeat

resources:
  limits:
    cpu: 1000m
    memory: 500Mi
  requests:
    cpu: 100m
    memory: 100Mi

exporter:
  image:
    repository: auditbeat-exporter
    tag: "20260528135218"
    pullPolicy: IfNotPresent
  metrics:
    port: "5971"
  resources:
    limits:
      memory: 50Mi
    requests:
      cpu: 100m
      memory: 25Mi
