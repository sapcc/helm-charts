apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: jitterentropy-rngd
  name: jitterentropy-rngd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jitterentropy-rngd
  updateStrategy:
    rollingUpdate:
      maxUnavailable: '10%'
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jitterentropy-rngd
    spec:
      priorityClassName: system-node-critical
      containers:
      - name: jitterentropy-rngd
        imagePullPolicy: IfNotPresent
        image: "{{ required ".Values.images.jitterentropy_rngd.image is missing" .Values.images.jitterentropy_rngd.image }}:{{ required ".Values.images.jitterentropy_rngd.tag is missing" .Values.images.jitterentropy_rngd.tag }}"
        args:
{{ toYaml .Values.args | indent 8 }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            # CAP_SYS_ADMIN is required for the RNDADDENTROPY ioctl on
            # /dev/random, which both mixes in the generated bytes and
            # credits the kernel entropy count.
            add:
            - SYS_ADMIN
        resources:
{{ toYaml .Values.resources | indent 10 }}
      terminationGracePeriodSeconds: 5
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
      {{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{ toYaml . | indent 8 }}
      {{- end }}
