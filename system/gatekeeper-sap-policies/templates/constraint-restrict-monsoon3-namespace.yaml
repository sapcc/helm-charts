{{- if .Values.policies.restrictMonsoon3Namespace.enabled }}
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: GkRestrictMonsoon3Namespace
metadata:
  name: restrict-monsoon3-namespace
  labels:
    severity: 'error'
spec:
  enforcementAction: {{ .Values.policies.restrictMonsoon3Namespace.enforcementAction }}
  match: {{ include "gatekeeper-policies.match-active-helm-releases" . | indent 4 }}
  parameters:
    patterns:
      {{- if eq .Values.cluster.type "baremetal" }}
      # NOTE: PRs that extend this list with entries for new services will be rejected.
      #       Please deploy new services into their own namespaces instead.
      monsoon3: "^(?:archer|barbican|baremetal-temper|bastion|ccloud-seeder|ceph-ceed|cinder|designate|glance|hardware-console-exporter|ironic|keystone|kmip|kubernikus|kvm-cinder-netapp-operator|manila|manila-nanny|nannies|neutron|nova|octavia|octobus|openstack-exporter|openstack-seeder|placement|pyroscope|sap-seeds|seeds|vcenter-operator|volume-claims)$"
      monsoon3global: "^(?:andromeda|andromeda-seed|designate-global|keystone-global|openstack-seeder-global|seeds-global)$"
      {{- else }}
      # no Helm releases allowed at all in these namespaces for this cluster
      monsoon3: ""
      monsoon3global: ""
      {{- end }}
{{- end }}
