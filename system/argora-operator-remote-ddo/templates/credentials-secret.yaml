{{/*
=============================================================================
credentials-secret.yaml — argora controller credentials (mode=seed, additions)
=============================================================================
The upstream subchart (templates/extras/secret.yaml) emits a Secret named
`argora-operator-secret` (origin=upstream) that the controller Deployment mounts
as `secret-volume`. The DualDeploymentOperator CR's
`filterKinds: {kinds: [Secret], source: upstream}` transformation drops that
upstream Secret from BOTH renders (it must not reach the shoot, m-qa-de-200).

Transformations are render-global, so filtering the upstream Secret also removes
it from the SEED — where the controller pod needs it. We therefore re-emit the
SAME-named Secret here as an ADDITIONS-origin object, rendered only on the seed:
  - seed render : upstream copy filtered out, this additions copy survives -> pod mounts it.
  - shoot render: upstream copy filtered out, this template does not render -> no credentials on the shoot.
Reusing the subchart's Secret name keeps the Deployment's hard-coded mount intact.

${REGION} substitution: the credential values are vault+kvv2:// `{{ resolve ... }}`
directives consumed by secrets-injector in-cluster (NOT Helm). Substitute the
${REGION} token with .Values.global.region using `replace` (surgical), NOT `tpl`
(`tpl` would try to evaluate the resolve directive and fail). Mirrors
metal-operator-remote-ddo/templates/macdb.yaml.
*/}}
{{- if eq .Values.mode "seed" }}
apiVersion: v1
kind: Secret
metadata:
  name: argora-operator-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: {{ toJson (index .Values "argora-operator-core" "credentials") | replace "${REGION}" (.Values.global.region | default "") | quote }}
{{- end }}
