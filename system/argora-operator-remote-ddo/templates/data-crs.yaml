{{- if eq .Values.mode "shoot" }}
{{- if .Values.clusterImport }}
{{- range $name, $clusters := .Values.clusterImport }}
---
apiVersion: argora.cloud.sap/v1alpha1
kind: ClusterImport
metadata:
  name: {{ $name }}
  namespace: kube-system
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" $ | nindent 4 }}
spec:
  clusters:
{{ toYaml $clusters | nindent 4 }}
{{- end }}
{{- end }}
{{- if .Values.ipPoolImport }}
{{- range $name, $ippools := .Values.ipPoolImport }}
---
apiVersion: argora.cloud.sap/v1alpha1
kind: IPPoolImport
metadata:
  name: {{ $name }}
  namespace: kube-system
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" $ | nindent 4 }}
spec:
  ippools:
{{ toYaml $ippools | nindent 4 }}
{{- end }}
{{- end }}
{{- if .Values.update }}
{{- range $name, $clusters := .Values.update }}
---
apiVersion: argora.cloud.sap/v1alpha1
kind: Update
metadata:
  name: {{ $name }}
  namespace: kube-system
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" $ | nindent 4 }}
spec:
  clusters:
{{ toYaml $clusters | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
