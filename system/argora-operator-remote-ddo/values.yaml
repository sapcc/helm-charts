# =============================================================================
# argora-operator-remote-ddo values
# =============================================================================
#
# MODE CONTRACT (DO NOT SET mode HERE):
#   The dual-deployment-operator injects .Values.mode = "seed" | "shoot" at
#   render time. The chart MUST NOT declare a default for `mode` — the operator
#   rejects any render whose user values contain `mode`.
#
#   Per-mode subchart flags are supplied via the DualDeploymentOperator CR:
#     spec.source.helm.seedValues
#     spec.source.helm.shootValues
#
# =============================================================================

# ---------------------------------------------------------------------------
# Upstream subchart — ALL per-mode enable flags OFF by default.
# The CR's seedValues/shootValues drive these per mode (see MODE CONTRACT above).
# NEVER enable manager, RBAC, CRDs, metrics, Prometheus, or cert-manager here.
# ---------------------------------------------------------------------------
argora-operator-core:
  # Load-bearing: preserve legacy shoot RBAC names and token-requestor identity.
  fullnameOverride: argora-operator
  manager:
    enable: false
    # The live seed controller uses the default ServiceAccount.
    serviceAccountName: default
    # Gardener seed NetworkPolicy is default-deny egress. These pod labels open
    # the egress paths the seed-resident controller needs (DNS, private/public
    # networks, runtime + kube apiserver, istio ingress). Static + region-generic,
    # identical on every cluster — so they live here in the chart (as the legacy
    # chart carried them), NOT in the per-cluster CR. Without them the controller
    # cannot resolve names or reach the shoot.
    podLabels:
      networking.gardener.cloud/to-dns: allowed
      networking.gardener.cloud/to-private-networks: allowed
      networking.gardener.cloud/to-public-networks: allowed
      networking.gardener.cloud/to-runtime-apiserver: allowed
      networking.resources.gardener.cloud/to-all-istio-ingresses-istio-ingressgateway-tcp-9443: allowed
      networking.resources.gardener.cloud/to-kube-apiserver-tcp-443: allowed
    # Mount the Gardener token-requestor kubeconfig Secret (emitted seed-side by
    # templates/remote-kubeconfig.yaml) at the in-cluster SA path, so the
    # seed-resident controller authenticates to the shoot as
    # argora-operator-controller-manager. Paired with manager.env.KUBERNETES_SERVICE_HOST
    # (per-cluster, set in the CR). Static mount — lives here, not the CR.
    volumes:
      - name: remote-kubeconfig
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
        source:
          secret:
            secretName: argora-operator-remote-kubeconfig
            items:
              - key: token
                path: token
              - key: bundle.crt
                path: ca.crt
  rbac:
    enable: false
  crd:
    enable: false
  metrics:
    enable: false
  prometheus:
    enable: false
  certManager:
    enable: false
  ironcore:
    enable: true
  netboxURL: "https://netbox-url"

  # These vault+kvv2 resolve directives are consumed by secrets-injector
  # in-cluster (NOT Helm). The ${REGION} token is substituted with
  # .Values.global.region by templates/credentials-secret.yaml (a surgical
  # `replace`, NOT `tpl` — `tpl` would choke on the {{ resolve }} directive).
  # The upstream subchart Secret is dropped by the CR's filterKinds; the
  # seed-only additions Secret in credentials-secret.yaml is what the pod mounts.
  credentials:
    bmcUser: "{{ resolve `vault+kvv2:///secrets/${REGION}/metal-api/remoteboards/users/metal/username` }}"
    bmcPassword: "{{ resolve `vault+kvv2:///secrets/${REGION}/metal-api/remoteboards/users/metal/password` }}"
    netboxToken: "{{ resolve `vault+kvv2:///secrets/shared/daybreak/netbox-auth/default/token` }}"

# ---------------------------------------------------------------------------
# Global values — per-cluster, supplied via CR values
# ---------------------------------------------------------------------------
global:
  region: ""
  clusterType: ""
  tld: cloud.sap
  linkerd_enabled: false
  linkerd_requested: false
