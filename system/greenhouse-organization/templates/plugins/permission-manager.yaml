{{- if .Values.permissionmanager.enabled }}
apiVersion: greenhouse.sap/v1alpha1
kind: Plugin
metadata:
  name: permission-manager
  namespace: greenhouse
spec:
  pluginDefinitionRef:
    name: permission-manager
    kind: ClusterPluginDefinition
  releaseNamespace: greenhouse
  releaseName: permission-manager
  optionValues:
    {{- if and .Values.permissionmanager.ccrn .Values.permissionmanager.ccrn.apiGroups }}
    - name: ccrn.apiGroups
      value:
        {{- toYaml .Values.permissionmanager.ccrn.apiGroups | nindent 8 }}
    {{- end }}
    {{- if and .Values.permissionmanager.providers .Values.permissionmanager.providers.kubernetes }}
    - name: providers.kubernetes
      value: {{ .Values.permissionmanager.providers.kubernetes | quote }}
    {{- end }}
    {{- if and .Values.permissionmanager.providers .Values.permissionmanager.providers.github }}
    - name: providers.github
      value: {{ .Values.permissionmanager.providers.github | quote }}
    {{- end }}
    {{- if and .Values.permissionmanager.manager .Values.permissionmanager.manager.maxConcurrentReconciles }}
    - name: manager.maxConcurrentReconciles
      value: {{ .Values.permissionmanager.manager.maxConcurrentReconciles }}
    {{- end }}
    - name: rbac.namespaced
      value: false
    - name: metrics.enabled
      value: false
    - name: metrics.secure
      value: false
{{ end }}