apiVersion: v1
kind: ConfigMap
metadata:
  name: metal-onboarding-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metal-onboarding-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  netboxURL: {{ .Values.netbox.url | quote }}
  clusterName: {{ .Values.clusterName | quote }}
  dhcpLeaseNamespace: {{ .Values.dhcpLeaseNamespace | quote }}
  leaderElect: {{ .Values.leaderElect | quote }}
