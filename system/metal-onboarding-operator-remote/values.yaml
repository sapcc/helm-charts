owner-info:
  support-group: containers
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/system/metal-onboarding-operator-remote

# managedResourceNamespace is the shoot control plane namespace where ManagedResource
# objects are created so Gardener reconciles RBAC to the m-cluster.
# Example: shoot--cp--m-qa-de-100. Falls back to the release namespace when empty.
managedResourceNamespace: ""

metal-onboarding-operator:
  image:
    repository: keppel.eu-de-2.cloud.sap/i-cant-believe-its-not-cloud-infrastructure-dev/metal-onboarding-operator
    tag: sha-52c3e72

  # NetBox settings — url is required. A token is optional: NetBox read access is
  # unauthenticated, so leave tokenSecret.name empty unless your instance requires auth.
  netbox:
    url: ""
    tokenSecret:
      name: ""
      key: token

  # Name of this cluster, used by the NetBox provider to gate ClusterGate decisions.
  clusterName: ""

  leaderElect: false  # only one replica runs per remote cluster

  leaderElect: true

  podLabels:
    networking.gardener.cloud/to-dns: allowed
    networking.gardener.cloud/to-private-networks: allowed
    networking.gardener.cloud/to-public-networks: allowed
    networking.gardener.cloud/to-runtime-apiserver: allowed
    networking.resources.gardener.cloud/to-all-istio-ingresses-istio-ingressgateway-tcp-9443: allowed
    networking.resources.gardener.cloud/to-kube-apiserver-tcp-443: allowed

  rbac:
    create: false  # RBAC for dhcpleases/bmcs is delivered to the m-cluster via ManagedResource

  # remoteAPIServer is the m-cluster kube-apiserver address (host:port). Required.
  # Gardener injects the token/CA into the <release-name>-remote-kubeconfig Secret via token-requestor.
  remoteAPIServer: ""

  serviceAccount:
    create: true
    name: ""

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # labelMap maps Kubernetes label keys to dot-separated NetBox device JSON paths.
  # The entries below mirror the hardcoded defaults already applied by the operator.
  # Add extra entries here for any additional NetBox fields you want as labels.
  # Note: kubernetes.metal.cloud.sap/nodename and /bb are derived by splitting the
  # device name on "-" and cannot be expressed as JSON paths.
  labelMap:
    topology.kubernetes.io/region: site.region.slug
    topology.kubernetes.io/zone: site.slug
    kubernetes.metal.cloud.sap/cluster: cluster.name
    kubernetes.metal.cloud.sap/cluster-type: cluster.type.slug
    kubernetes.metal.cloud.sap/name: name
    kubernetes.metal.cloud.sap/type: device_type.slug
    kubernetes.metal.cloud.sap/role: device_role.slug
    kubernetes.metal.cloud.sap/platform: platform.slug
