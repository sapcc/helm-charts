apiVersion: v1
kind: ServiceAccount
metadata:
  name: metal-onboarding-operator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metal-onboarding-operator
rules:
  - apiGroups: ["dhcp.metal.ironcore.dev"]
    resources: ["dhcpleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metal.ironcore.dev"]
    resources: ["bmcs"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metal-onboarding-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metal-onboarding-operator
subjects:
  - kind: ServiceAccount
    name: metal-onboarding-operator
    namespace: kube-system
