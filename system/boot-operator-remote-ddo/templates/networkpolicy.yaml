{{- if eq .Values.mode "seed" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metalapi-ingress-to-boot-operator-boot-service-tcp-8082
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8082
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: boot-operator-core
      app.kubernetes.io/instance: boot-operator-remote
      control-plane: controller-manager
  policyTypes:
    - Ingress
{{- end }}
