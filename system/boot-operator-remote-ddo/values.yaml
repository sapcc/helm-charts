# =============================================================================
# boot-operator-remote-ddo values
# =============================================================================
#
# MODE CONTRACT (DO NOT SET mode HERE):
#   The dual-deployment-operator injects .Values.mode = "seed" | "shoot" at
#   render time. The chart MUST NOT declare a default for `mode` — the operator
#   rejects any render whose user values contain `mode`.
#
#   Per-mode subchart flags are supplied via the DualDeploymentOperator CR:
#     spec.source.helm.seedValues
#     spec.source.helm.shootValues
#
# =============================================================================

# load-bearing: helm fullname template yields "boot-operator" for all objects
fullnameOverride: boot-operator

# ---------------------------------------------------------------------------
# Upstream subchart — ALL flags OFF by default.
# The CR's seedValues/shootValues drive these per mode (see MODE CONTRACT above).
# NEVER set controllerManager.enable=true here — this chart owns the Deployment.
# ---------------------------------------------------------------------------
boot-operator-core:
  controllerManager:
    enable: false
    # Shoot RBAC binds this upstream SA in kube-system (the shoot release namespace).
    serviceAccountName: boot-operator-controller-manager
    # Chart defaults to the PUBLIC upstream registry (ghcr.io/ironcore-dev/boot-operator).
    # SAP deployments override repository to the in-landscape keppel mirror via the
    # DualDeploymentOperator CR values (see cc/kube-secrets).
    manager:
      image:
        repository: ghcr.io/ironcore-dev/boot-operator
      # Gardener seed NetworkPolicy is default-deny egress. These pod labels open
      # the egress paths the seed-resident controller needs (DNS, private/public
      # networks, runtime + kube apiserver, istio ingress). Static + region-generic,
      # identical on every cluster — so they live here in the chart, NOT in the
      # per-cluster CR. Without them the controller cannot resolve names or reach
      # the shoot.
      volumes:
        - name: remote-kubeconfig
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
          source:
            secret:
              secretName: boot-operator-remote-kubeconfig
              items:
                - key: token
                  path: token
                - key: bundle.crt
                  path: ca.crt
    pod:
      labels:
        networking.gardener.cloud/to-dns: allowed
        networking.gardener.cloud/to-private-networks: allowed
        networking.gardener.cloud/to-public-networks: allowed
        networking.gardener.cloud/to-runtime-apiserver: allowed
        networking.resources.gardener.cloud/to-all-istio-ingresses-istio-ingressgateway-tcp-9443: allowed
        networking.resources.gardener.cloud/to-kube-apiserver-tcp-443: allowed
  crd:
    enable: false
  rbac:
    enable: false
  webhook:
    enable: false
  metrics:
    enable: false
  prometheus:
    enable: false
  certmanager:
    enable: false
  networkPolicy:
    enable: false

# ---------------------------------------------------------------------------
# boot Service (seed)
# ---------------------------------------------------------------------------
bootService:
  ports:
    - port: 8082
      protocol: TCP
      targetPort: 8082
  type: ClusterIP

# ---------------------------------------------------------------------------
# Global values — per-cluster, supplied via CR values
# ---------------------------------------------------------------------------
global:
  region: ""
  clusterType: ""
  tld: ""
  linkerd_enabled: false
  linkerd_requested: false
