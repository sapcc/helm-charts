{{- if and .Values.webhookInjector.metrics.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ipam-capi-remote.fullname" . }}-webhook-injector
  labels:
    {{- include "ipam-capi-remote.labels" . | nindent 4 }}
    prometheus: {{ required ".Values.webhookInjector.metrics.prometheus must be set when webhookInjector.metrics.enabled is true" .Values.webhookInjector.metrics.prometheus }}
spec:
  selector:
    matchLabels:
      {{- include "ipam-capi-remote.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook-injector-metrics
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: 60s
      relabelings:
        - targetLabel: job
          replacement: ipam-capi-webhook-injector
{{- end }}
