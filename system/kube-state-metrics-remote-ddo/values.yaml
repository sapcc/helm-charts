kubeStateMetrics:
  container:
    args:
      - --port=30090
      - --telemetry-port=30091
      - --custom-resource-state-config-file=/etc/config/custom-resource-state.yaml
      - --custom-resource-state-only=true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    env:
      kubernetesServiceHost: kube-apiserver
    image:
      # Chart defaults to the PUBLIC upstream registry (registry.k8s.io). SAP
      # deployments override repository to the in-landscape keppel mirror via the
      # DualDeploymentOperator CR values (see cc/kube-secrets).
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: v2.15.0
  nodeSelector:
    kubernetes.io/os: linux
  ports:
  - name: metrics
    port: 30090
    targetPort: metrics
  - name: telemetry
    port: 30091
    targetPort: telemetry
  replicas: 1
  serviceAccount:
    annotations: {}
  strategy:
    type: Recreate
  type: ClusterIP

config:
  customResourceStateYaml: ""

nameOverride: kube-state-metrics-remote
fullnameOverride: kube-state-metrics-remote
greenhouseScrapeTarget: kube-monitoring
remoteRBACNamespace: kube-system
serviceAccount:
  name: kube-state-metrics-remote
