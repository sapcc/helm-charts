---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: oobsubnets.dhcp.metal.ironcore.dev
spec:
  group: dhcp.metal.ironcore.dev
  names:
    kind: OOBSubnet
    listKind: OOBSubnetList
    plural: oobsubnets
    singular: oobsubnet
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cidr
      name: CIDR
      type: string
    - jsonPath: .spec.gateway
      name: Gateway
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OOBSubnet defines an IPv4 pool for out-of-band / BMC management ports. Each
          instance selects subnets by label, allocates addresses from them, and optionally
          filters by MAC allowlist or delays offers to let other instances respond first.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bootURL:
                description: |-
                  BootURL, when set, is sent as the DHCP boot file URL (BootFileName field) in
                  the offer/ack. Used for per-pool UEFI HTTP boot or iPXE chain-loading.
                type: string
              cidr:
                description: CIDR is the IPv4 network from which addresses are allocated,
                  e.g. "10.0.1.0/24".
                type: string
              dnsServers:
                description: |-
                  DNSServers overrides the global DNS server list (option 6) for clients in this subnet.
                  When empty the global dnsServers value applies.
                items:
                  type: string
                type: array
              domain:
                description: |-
                  Domain overrides the global DNS search domain (option 15) for clients in this subnet.
                  When empty the global domain value applies.
                type: string
              gateway:
                description: Gateway, when set, is excluded from allocation and offered
                  as the router.
                type: string
              leaseTime:
                description: |-
                  LeaseTime is the default lease duration for addresses from this subnet. When
                  unset the server-wide lease_time plugin value applies.
                type: string
              macList:
                description: |-
                  MacList is the MAC set the filter mode operates on. Entries may be colon-, dash-, or
                  separator-free, any case; they are normalized before matching. Ignored when Mode is
                  allowAll.
                items:
                  type: string
                type: array
              mode:
                default: allowAll
                description: |-
                  Mode selects the MAC filter posture: allowAll serves every MAC (macList ignored),
                  allow serves only MACs in macList (empty => serve nobody), deny serves every MAC
                  except those in macList.
                enum:
                - allowAll
                - allow
                - deny
                type: string
              rangeEnd:
                type: string
              rangeStart:
                description: |-
                  RangeStart and RangeEnd optionally narrow allocation to a window within CIDR
                  (inclusive). When unset the whole usable host range is used.
                type: string
              responseDelay:
                description: |-
                  ResponseDelay, when non-zero, delays the DHCP offer by the given duration.
                  Use on catch-all / fallback instances so that instances with a tighter filter
                  can win the race on shared BMC subnets.
                type: string
              staticLeases:
                description: StaticLeases pins specific MACs to fixed IPs within this
                  subnet, bypassing dynamic allocation.
                items:
                  description: StaticLease pins a MAC address to a fixed IP within
                    the subnet, bypassing dynamic allocation.
                  properties:
                    hostname:
                      description: Hostname is the optional hostname to include in
                        the DHCP offer (option 12).
                      type: string
                    ip:
                      description: IP is the fixed IPv4 address to offer to this MAC.
                      format: ipv4
                      type: string
                    mac:
                      description: MAC is the hardware address of the client, e.g.
                        "00:11:22:33:44:55".
                      pattern: ^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$
                      type: string
                  required:
                  - ip
                  - mac
                  type: object
                type: array
            required:
            - cidr
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
