apiVersion: v1
kind: ConfigMap
metadata:
  name: metaldhcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metaldhcp
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    server4:
      listen:
        - {{ .Values.server.listenAddr | quote }}
      plugins:
        - lease_time: {{ .Values.server.leaseTime }}
        - server_id: {{ .Values.externalIP }}
        - netmask:{{ if .Values.server.netmask }} {{ .Values.server.netmask }}{{ end }}
        - oob: /etc/metaldhcp/oob.yaml
  oob.yaml: |
    namespace: {{ .Values.oob.namespace }}
    {{- with .Values.oob.subnetLabels }}
    subnetLabels:
      {{- range . }}
      - key: {{ .key }}
        value: {{ .value | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.oob.staticLeases }}
    staticLeases:
      {{- range . }}
      - mac: {{ .mac | quote }}
        ip: {{ .ip }}
        {{- if .hostname }}
        hostname: {{ .hostname }}
        {{- end }}
      {{- end }}
    {{- end }}
