apiVersion: v1
kind: ConfigMap
metadata:
  name: metaldhcp-remote-kubeconfig
  namespace: {{ .Release.Namespace }}
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        certificate-authority: /var/run/secrets/kubernetes.io/remote-serviceaccount/ca.crt
        server: https://{{ required "remoteAPIServer is required" .Values.remoteAPIServer }}
      name: remote
    contexts:
    - context:
        cluster: remote
        user: sa
      name: remote
    current-context: remote
    users:
    - name: sa
      user:
        tokenFile: /var/run/secrets/kubernetes.io/remote-serviceaccount/token
