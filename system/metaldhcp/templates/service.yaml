apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
  - name: dhcp
    port: 67
    protocol: UDP
    targetPort: 67
  type: LoadBalancer
  loadBalancerIP: {{ .Values.externalIP }}
  externalTrafficPolicy: Local
