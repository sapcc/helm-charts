owner-info:
  support-group: containers
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/system/metaldhcp

image:
  repository: keppel.eu-de-2.cloud.sap/i-cant-believe-its-not-cloud-infrastructure-dev/metaldhcp
  tag: "sha-4bfbeb9"

# remoteAPIServer is the m-cluster kube-apiserver address (host:port).
# Gardener injects the token/CA into the metaldhcp-remote-kubeconfig Secret via token-requestor.
remoteAPIServer: ""

# managedResourceNamespace is the namespace where ManagedResource and Secret objects for
# Gardener-managed CRDs are created. Must be a shoot control plane namespace (e.g.
# shoot--cp--m-qa-de-100) so Gardener's ResourceManager reconciles them to the m-cluster.
# Leave empty to fall back to the Helm release namespace.
managedResourceNamespace: ""

# externalIP is the fixed OOB IP assigned to this DHCP server via LoadBalancer.
# DHCP clients and relay agents send requests to this address.
externalIP: ""

server:
  listenAddr: "0.0.0.0:67"
  leaseTime: 3600s
  logLevel: info
  healthAddr: ":8080"
  netmask: "255.255.255.0"

oob:
  # Namespace where DHCPLease CRs are written and OOBSubnet CRs are read from.
  namespace: metal-servers
  # subnetLabels selects OOBSubnet CRs as allocation pools.
  subnetLabels:
    - key: dhcp
      value: "true"
  staticLeases: []
  # - mac: "aa:bb:cc:dd:ee:ff"
  #   ip: 10.0.0.200
  #   hostname: node-static-01
  reclaimGrace: ""
