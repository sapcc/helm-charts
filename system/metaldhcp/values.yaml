owner-info:
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/system/metaldhcp

image:
  repository: keppel.global.cloud.sap/ccloud-ghcr-io-mirror/sap-cloud-infrastructure/metaldhcp
  tag: "sha-3c5da3c"

# externalIP is the fixed OOB IP assigned to this DHCP server via LoadBalancer.
# DHCP clients and relay agents send requests to this address.
externalIP: ""

server:
  listenAddr: "0.0.0.0:67"
  leaseTime: 3600s
  logLevel: info
  netmask: "255.255.255.0"

oob:
  # Namespace where DHCPLease CRs are written and OOBSubnet CRs are read from.
  namespace: metal-servers
  # subnetLabels selects OOBSubnet CRs as allocation pools.
  subnetLabels:
    - key: dhcp
      value: "true"
  staticLeases: []
  # - mac: "aa:bb:cc:dd:ee:ff"
  #   ip: 10.0.0.200
  #   hostname: node-static-01
