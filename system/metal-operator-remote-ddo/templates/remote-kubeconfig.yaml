{{/*
Workload token-requestor Secret (mode=seed, origin: additions).

This is the metal-operator controller-manager's OWN shoot credential — distinct
from the dual-deployment-operator's applier credential (dual-deployment-operator-shoot-access,
provisioned by the operator install chart's shootRbac). The controller-manager runs in
the seed CP namespace and reconciles metal CRs on the shoot; it mounts this token via
KUBECONFIG=/var/run/remote-kubeconfig/kubeconfig (see controller-manager.yaml volumes +
remote-kubeconfig-configmap.yaml).

MUST NOT be shared with the operator's applier Secret: the operator authenticates as its
own SA; conflating the two would (a) give the controller-manager the broad bind/escalate
applier grant, and (b) re-couple the operator's auth to the workload teardown set, causing
the self-deauthentication finalizer deadlock. Minted for the workload SA
metal-operator-controller-manager (created by the upstream subchart shoot render).
Gardener fills token + bundle.crt and rotates them.
*/}}
{{- if eq .Values.mode "seed" }}
apiVersion: v1
kind: Secret
metadata:
  name: metal-operator-remote-kubeconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    resources.gardener.cloud/purpose: token-requestor
    resources.gardener.cloud/class: shoot
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
    serviceaccount.resources.gardener.cloud/name: metal-operator-controller-manager
    serviceaccount.resources.gardener.cloud/namespace: kube-system
    serviceaccount.resources.gardener.cloud/inject-ca-bundle: "true"
type: Opaque
stringData:
  token: ""
  bundle.crt: ""
{{- end }}
