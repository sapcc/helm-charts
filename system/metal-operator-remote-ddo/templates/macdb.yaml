{{- if eq .Values.mode "seed" }}
apiVersion: v1
kind: Secret
metadata:
  name: macdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
    # macdb BMC credentials stay as vault+kvv2:// references.
    # secrets-injector resolves them in-cluster on the seed.
    # Do NOT add cloud.sap/inject-secrets:"false" — no opt-out needed.
type: Opaque
stringData:
  macdb.yaml: |
{{- /*
  Substitute the ${REGION} token in the vault+kvv2:// paths with .Values.global.region.
  Use `replace` (surgical), NOT `tpl`: the values contain a {{ resolve ... }} directive
  consumed by secrets-injector, not Helm — `tpl` would try to evaluate it and fail.
*/}}
{{ toYaml .Values.macdb | replace "${REGION}" (.Values.global.region | default "") | indent 4 }}
{{- end }}
