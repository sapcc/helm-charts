{{/*
oidc-ias ClusterRoleBindings + metal-api-viewer ClusterRole + dns-records RBAC.
All mode=shoot. Group names are region-gated (contains "qa-de-" → QA groups).
*/}}
{{- if eq .Values.mode "shoot" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cc:oidc-ias-admin
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ if contains "qa-de-" .Values.global.region -}} CC_IAS_CONTROLPLANE_QA_ADMIN {{- else -}} CC_IAS_CONTROLPLANE_PROD_ADMIN {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cc:oidc-ias-viewer
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ if contains "qa-de-" .Values.global.region -}} CC_IAS_CONTROLPLANE_QA_DEVELOPER {{- else -}} CC_IAS_CONTROLPLANE_PROD_DEVELOPER {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cc:oidc-ias-metal-viewer
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metal-api-viewer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ if contains "qa-de-" .Values.global.region -}} CC_IAS_CONTROLPLANE_QA_DEVELOPER {{- else -}} CC_IAS_CONTROLPLANE_PROD_DEVELOPER {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cc:oidc-ias-servermaintenance-editor
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: servermaintenance-editor-role
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: {{ if contains "qa-de-" .Values.global.region -}} CC_IAS_CONTROLPLANE_QA_DEVELOPER {{- else -}} CC_IAS_CONTROLPLANE_PROD_DEVELOPER {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metal-api-viewer
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
rules:
- apiGroups:
  - metal.ironcore.dev
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - boot.ironcore.dev
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ipam.metal.ironcore.dev
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ipam.cluster.x-k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
{{- if .Values.adminLDAPUsers }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ldap-cluster-admins
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  {{- range $val := .Values.adminLDAPUsers }}
  - kind: User
    name: {{ $val }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metal-operator-dns-records
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
rules:
  - apiGroups:
      - disco.stable.sap.cc
    resources:
      - records
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metal-operator-dns-records-rolebinding
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    {{- include "chart.additionsAnnotations" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metal-operator-dns-records
subjects:
  - kind: ServiceAccount
    name: metal-operator-controller-manager
    namespace: kube-system
{{- end }}
