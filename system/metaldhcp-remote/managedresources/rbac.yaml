---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metaldhcp
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metaldhcp
rules:
  - apiGroups: ["dhcp.metal.ironcore.dev"]
    resources: ["oobsubnets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dhcp.metal.ironcore.dev"]
    resources: ["dhcpleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metaldhcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metaldhcp
subjects:
  - kind: ServiceAccount
    name: metaldhcp
    namespace: kube-system
