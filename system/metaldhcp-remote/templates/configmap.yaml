apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  config.yaml: |
    server4:
      listen:
        - {{ .Values.server.listenAddr | quote }}
      plugins:
        - lease_time: {{ .Values.server.leaseTime }}
        - server_id: {{ .Values.externalIP }}
        - netmask:{{ if .Values.server.netmask }} {{ .Values.server.netmask }}{{ end }}
        - oob: /etc/metaldhcp/oob.yaml
        {{- if .Values.tftp.enabled }}
        - nbp: tftp://{{ required "externalIP is required when tftp.enabled" .Values.externalIP }}/snponly.efi
        {{- end }}
  oob.yaml: |
    {{- with .Values.oob.subnetLabels }}
    subnetLabels:
      {{- range . }}
      - key: {{ .key }}
        value: {{ .value | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.oob.subnets }}
    subnets:
      {{- range . }}
      - cidr: {{ .cidr }}
        {{- if .gateway }}
        gateway: {{ .gateway }}
        {{- end }}
        {{- if .rangeStart }}
        rangeStart: {{ .rangeStart }}
        {{- end }}
        {{- if .rangeEnd }}
        rangeEnd: {{ .rangeEnd }}
        {{- end }}
        {{- if .leaseTime }}
        leaseTime: {{ .leaseTime }}
        {{- end }}
        {{- if .bootURL }}
        bootURL: {{ .bootURL }}
        {{- end }}
        {{- with .staticLeases }}
        staticLeases:
          {{- range . }}
          - mac: {{ .mac | quote }}
            ip: {{ .ip }}
            {{- if .hostname }}
            hostname: {{ .hostname }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- if .mode }}
        mode: {{ .mode }}
        {{- end }}
        {{- with .macList }}
        macList:
          {{- range . }}
          - {{ . }}
          {{- end }}
        {{- end }}
        {{- if .responseDelay }}
        responseDelay: {{ .responseDelay }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with .Values.oob.dnsServers }}
    dnsServers:
      {{- range . }}
      - {{ . }}
      {{- end }}
    {{- end }}
    {{- with .Values.oob.domain }}
    domain: {{ . }}
    {{- end }}
    {{- with .Values.oob.ntpServers }}
    ntpServers:
      {{- range . }}
      - {{ . }}
      {{- end }}
    {{- end }}
