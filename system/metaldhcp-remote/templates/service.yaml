apiVersion: v1
kind: Service
metadata:
  name: metaldhcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metaldhcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: metaldhcp
  ports:
  - name: dhcp
    port: 67
    protocol: UDP
    targetPort: 67
  {{- if .Values.tftp.enabled }}
  - name: tftp
    port: 69
    protocol: UDP
    targetPort: 69
  {{- end }}
  type: LoadBalancer
  loadBalancerIP: {{ .Values.externalIP }}
  externalTrafficPolicy: Local
