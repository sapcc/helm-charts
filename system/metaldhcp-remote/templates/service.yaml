apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
  - name: dhcp
    port: 67
    protocol: UDP
    targetPort: 67
  # TFTP (port 69) is intentionally NOT exposed via the Service.
  # kube-proxy DNAT rewrites the destination IP which breaks TFTP because
  # tftpd must respond from externalIP. Instead, TFTP works via hostNetwork
  # + ip addr add of externalIP on the node (handled by init container).
  type: LoadBalancer
  loadBalancerIP: {{ .Values.externalIP }}
  externalTrafficPolicy: Local
