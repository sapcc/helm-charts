apiVersion: apps/v1
kind: Deployment
metadata:
  name: metaldhcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: metaldhcp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: metaldhcp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metaldhcp
        app.kubernetes.io/instance: {{ .Release.Name }}
        networking.gardener.cloud/to-dns: allowed
        networking.gardener.cloud/to-private-networks: allowed
        networking.gardener.cloud/to-public-networks: allowed
        networking.gardener.cloud/to-runtime-apiserver: allowed
        networking.resources.gardener.cloud/to-all-istio-ingresses-istio-ingressgateway-tcp-9443: allowed
        networking.resources.gardener.cloud/to-kube-apiserver-tcp-443: allowed
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: metaldhcp
      hostNetwork: true
      {{- if and .Values.tftp.enabled .Values.tftp.ipxeURL }}
      initContainers:
        - name: fetch-ipxe
          image: busybox:1.37
          command:
            - wget
            - -O
            - /ipxe/snponly.efi
            - {{ .Values.tftp.ipxeURL | quote }}
          volumeMounts:
            - name: ipxe-override
              mountPath: /ipxe
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/exclude-from-external-load-balancers
                operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - metaldhcp
              topologyKey: "kubernetes.io/hostname"
            weight: 10
      containers:
      - name: metaldhcp
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: IfNotPresent
        env:
          - name: KUBECONFIG
            value: /var/run/remote-kubeconfig/kubeconfig
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
        args:
          - --config=/etc/metaldhcp/config.yaml
          - --loglevel={{ .Values.server.logLevel }}
          - --health-addr={{ .Values.server.healthAddr }}
        ports:
        - containerPort: 67
          name: dhcp
          protocol: UDP
        - containerPort: 8080
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_BIND_SERVICE
            - NET_RAW
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/metaldhcp
          name: config
        - mountPath: /var/run/remote-kubeconfig
          name: remote-kubeconfig
        - mountPath: /var/run/secrets/kubernetes.io/remote-serviceaccount
          name: remote-serviceaccount
      {{- if .Values.tftp.enabled }}
      - name: tftpd
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        command: ["/tftpd"]
        args:
          - --root=/ipxe
        ports:
        - containerPort: 69
          name: tftp
          protocol: UDP
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_BIND_SERVICE
            - NET_RAW
            drop:
            - ALL
        {{- if .Values.tftp.ipxeURL }}
        volumeMounts:
        - name: ipxe-override
          mountPath: /ipxe
        {{- end }}
      {{- end }}
      {{- if .Values.debug.enabled }}
      - name: debug
        image: {{ .Values.debug.image }}
        command: ["sleep", "infinity"]
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_RAW", "NET_ADMIN"]
      {{- end }}
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          name: metaldhcp
        name: config
      - configMap:
          name: metaldhcp-remote-kubeconfig
        name: remote-kubeconfig
      - secret:
          secretName: metaldhcp-remote-kubeconfig
          items:
            - key: token
              path: token
            - key: bundle.crt
              path: ca.crt
        name: remote-serviceaccount
      {{- if and .Values.tftp.enabled .Values.tftp.ipxeURL }}
      - name: ipxe-override
        emptyDir: {}
      {{- end }}
