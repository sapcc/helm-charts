owner-info:
  support-group: containers
  helm-chart-url: https://github.com/sapcc/helm-charts/tree/master/system/metal-onboarding-operator

image:
  repository: keppel.global.cloud.sap/ccloud-ghcr-io-mirror/sap-cloud-infrastructure/metal-onboarding-operator
  tag: "latest"

# config values are rendered into a ConfigMap; string flags passed as --flag=val args to the manager
config:
  netboxURL: ""
  dhcpLeaseNamespace: ""
  clusterName: ""
  leaderElect: "true"

# Name/key of the Kubernetes Secret containing the NetBox API token
netbox:
  tokenSecret:
    name: ""
    key: token

rbac:
  create: true

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# labelMap maps Kubernetes label keys to dot-separated NetBox device JSON paths.
# Example:
#   kubernetes.metal.cloud.sap/rack: custom_fields.rack
#   kubernetes.metal.cloud.sap/tenant: tenant.slug
labelMap: {}
