apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: opensearch-logs-data-statefulset
  namespace: opensearch-logs
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: opensearch-logs-data
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        maxAllowed:
          memory: 12Gi
