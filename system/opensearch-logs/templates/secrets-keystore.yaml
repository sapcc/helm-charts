{{- if and .Values.scaleout.enabled .Values.s3.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: keystore-secrets
data:
  s3.client.default.access_key: {{ .Values.keystore.opensearch.default.access | b64enc }}
  s3.client.default.secret_key: {{ .Values.keystore.opensearch.default.key | b64enc }}
{{- if .Values.ceph.enabled  }}
  s3.client.ceph.access_key: {{ .Values.keystore.opensearch.ceph.access | b64enc }}
  s3.client.ceph.secret_key: {{ .Values.keystore.opensearch.ceph.key | b64enc }}
{{- end }}
{{- if contains "cronus" (.Values.global.data_stream.names | default "")  }}
  s3.client.maillog.access_key: {{ .Values.keystore.opensearch.maillog.access | b64enc }}
  s3.client.maillog.secret_key: {{ .Values.keystore.opensearch.maillog.key | b64enc }}
{{- end }}
{{- end }}
