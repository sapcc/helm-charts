# =============================================================================
# metal-maintenance-operator-remote-ddo values
# =============================================================================
#
# MODE CONTRACT (DO NOT SET mode HERE):
#   The dual-deployment-operator injects .Values.mode = "seed" | "shoot" at
#   render time. The chart MUST NOT declare a default for `mode` — the operator
#   rejects any render whose user values contain `mode`.
#
#   Per-mode subchart flags are supplied via the DualDeploymentOperator CR:
#     spec.source.helm.seedValues
#     spec.source.helm.shootValues
#
# =============================================================================

# load-bearing: helm fullname template yields "metal-maintenance-operator" for all objects
fullnameOverride: metal-maintenance-operator

# ---------------------------------------------------------------------------
# Upstream subchart (alias: mmo-core) — ALL flags OFF by default.
# The CR's seedValues/shootValues drive these per mode (see MODE CONTRACT above).
# NEVER set mmo-core.manager.enabled=true here — the CR drives it per mode.
# ---------------------------------------------------------------------------
mmo-core:
  # load-bearing: subchart fullname → "metal-maintenance-operator-controller-manager"
  fullnameOverride: metal-maintenance-operator
  # -------------------------------------------------------------------------
  # Controller manager — STATIC, region-generic wiring only.
  #
  # Rule of thumb: static + public-safe config lives here in the PUBLIC
  # operand chart; static-but-SAP-internal config (keppel mirror image,
  # internal URLs) and per-cluster config live in the kube-secrets CR
  # (seedValues / shootValues / per-cluster overlay). Never set a default
  # for manager.enabled — the CR drives it per mode.
  #
  # This block is consumed only by the seed render (where manager.enabled is
  # flipped true by the CR). In shoot mode no Deployment renders, so the
  # block is inert there.
  # -------------------------------------------------------------------------
  manager:
    # Gardener seed NetworkPolicy is default-deny egress. These pod labels open
    # the egress paths the seed-resident controller needs (DNS, private/public
    # networks, runtime + kube apiserver, istio ingress). Static + region-generic,
    # identical on every cluster — so they live here, NOT in the per-cluster CR.
    pod:
      labels:
        networking.gardener.cloud/to-dns: allowed
        networking.gardener.cloud/to-private-networks: allowed
        networking.gardener.cloud/to-public-networks: allowed
        networking.gardener.cloud/to-runtime-apiserver: allowed
        networking.resources.gardener.cloud/to-all-istio-ingresses-istio-ingressgateway-tcp-9443: allowed
        networking.resources.gardener.cloud/to-kube-apiserver-tcp-443: allowed
    # Mount the Gardener token-requestor kubeconfig Secret (emitted seed-side by
    # templates/remote-kubeconfig.yaml) at the in-cluster SA path, so the
    # seed-resident controller authenticates to the shoot as
    # metal-maintenance-operator-controller-manager. Paired with
    # manager.envOverrides.KUBERNETES_SERVICE_HOST (per-cluster, set in the CR).
    # Static mount — lives here, not the CR.
    extraVolumes:
      - name: remote-kubeconfig
        secret:
          secretName: metal-maintenance-operator-remote-kubeconfig
          items:
            - key: token
              path: token
            - key: bundle.crt
              path: ca.crt
    extraVolumeMounts:
      - name: remote-kubeconfig
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
    # envOverrides is a string-valued MAP that APPENDS to the subchart's default
    # env list (preserving its POD_NAMESPACE fieldRef). Use this, never
    # manager.env (the list form would clobber POD_NAMESPACE). The webhook is
    # disabled (webhook.enable=false); this env mirrors the legacy controller.
    envOverrides:
      ENABLE_WEBHOOKS: "false"
  rbac:
    namespaced: false
    helpers:
      enable: false
  serviceAccount:
    enable: false
  webhook:
    enable: false
  certManager:
    enable: false
  metrics:
    enable: false
  prometheus:
    enable: false

# ---------------------------------------------------------------------------
# Global values — per-cluster, supplied via CR values
# ---------------------------------------------------------------------------
global:
  region: ""
  clusterType: ""
  tld: ""
  linkerd_enabled: false
  linkerd_requested: false
